<title>Facet Launch Film</title>
<meta name="description" content="Facet: agents defined by responsibility. A 25-second launch film, drawn and scored entirely in code.">
@@FONTS@@
<style>
:root { color-scheme: dark; --ink: #0d0b12; --ink2: #15121d; --bone: #efeae2; --dim: #8d8699;
  --spec: linear-gradient(90deg, #5fe3d7, #7aa8ff, #b58cff, #ff9ec2, #ffc877); }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--bone); font: 16px/1.5 "IBM Plex Mono", ui-monospace, monospace;
  display: grid; place-items: center; padding-inline: 16px; padding-block: 24px; box-sizing: border-box; }
.stage { width: min(100%, 1280px); display: grid; gap: 14px; }
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(239,234,226,.08), 0 30px 80px rgba(0,0,0,.6); background: #000; }
canvas { display: block; width: 100%; height: 100%; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(239,234,226,.06); }
.bar i { display: block; height: 100%; background: var(--spec); transform-origin: left; transform: scaleX(0); }
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
button { font: 600 13px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
  background: var(--bone); border: 0; border-radius: 999px; padding: 13px 20px 13px 16px; display: inline-flex; gap: 10px; align-items: center; cursor: pointer; }
button:hover { background: #fff; }
button:focus-visible { outline: 2px solid #7aa8ff; outline-offset: 3px; }
button svg { width: 16px; height: 16px; }
button.on { background: transparent; color: var(--bone); box-shadow: inset 0 0 0 1.5px rgba(239,234,226,.4); }
.meta { color: var(--dim); font-size: 12.5px; letter-spacing: .08em; display: flex; gap: 16px; flex-wrap: wrap; }
.meta b { color: var(--bone); font-weight: 500; }
</style>
<div class="stage">
  <div class="frame"><canvas id="film" width="1920" height="1080" aria-label="Facet launch film"></canvas><div class="bar"><i id="bar"></i></div></div>
  <div class="controls">
    <button id="play" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span>Play with sound</span></button>
    <div class="meta"><span id="time">0:00 / 0:25</span><span>Drawn and scored in code · <b>no footage, no samples</b></span></div>
  </div>
</div>
<script>
@@FILM@@
</script>
