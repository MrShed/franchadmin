<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#070b10">
<meta name="color-scheme" content="dark">
<title>Index Case</title>
<style>
:root{
  color-scheme:dark;
  --bg0:#04070a; --bg1:#080d13; --bg2:#0c131b;
  --panel:#0f171f; --panel2:#131d27; --panel3:#18242f; --lift:#1c2935;
  --line:#1b2833; --line2:#27394a; --line3:#34495c;
  --ink:#e9eff4; --ink2:#a4b3c0; --ink3:#6e8091; --ink4:#4a5a69;
  --ember:#ff7a45; --ember2:#ffa477; --hot:#ffe0c2; --emberglow:rgba(255,122,69,.35);
  --amber:#f2b640; --bone:#d9d3c7; --teal:#3fd0aa; --teal2:#8ce8cf; --ice:#8fcbff; --ice2:#c5e4ff;
  --violet:#a592ff; --red:#ff5a4f; --ok:#58d38c; --ghost:#7d93aa;
  --f-disp:"Avenir Next Condensed","Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --f-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"DejaVu Serif",serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --top:98px; --tabs:64px; --r:14px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:var(--f-body);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overflow:hidden;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 55% at 50% -12%,rgba(88,150,220,.13),transparent 62%),radial-gradient(90% 50% at 85% 112%,rgba(255,122,69,.08),transparent 60%),linear-gradient(180deg,#081019,#05080c 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(143,203,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(143,203,255,.028) 1px,transparent 1px);background-size:32px 32px;
  -webkit-mask-image:radial-gradient(90% 70% at 50% 30%,#000,transparent 85%);mask-image:radial-gradient(90% 70% at 50% 30%,#000,transparent 85%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;z-index:1}
.mono{font-family:var(--f-mono)}
.disp{font-family:var(--f-disp);font-stretch:condensed;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.eyebrow{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.eyebrow.em{color:var(--ember)}
.muted{color:var(--ink3)}
.dim{color:var(--ink2)}
.tn{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;
  background:linear-gradient(180deg,#1b2733,#141e28);border:1px solid var(--line2);color:var(--ink);font-weight:600;font-size:15px;letter-spacing:.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 14px rgba(0,0,0,.25);transition:transform .08s,background .15s,border-color .15s,opacity .15s}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.42}
.btn.pri{background:linear-gradient(180deg,#ff8a57,#f0602b);border-color:#ff9a6b;color:#1a0b04;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(255,122,69,.25),0 8px 26px rgba(255,100,50,.28)}
.btn.ice{background:linear-gradient(180deg,#a9d8ff,#76b6f2);border-color:#c5e4ff;color:#06121e;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(120,180,240,.22)}
.btn.teal{background:linear-gradient(180deg,#5fe0bd,#2fb893);border-color:#8ce8cf;color:#03140f}
.btn.danger{background:linear-gradient(180deg,#5b1d1a,#44130f);border-color:#8a2e27;color:#ffd9d3}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn.xs{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink2);flex:none}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{background:rgba(255,255,255,.06)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line2);background:rgba(19,29,39,.85);color:var(--ink2);font-size:13px;font-weight:600;white-space:nowrap;flex:none;transition:all .15s}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.chip.on{background:rgba(143,203,255,.14);border-color:rgba(143,203,255,.55);color:var(--ice2)}
.chip .sw{width:9px;height:9px;border-radius:50%;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);gap:2px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.02em;white-space:nowrap;padding:0 8px;transition:all .15s}
.seg button.on{background:linear-gradient(180deg,#223140,#1a2632);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.3)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font:600 11px/1 var(--f-body);letter-spacing:.03em;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.st-sus{color:#c9b58a;background:rgba(201,181,138,.1);border-color:rgba(201,181,138,.22)}
.st-prob{color:var(--ember2);background:rgba(255,164,119,.1);border-color:rgba(255,164,119,.25)}
.st-conf{color:var(--ember);background:rgba(255,122,69,.13);border-color:rgba(255,122,69,.35)}
.st-hosp{color:var(--amber);background:rgba(242,182,64,.12);border-color:rgba(242,182,64,.32)}
.st-icu{color:#ff8f7a;background:rgba(255,90,79,.13);border-color:rgba(255,90,79,.4)}
.st-died{color:var(--bone);background:rgba(217,211,199,.08);border-color:rgba(217,211,199,.25)}
.st-rec{color:var(--teal);background:rgba(63,208,170,.1);border-color:rgba(63,208,170,.25)}
.st-con{color:var(--ice);background:rgba(143,203,255,.08);border-color:rgba(143,203,255,.22)}
.st-neg{color:var(--ink3);background:rgba(110,128,145,.1);border-color:rgba(110,128,145,.25)}

/* ---------- panels ---------- */
.card{position:relative;background:linear-gradient(180deg,rgba(24,36,47,.92),rgba(15,23,31,.94));border:1px solid var(--line);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 12px 34px rgba(0,0,0,.35)}
.card.pad{padding:16px}
.card-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 0}
.card-h .t{flex:1;min-width:0}
.card-h h3{margin:3px 0 0;font:700 21px/1.05 var(--f-disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.01em}
.card-h .aside{font:12px var(--f-mono);color:var(--ink3);text-align:right;white-space:nowrap}
.card-b{padding:12px 16px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{font:600 10.5px/1.9 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.kv dd{margin:0;min-width:0}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.stat b{font:700 28px/1 var(--f-disp);font-stretch:condensed;letter-spacing:.01em}
.stat span{font-size:12px;color:var(--ink3)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ice)}
.empty{padding:28px 20px;text-align:center;color:var(--ink3);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink2);font:700 18px var(--f-disp);font-stretch:condensed;text-transform:uppercase;margin-bottom:4px;letter-spacing:.02em}
.note{font-size:12.5px;color:var(--ink3);line-height:1.5}
.lnk{color:var(--ice);border-bottom:1px solid rgba(143,203,255,.35);cursor:pointer;padding:0 1px;border-radius:2px}
.lnk:active{background:rgba(143,203,255,.15)}
.lnk.p{color:var(--ice2)}
.lnk.pl{color:var(--teal2);border-bottom-color:rgba(140,232,207,.35)}
.lnk.dt{color:var(--amber);border-bottom-color:rgba(242,182,64,.35)}

/* ---------- game frame ---------- */
#game{display:flex;flex-direction:column}
#topbar{flex:none;padding:var(--safe-t) calc(10px + var(--safe-r)) 0 calc(14px + var(--safe-l));position:relative;z-index:20;
  background:linear-gradient(180deg,rgba(6,10,15,.96),rgba(9,14,20,.9));border-bottom:1px solid rgba(143,203,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tb-row{display:flex;align-items:center;gap:8px;height:54px}
.tb-day{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}
.tb-day b{font:700 30px/1 var(--f-disp);font-stretch:condensed;letter-spacing:.01em;white-space:nowrap}
.tb-day b small{font-size:13px;color:var(--ink3);letter-spacing:.14em;margin-right:4px;vertical-align:.45em}
.tb-day .sub{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tb-day .sub span{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-day .sub i{font:600 10px var(--f-mono);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-end{min-height:42px;padding:0 15px;border-radius:12px;font:700 15px var(--f-disp);font-stretch:condensed;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:7px;
  background:linear-gradient(180deg,#ff8a57,#ee5d28);color:#1c0b03;border:1px solid #ffa47c;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 22px rgba(255,110,60,.28)}
.tb-end svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tb-end:disabled{opacity:.4;box-shadow:none}
.tb-res{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:4px;height:44px;align-items:stretch;padding-bottom:6px;width:100%;text-align:left}
.rs{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.04);min-width:0}
.rs .l{font:600 9px/1 var(--f-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.rs .v{font:600 14px/1 var(--f-mono);white-space:nowrap;display:flex;align-items:baseline;gap:3px}
.rs .v small{font-size:10px;color:var(--ink3);font-weight:400}
.rs .m{display:flex;gap:2px;height:3px}
.rs .m i{flex:1;border-radius:2px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.rs .m i b{position:absolute;inset:0;right:auto;background:var(--ice);border-radius:2px}
.rs.warn .v{color:var(--amber)} .rs.bad .v{color:var(--red)}
.rs.bad{border-color:rgba(255,90,79,.3);background:rgba(255,90,79,.06)}
.tb-tabs{display:none}
#views{flex:1;position:relative;min-height:0;z-index:1}
.view{position:absolute;inset:0;display:none}
.view.on{display:block;animation:viewin .28s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:14px calc(14px + var(--safe-r)) 28px calc(14px + var(--safe-l))}
.vhead{display:flex;align-items:flex-end;gap:10px;margin:4px 2px 12px}
.vhead h2{margin:0;font:700 30px/1 var(--f-disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.01em;flex:1}
.vhead .eyebrow{margin-bottom:5px}
#tabbar{flex:none;height:calc(var(--tabs) + var(--safe-b));padding:0 var(--safe-r) var(--safe-b) var(--safe-l);display:grid;grid-template-columns:repeat(5,1fr);position:relative;z-index:20;
  background:linear-gradient(180deg,rgba(9,14,20,.92),rgba(5,8,12,.98));border-top:1px solid rgba(143,203,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink3);font:700 10.5px var(--f-mono);letter-spacing:.14em;position:relative;transition:color .15s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.tab.on{color:var(--ink)}
.tab.on svg{stroke:var(--ember);filter:drop-shadow(0 0 6px rgba(255,122,69,.55));transform:translateY(-1px)}
.tab.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--ember);border-radius:0 0 2px 2px;box-shadow:0 0 12px var(--ember)}
.badge{position:absolute;top:7px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ember);color:#1c0b03;font:700 10.5px/18px var(--f-body);letter-spacing:0;text-align:center;box-shadow:0 0 0 2px var(--bg1),0 0 10px rgba(255,122,69,.5)}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(2,4,7,.62);z-index:50;opacity:0;transition:opacity .22s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#scrim.on{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:calc(92vh - var(--safe-t));max-height:calc(92dvh - var(--safe-t));display:flex;flex-direction:column;
  background:linear-gradient(180deg,#16212c,#0e161e 140px);border-top:1px solid var(--line3);border-radius:22px 22px 0 0;
  box-shadow:0 -24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);transform:translateY(105%);transition:transform .3s var(--ease);padding-bottom:var(--safe-b)}
#sheet.on{transform:none}
#sheet.drag{transition:none}
.sh-grip{flex:none;height:22px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sh-grip::before{content:"";width:42px;height:5px;border-radius:3px;background:#3a4b5b}
.sh-head{padding:0 16px 10px;flex:none;display:flex;align-items:flex-start;gap:12px;touch-action:none}
.sh-head .t{flex:1;min-width:0}
.sh-head h3{margin:2px 0 0;font:700 25px/1.02 var(--f-disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.01em}
.sh-head .sub{font-size:13px;color:var(--ink2);margin-top:4px}
.sh-head .x{margin:-6px -6px 0 0}
.sh-body{overflow-y:auto;padding:4px 16px 20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-sec{margin:16px 0 8px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.18)}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .12s}
.li:last-child{border-bottom:0}
.li:active:not(:disabled){background:rgba(143,203,255,.06)}
.li .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:rgba(143,203,255,.08);color:var(--ice)}
.li .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:15px}
.li .tx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink3);font-size:12.5px;line-height:1.35;margin-top:1px}
.li .cost{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.li:disabled{opacity:.45}
.li .chev{width:18px;height:18px;stroke:var(--ink4);fill:none;stroke-width:2;flex:none}
.costs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.cst{display:inline-flex;align-items:center;gap:3px;height:21px;padding:0 7px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line2);font:600 11px var(--f-mono);color:var(--ink2);white-space:nowrap}
.cst.h{color:var(--ice2)} .cst.t{color:var(--teal2)} .cst.m{color:var(--amber)} .cst.s{color:var(--violet)} .cst.lag{color:var(--ink3);border-style:dashed}
.cst.no{color:var(--red);border-color:rgba(255,90,79,.4)}

/* ---------- popover / toast / overlays ---------- */
.pop{position:fixed;right:calc(10px + var(--safe-r));top:calc(58px + var(--safe-t));width:min(340px,calc(100vw - 20px));z-index:45;
  background:linear-gradient(180deg,#1b2835,#121b24);border:1px solid var(--line3);border-radius:16px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.7);animation:popin .2s var(--ease);transform-origin:90% 0}
@keyframes popin{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:none}}
.pop h4{margin:0 0 6px;font:700 22px/1 var(--f-disp);font-stretch:condensed;text-transform:uppercase}
.pop p{margin:0 0 10px;color:var(--ink2);font-size:14px}
.pop ul{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.pop li{display:flex;gap:8px;align-items:baseline;color:var(--ink2)}
.pop li b{color:var(--ink);font-family:var(--f-mono);font-size:13px;min-width:48px}
.pop .row{display:flex;gap:8px}
.pop .row .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(var(--tabs) + var(--safe-b) + 14px);transform:translate(-50%,20px);opacity:0;z-index:60;
  background:rgba(22,33,44,.96);border:1px solid var(--line3);color:var(--ink);padding:11px 18px;border-radius:24px;font-size:14px;box-shadow:0 12px 34px rgba(0,0,0,.55);transition:all .25s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:rgba(255,90,79,.5);color:#ffd2cc}

#night{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .5s;text-align:center;padding:24px;
  background:radial-gradient(70% 50% at 50% 45%,rgba(30,50,75,.55),transparent 70%),#03060a}
#night.on{opacity:1;pointer-events:auto}
#night .n-ring{width:132px;height:132px;margin-bottom:16px}
#night .n-k{font:600 11px var(--f-mono);letter-spacing:.3em;color:var(--ink3);text-transform:uppercase}
#night .n-day{font:700 64px/1 var(--f-disp);font-stretch:condensed;letter-spacing:.01em}
#night .n-date{font-size:15px;color:var(--ink2)}
#night .n-sum{margin-top:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(420px,100%);min-height:62px}
#night .n-sum div{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);opacity:0;transform:translateY(8px);transition:all .4s var(--ease)}

  .rs{min-width:86px;padding:0 10px}
  #sheet{left:50%;right:auto;width:560px;bottom:auto;top:50%;border-radius:22px;border:1px solid var(--line3);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .25s var(--ease),opacity .2s;max-height:86vh}

}

/* ---------- lab ---------- */
.lab-grid{display:flex;flex-direction:column;gap:14px}
.lab-hero{border-color:rgba(255,122,69,.35);background:radial-gradient(120% 90% at 100% 0,rgba(255,122,69,.13),transparent 60%),linear-gradient(180deg,rgba(24,36,47,.92),rgba(15,23,31,.94))}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap-i{display:flex;align-items:center;gap:10px}
.cap-i .ring{width:58px;height:58px;flex:none}
.cap-i b{display:block;font:600 22px var(--f-mono)} .cap-i b small{font-size:12px;color:var(--ink3)}
.cap-i span{font-size:12px;color:var(--ink3)}
.q-list{display:flex;flex-direction:column;gap:4px}
.q-it{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.2);text-align:left}
.q-it b{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-it span{font:11px var(--f-mono);color:var(--ink3);flex:none}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(63,208,170,.25);border-top-color:var(--teal);animation:spin 1.1s linear infinite;flex:none}
.spin.v{border-color:rgba(165,146,255,.25);border-top-color:var(--violet)}
@keyframes spin{to{transform:rotate(360deg)}}
.tree-prev{display:block;width:100%;border-radius:12px;overflow:hidden;background:#060a0f;border:1px solid var(--line);margin-bottom:10px}
.tree-prev canvas{display:block}
.ww-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ww-c{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);text-align:left;min-width:0}
.ww-c .spark{width:100%;height:34px}
.ww-n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ww-v{display:flex;justify-content:space-between;align-items:baseline;font:11px var(--f-mono);color:var(--ink3)}
.ww-v b{font:600 13px var(--f-mono);color:var(--ink)}
.ww-v em{font-style:normal} .ww-v em.up{color:var(--ember)} .ww-v em.dn{color:var(--teal)}
.tv{position:fixed;inset:0;z-index:55;background:#060a0f;display:flex;flex-direction:column;opacity:0;transform:scale(.98);transition:all .25s var(--ease)}
.tv.on{opacity:1;transform:none}
.tv-bar{display:flex;align-items:center;gap:6px;padding:calc(6px + var(--safe-t)) 8px 6px;border-bottom:1px solid var(--line);background:rgba(10,16,22,.95)}
.tv-bar .t{flex:1} .tv-bar b{font:700 20px var(--f-disp);font-stretch:condensed;text-transform:uppercase}
.tv-cv{flex:1;position:relative;touch-action:none}
.tv-foot{padding:10px 16px calc(10px + var(--safe-b));font:11px var(--f-mono);color:var(--ink3);text-align:center;border-top:1px solid var(--line)}

/* ---------- actions ---------- */
.ords{display:flex;flex-direction:column;gap:10px}
.ord{padding:12px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.ord-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap} .ord-t b{font-weight:600} .ord-t span{font-size:12.5px;color:var(--teal2)}
.ord-m{display:flex;align-items:center;gap:10px;margin:8px 0} .ord-m .bar{flex:1} .ord-m em{font:11px var(--f-mono);font-style:normal;color:var(--ink2);white-space:nowrap}
.ord-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:11.5px var(--f-mono);color:var(--ink3)}
.ord-f b{color:var(--ink)} .ord-f .eco{color:var(--amber)}
.ord-f .btn{margin-left:auto}
.btn.armed{background:linear-gradient(180deg,#b33a2c,#8a2a20);border-color:#ff8c7a;color:#fff}
.ac-sec{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(20,30,40,.85),rgba(12,19,26,.9));overflow:hidden}
.ac-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;min-height:64px}
.ac-ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(255,122,69,.1);color:var(--ember2);border:1px solid rgba(255,122,69,.2)}
.ac-ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ac-h .t{flex:1;min-width:0} .ac-h b{display:block;font:700 20px/1.05 var(--f-disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.02em} .ac-h small{font-size:12.5px;color:var(--ink3)}
.ac-h .n{font:600 12px var(--f-mono);color:var(--ink3)}
.ac-h .chev{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2;transition:transform .2s}
.ac-sec.open .ac-h .chev{transform:rotate(90deg)}
.ac-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.ac-card{display:flex;flex-direction:column;gap:5px;padding:13px 14px;text-align:left;background:#0e161e;width:100%;transition:background .12s}
.ac-card:active{background:#15212c}
.ac-card.dis{opacity:.6}
.ac-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ac-t b{font-weight:600;font-size:15px} .ac-t em{font:600 10px var(--f-mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.ac-d{font-size:13px;color:var(--ink2);line-height:1.4}
.ac-e{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--teal2)} .ac-e svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none;margin-top:2px}
.ac-c{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.ac-c .costs{justify-content:flex-start}
.ac-why{font-size:12px;color:var(--amber)}
.cf-tgt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.cf-tgt b{font-weight:600}
.cf-row{margin:12px 0} .cf-row p{margin:3px 0 0;color:var(--ink2);font-size:14px} .cf-row .costs{justify-content:flex-start}
.cf-why{display:flex;gap:8px;align-items:center;margin:12px 0 0;color:var(--amber);font-size:13.5px}
.cf-why svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.field{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.seg.wrap{flex-wrap:wrap} .seg.wrap button{flex:1 1 auto}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--ember)}
.ordl{display:flex;flex-direction:column;gap:4px;counter-reset:o}
.ordl-i{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line);counter-increment:o}
.ordl-i .n::before{content:counter(o);font:600 12px var(--f-mono);color:var(--ember)}
.ordl-i .l{flex:1} .ordl-i .ibtn{width:40px;height:40px;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#2a3947,#3b5063)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#2f4152}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#dfe8ef);border:0;box-shadow:0 0 0 5px rgba(255,122,69,.28),0 4px 12px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 5px rgba(255,122,69,.28)}

/* ---------- briefing ---------- */
.br{position:absolute;inset:0}
.br-list{position:absolute;inset:0}
.br-read{position:absolute;inset:0;z-index:5;background:var(--bg1);transform:translateX(102%);transition:transform .3s var(--ease);box-shadow:-20px 0 50px rgba(0,0,0,.5)}
.br.reading .br-read{transform:none}
.vw-bar{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:4px;padding:0 10px 0 4px;border-bottom:1px solid var(--line);background:rgba(8,13,18,.95);z-index:2}
.vw-bar .t{flex:1;min-width:0;line-height:1.2} .vw-bar .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#br-doc{padding:18px 14px 40px}
.ib{display:flex;flex-direction:column}
.ib-day{display:flex;align-items:center;gap:10px;padding:16px 2px 8px;font:600 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.ib-day::after{content:"";flex:1;height:1px;background:var(--line)}
.ib-it{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px;margin-bottom:6px;border-radius:14px;background:rgba(18,28,37,.72);border:1px solid var(--line);position:relative;transition:background .15s,border-color .15s}
.ib-it:active,.ib-it.sel{background:rgba(30,44,58,.9);border-color:var(--line3)}
.ib-it.read{background:rgba(12,19,26,.5)} .ib-it.read .ib-tx b{font-weight:500;color:var(--ink2)}
.ib-it.urgent{border-color:rgba(255,122,69,.45);box-shadow:inset 3px 0 0 var(--ember)}
.ib-it.ask{border-color:rgba(242,182,64,.45)}
.ib-ic{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;background:rgba(143,203,255,.1);color:var(--ice)}
.ib-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.k-alert{background:rgba(255,90,79,.14)!important;color:#ff8f7a!important} .k-lab{background:rgba(63,208,170,.12)!important;color:var(--teal2)!important} .k-result{background:rgba(63,208,170,.08)!important;color:var(--teal)!important}
.k-council{background:rgba(242,182,64,.12)!important;color:var(--amber)!important} .k-press{background:rgba(233,239,244,.08)!important;color:var(--ink)!important} .k-mayor{background:rgba(255,122,69,.13)!important;color:var(--ember2)!important}
.k-rumour{background:rgba(165,146,255,.13)!important;color:var(--violet)!important} .k-mentor{background:rgba(143,203,255,.12)!important;color:var(--ice2)!important} .k-death{background:rgba(217,211,199,.08)!important;color:var(--bone)!important} .k-interview{background:rgba(143,203,255,.1)!important;color:var(--ice)!important}
.chip .sw.k-alert,.chip .sw.k-lab,.chip .sw.k-result,.chip .sw.k-council,.chip .sw.k-press,.chip .sw.k-mayor,.chip .sw.k-rumour,.chip .sw.k-mentor,.chip .sw.k-death,.chip .sw.k-interview,.chip .sw.k-report,.chip .sw.k-system{background:currentColor!important}
.ib-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ib-from{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.ib-tx b{font-weight:600;font-size:15px;line-height:1.3}
.ib-sn{font-size:12.5px;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.ib-ask{font-style:normal;color:var(--amber);font-weight:600}
.ib-dot{position:absolute;right:12px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember)}
/* documents */
article{max-width:680px;margin:0 auto;font-size:15.5px;line-height:1.6}
article h1{margin:6px 0 12px;font:700 30px/1.02 var(--f-disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.01em}
article p{margin:0 0 12px;color:#d3dde6}
article h5{margin:18px 0 6px;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ember2)}
article blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--ice);background:rgba(143,203,255,.06);border-radius:0 10px 10px 0;font:italic 16px/1.55 var(--f-serif);color:#e3ecf3}
article blockquote cite{display:block;font:600 10.5px var(--f-mono);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.m-mono{font:12.5px/1.6 var(--f-mono);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;color:var(--teal2);margin:0 0 12px;overflow-x:auto}
.m-note{font-size:13px;color:var(--ink3)!important;font-style:italic}
.m-tbl{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:12px}
.m-tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.m-tbl th{font:600 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:9px 10px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
.m-tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.m-tbl tr:last-child td{border-bottom:0}
.d-memo .mm-h{display:flex;gap:24px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.d-memo .mm-h b{display:block;font-weight:600;font-size:14px}
.d-alert .al-band{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:12px;border-radius:10px;background:linear-gradient(90deg,rgba(255,90,79,.22),rgba(255,90,79,.04));color:#ffb3a8;font:700 12px var(--f-mono);letter-spacing:.2em;text-transform:uppercase}
.d-alert .al-band svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.d-press{background:#ebe5d8;color:#1e1b16;padding:18px 18px 22px;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-.4deg);background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(0,0,0,.03))}
.d-press .pr-mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #1e1b16;padding-bottom:6px;margin-bottom:10px;font:700 17px var(--f-serif);letter-spacing:.02em}
.d-press .pr-mast em{font:italic 12px var(--f-serif)}
.d-press h1{font:800 34px/1 var(--f-serif);font-stretch:normal;text-transform:none;letter-spacing:-.01em;color:#111;margin:4px 0 12px}
.d-press p{color:#2a261f;font:15px/1.55 var(--f-serif)}
.d-press .pr-body{columns:2 150px;column-gap:18px}
.d-press .lnk{color:#1c3d78;border-bottom-color:rgba(28,61,120,.4)}
.d-press blockquote{background:none;border-left-color:#1e1b16;color:#1e1b16}
.d-call .cl-card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:radial-gradient(120% 100% at 0 0,rgba(255,122,69,.18),transparent 60%),rgba(18,28,37,.9);border:1px solid rgba(255,122,69,.3);margin-bottom:14px}
.cl-face{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px rgba(255,122,69,.25)}
.cl-face.big{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cl-face svg{width:100%;height:100%}
.d-call .cl-card b{display:block;font:700 22px var(--f-disp);font-stretch:condensed;text-transform:uppercase}
.cl-wave{display:flex;gap:3px;align-items:center;height:16px;margin-top:4px}
.cl-wave i{width:3px;border-radius:2px;background:var(--ember);animation:wave 1s ease-in-out infinite}
.cl-wave i:nth-child(2n){animation-delay:.15s} .cl-wave i:nth-child(3n){animation-delay:.3s}
@keyframes wave{0%,100%{height:4px}50%{height:16px}}
.d-call blockquote{border-left-color:var(--ember);background:rgba(255,122,69,.06)}
.d-rumour .ru-post{padding:14px;border-radius:16px;background:#141a24;border:1px solid rgba(165,146,255,.3);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ru-h{display:flex;gap:10px;align-items:center;margin-bottom:10px} .ru-h b{display:block;font-size:14px} .ru-h span{font-size:12px;color:var(--ink3)}
.ru-av{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 40deg,#a592ff,#5f4bd1,#a592ff)}
.d-rumour h4{margin:0 0 8px;font-size:17px}
.d-minutes{font-family:var(--f-serif)}
.d-minutes .mn-h{text-align:center;border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:14px}
.d-minutes h1{font:700 26px/1.1 var(--f-serif);font-stretch:normal;text-transform:none}
.d-minutes .mn-d{font:12px var(--f-mono);color:var(--ink3)}
.d-minutes p{font:15.5px/1.6 var(--f-serif)}
.d-lab{position:relative;padding:16px;border-radius:14px;background:linear-gradient(180deg,#0f1c1e,#0b1416);border:1px solid rgba(63,208,170,.25)}
.d-lab .lb-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed rgba(63,208,170,.3);padding-bottom:8px;margin-bottom:4px}
.d-lab .lb-d{font:12px var(--f-mono);color:var(--ink3)}
.lb-stamp{display:inline-block;margin:0 0 12px;padding:5px 12px;border:2px solid currentColor;border-radius:6px;font:800 14px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;transform:rotate(-3deg)}
.lb-stamp.pos{color:var(--ember)} .lb-stamp.neg{color:var(--teal)} .lb-stamp.flu{color:var(--ink2)}
.d-mentor .mt-h,.d-iv .iv-h{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.d-mentor .mt-h b,.d-iv .iv-h b{display:inline-block;font-weight:600;font-size:16px;margin:2px 0} .d-mentor .mt-h span,.d-iv .iv-h span{display:block;font-size:12.5px;color:var(--ink3)}
.d-mentor p{font:16px/1.6 var(--f-serif);color:#dbe5ee}
.d-death{text-align:center;padding:24px 8px;color:var(--bone)}
.d-death h1{font:400 28px/1.2 var(--f-serif);font-stretch:normal;text-transform:none;color:var(--bone)}
.d-death .dt-d{font:12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:16px}
.d-death p{font:16px/1.6 var(--f-serif);color:#cfc9bd}
.dt-rule{width:60px;height:1px;background:rgba(217,211,199,.4);margin:18px auto}
.chs{max-width:680px;margin:18px auto 0;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.chs.done p{margin:4px 0 0;color:var(--ink)}
.ch{display:flex;flex-direction:column;gap:3px;text-align:left;padding:13px 14px;border-radius:14px;background:rgba(18,28,37,.9);border:1px solid var(--line2);min-height:56px}
.ch b{font-weight:600} .ch small{font-size:12.5px;color:var(--ink3)}
.ch-go{font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--ember2);text-transform:uppercase}
.ch.armed{border-color:var(--ember);background:rgba(60,26,14,.6)}

/* whiteboard */
.wb{position:relative;padding:16px 14px;border-radius:18px;background:radial-gradient(120% 60% at 50% 0,rgba(143,203,255,.07),transparent 70%),linear-gradient(180deg,#131e28,#0c141b);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 50px rgba(0,0,0,.4)}

.wb-h h3{margin:3px 0 0;font:700 26px/1 var(--f-disp);font-stretch:condensed;text-transform:uppercase}
.wb-n{font:12px var(--f-mono);color:var(--ink3)}
.wb-keys{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:12px;color:var(--ink2)} .wb-keys .bar{flex:0 0 90px}
.wb-r{padding:12px 0 10px;border-top:1px solid var(--line)}

.wb-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wb-l{font:700 18px var(--f-disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.wb-key{font:600 8.5px var(--f-mono);font-style:normal;letter-spacing:.14em;color:var(--ember);border:1px solid rgba(255,122,69,.5);border-radius:4px;padding:1px 4px}
.wb-v{font:600 17px var(--f-mono);color:var(--ink);text-align:right}
.wb-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wb-opts button{min-height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--ink2);font-size:13.5px;font-weight:600}
.wb-opts button.on{border-color:var(--ember);background:rgba(255,122,69,.16);color:#ffd9c7}

.wb-scale{display:flex;justify-content:space-between;font:10.5px var(--f-mono);color:var(--ink3);margin-top:-6px}

/* mentor */
.mentor{padding:16px}
.mt-card{display:flex;gap:14px;align-items:center}

.mt-bio{font:14.5px/1.5 var(--f-serif);color:var(--ink2);margin:12px 0 0}

.mt-t:disabled{opacity:.45}
.mt-n{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-mono);border:1.5px solid var(--ice);color:var(--ice)}

/* ---------- coach marks ---------- */
#coach{position:fixed;inset:0;z-index:80;pointer-events:none}
.co-spot{position:fixed;border-radius:14px;box-shadow:0 0 0 2px rgba(255,164,119,.9),0 0 26px 4px rgba(255,122,69,.45),0 0 0 9999px rgba(2,4,7,.5);transition:all .35s var(--ease);pointer-events:none}
#coach:not(.has-el) .co-spot{box-shadow:0 0 0 9999px rgba(2,4,7,.62)}
.co-spot::after{content:"";position:absolute;inset:-6px;border-radius:18px;border:1.5px solid rgba(255,164,119,.6);animation:copulse 1.6s ease-out infinite}
@keyframes copulse{from{opacity:1;transform:scale(.96)}to{opacity:0;transform:scale(1.08)}}
.co-card{position:fixed;pointer-events:auto;padding:14px 16px;border-radius:16px;background:linear-gradient(180deg,#1e2c39,#151f29);border:1px solid rgba(255,164,119,.45);box-shadow:0 20px 50px rgba(0,0,0,.6);transition:top .3s var(--ease),left .3s var(--ease)}
.co-k{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
.co-card b{display:block;font:700 21px/1.05 var(--f-disp);font-stretch:condensed;text-transform:uppercase;margin:4px 0 6px}
.co-card p{margin:0 0 10px;font-size:14px;color:var(--ink2);line-height:1.5}
.co-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.co-wait{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ember2)}
.co-wait svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}

/* ---------- debrief ---------- */
#debrief{overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(90% 40% at 50% 0,rgba(255,122,69,.12),transparent 70%),#04070a}
.db-bg{display:none}
.db-in{max-width:760px;margin:0 auto;padding:calc(40px + var(--safe-t)) calc(18px + var(--safe-r)) calc(40px + var(--safe-b)) calc(18px + var(--safe-l))}
.db-hero h1{font:700 clamp(56px,17vw,110px)/.86 var(--f-disp);font-stretch:condensed;text-transform:uppercase;margin:12px 0 14px;letter-spacing:-.005em;text-shadow:0 0 50px rgba(255,122,69,.25)}
.db-hero>p{font-size:17px;color:var(--ink2);margin:0 0 20px;max-width:32em}
.db-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.db-big div{background:#0b1218;padding:14px}
.db-big b{display:block;font:700 40px/1 var(--f-disp);font-stretch:condensed}
.db-big span{font-size:12px;color:var(--ink3)}
.db-saved{margin:16px 0 0;font:italic 17px var(--f-serif);color:var(--teal2)}
.db-score{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.db-score div{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;color:var(--ink2)} .db-score b{font:600 13px var(--f-mono);color:var(--ink)}
.db-sec{margin-top:56px;opacity:0;transform:translateY(20px);transition:all .8s var(--ease)}
.db-sec.in{opacity:1;transform:none}
.db-sec>h2{margin:6px 0 14px;font:700 34px/1 var(--f-disp);font-stretch:condensed;text-transform:uppercase}
.db-sec>p{color:var(--ink2);margin:-4px 0 14px}
.db-sec .card{margin-bottom:12px}
.pc{border-radius:18px;overflow:hidden;border:1px solid rgba(255,122,69,.35);background:linear-gradient(180deg,#1a1410,#0e0c0b);box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 60px rgba(255,122,69,.08)}
.pc-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;gap:10px;padding:10px 14px 8px;border-bottom:1px solid rgba(255,164,119,.18);font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.pc-head span:first-child{color:#ffb48d}
.pc-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;grid-template-areas:"l l m" "t y m";gap:2px 10px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,164,119,.12);opacity:0;transform:rotateX(-80deg);transform-origin:50% 0;transition:all .6s var(--ease);transition-delay:calc(var(--i) * 110ms)}
.pc.in .pc-r{opacity:1;transform:none}
.pc-r:last-child{border-bottom:0}
.pc-l{grid-area:l;font:700 14px/1.1 var(--f-disp);font-stretch:condensed;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2)}
.pc-l i{display:inline;margin-left:6px;vertical-align:.2em;font:600 8.5px var(--f-mono);font-style:normal;letter-spacing:.14em;color:var(--ember)}
.pc-t{grid-area:t;font:600 15px var(--f-mono);color:#ffe0c2}
.pc-y{grid-area:y;font:13.5px var(--f-mono);color:var(--ink2)} .pc-y small{display:block;font-size:10.5px;color:var(--ink3)} .pc-y em{font-style:normal;color:var(--ink4)}
.pc-m{grid-area:m;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-mono)}
.pc-m svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6}
.pc-m.good{background:rgba(63,208,170,.18);color:var(--teal)} .pc-m.near{background:rgba(242,182,64,.16);color:var(--amber)} .pc-m.off{background:rgba(255,90,79,.16);color:var(--red)} .pc-m.none{color:var(--ink4)}
.pc-sym{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.pc-sym .eyebrow{flex-basis:100%;margin-bottom:2px}
.pc-sym span:not(.eyebrow){padding:5px 10px;border-radius:14px;background:rgba(255,122,69,.08);border:1px solid rgba(255,122,69,.2);font-size:13px} .pc-sym b{font:600 11.5px var(--f-mono);color:var(--ember2)}
.rp{position:relative;height:min(62vh,520px);border-radius:18px;overflow:hidden;border:1px solid var(--line2)}

.rp-ctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.rp-play{background:var(--ember);color:#1c0b03;border-radius:50%;width:48px;height:48px}
.rp-play svg{stroke:#1c0b03;fill:#1c0b03}
.rp-ctl input{flex:1}
.rp-n{font:600 13px var(--f-mono);min-width:48px;text-align:right;color:var(--ember2)}
.tt{position:relative;height:min(60vh,480px);border-radius:18px;overflow:hidden;border:1px solid var(--line2)}
.tt-cv{position:absolute;inset:0;touch-action:none}
.tt-info{position:absolute;left:10px;right:10px;top:10px;padding:8px 12px;border-radius:10px;background:rgba(6,10,15,.88);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);pointer-events:none}
.db-costs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.db-mem{text-align:center;padding:30px 0 10px}
.mem-h{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:10px}
.mem-h span{flex:0 1 80px;height:1px;background:rgba(217,211,199,.35)}
.mem-h .eyebrow{color:var(--bone);letter-spacing:.3em}
.mem-d{font:italic 17px var(--f-serif);color:#cfc9bd;margin:0 0 22px}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 22px;text-align:left}
.mem-p{border-top:1px solid rgba(217,211,199,.14);padding-top:8px}
.mem-p b{display:block;font:500 17px var(--f-serif);color:var(--bone)} .mem-p span{font-size:12.5px;color:var(--ink3)}
.db-foot{margin-top:56px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- wide screens ---------- */
@media (min-width:900px){
  .br-list{right:auto;width:420px;border-right:1px solid var(--line)}

}
