<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Covert Action</title>
<meta name="description" content="A from-memory recreation of the 1990 espionage classic: break-ins, codebreaking, wiretaps and car tails across a randomly generated international plot.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    box-sizing: border-box; font-family: monospace;
  }
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; outline: none;
  }
  #pad { display: none; width: 100%; max-width: 640px; box-sizing: border-box; padding: 10px 16px 14px; gap: 12px;
    justify-content: space-between; align-items: center; }
  #turn { display: none; flex: 1; align-items: center; justify-content: center; font: 12px/1.4 monospace; letter-spacing: .08em; color: #5c6072; text-transform: uppercase; text-align: center; padding: 0 24px; }
  body.touch:not(.land) #turn { display: flex; }
  body.touch.land #turn { display: none; }
  /* phone keyboard up: just ESC / TAB / HIDE under the screen */
  body.touch.kbup #stick, body.touch.kbup .side.right, body.touch.kbup #turn { display: none; }
  body.touch.kbup:not(.land) #pad { justify-content: center; padding: 8px 16px; }
  body.touch.kbup .mid { flex-direction: row; }
  body.touch #pad { display: flex; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
  body.touch { justify-content: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .side { display: flex; align-items: center; gap: 12px; }
  /* virtual thumbstick: touch anywhere in the zone, the stick centres under your thumb */
  #stick { position: relative; width: 150px; height: 150px; flex: none; touch-action: none; }
  #stick .base { position: absolute; box-sizing: border-box; width: 112px; height: 112px; left: 19px; top: 19px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #2c2f3a 0 55%, #1a1c24 70%, #0c0d12 100%); border: 2px solid #4a4e5e;
    box-shadow: inset 0 3px 10px #000a, 0 1px 0 #6a6e7e; transition: opacity .2s; }
  #stick .base::before, #stick .base::after { content: ''; position: absolute; left: 50%; top: 50%; background: #3a3e4c; transform: translate(-50%, -50%); }
  #stick .base::before { width: 70%; height: 2px; } #stick .base::after { width: 2px; height: 70%; }
  #stick .knob { position: absolute; box-sizing: border-box; width: 52px; height: 52px; left: 49px; top: 49px; border-radius: 50%; z-index: 1;
    background: radial-gradient(circle at 38% 32%, #9ea2b4, #5c6072 45%, #33364a 100%); border: 2px solid #1c1e28;
    box-shadow: 0 4px 8px #000c, inset 0 -3px 6px #0006; }
  #stick.on .knob { background: radial-gradient(circle at 38% 32%, #fff2a0, #d8b030 45%, #7a5c10 100%); }
  #stick.on .base { border-color: #8a7a3a; }
  .btns { display: grid; grid-template-columns: repeat(2, 60px); gap: 10px; }
  #pad button {
    font: bold 11px/1 monospace; letter-spacing: .05em; color: #d8d8e0;
    background: linear-gradient(#5c5c6c, #3c3c48); border: 2px solid #8c8c9c; border-bottom-color: #1c1c24; border-right-color: #1c1c24;
    border-radius: 3px; padding: 0; touch-action: none;
  }
  #pad button.on { background: #2034a8; color: #f8e030; }
  .btns button { height: 48px; }
  .mid { display: flex; flex-direction: column; gap: 8px; }
  /* landscape phone: the screen fills the height, stick on the left, buttons on the right */
  body.touch.land { flex-direction: row; justify-content: center; padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
  body.touch.land #pad { position: fixed; inset: 0; max-width: none; padding: 12px calc(env(safe-area-inset-right, 0px) + 14px) 14px calc(env(safe-area-inset-left, 0px) + 14px);
    pointer-events: none; align-items: stretch; }
  body.touch.land #pad .side { pointer-events: auto; flex-direction: column; justify-content: space-between; align-items: center; }
  body.touch.land #pad .side.left .mid { flex-direction: row; order: -1; }
  body.touch.land #pad .side.right { justify-content: space-between; }
  body.touch.land #pad .mid { gap: 6px; } body.touch.land #pad .mid button { width: 44px; }
  .mid button { width: 56px; height: 30px; }
  #pad #k-kb { display: none; background: linear-gradient(#b08a20, #7a5c10); color: #fff6c8; border-color: #e8c860; }
  body.typing #pad #k-kb { display: block; }
  /* the phone's own keyboard: an invisible text field that takes the letters */
  #kb { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px;
    -webkit-user-select: text; user-select: text; pointer-events: none; caret-color: transparent; background: transparent; color: transparent; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200" tabindex="0" aria-label="Covert Action game screen"></canvas>
<div id="turn">Turn your phone sideways for a bigger screen</div>
<input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="Keyboard input" tabindex="-1">
<div id="pad" aria-hidden="true">
  <div class="side left">
    <div id="stick"><div class="base"></div><div class="knob"></div></div>
    <div class="mid">
      <button data-k="menu" id="k-menu">ESC</button>
      <button data-k="alt2" id="k-alt2">TAB</button>
      <button id="k-kb" aria-label="Show keyboard">KEYS</button>
    </div>
  </div>
  <div class="side right">
  <div class="btns">
    <button data-k="alt" id="k-alt">GREN</button>
    <button data-k="fire" id="k-fire">FIRE</button>
    <button data-k="action" id="k-action">SEARCH</button>
    <button data-k="select" id="k-select">OK</button>
  </div>
  </div>
</div>
<script>
"use strict";
