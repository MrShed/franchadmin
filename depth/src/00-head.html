<style id="dx-css">
:root{
  --room:#0b0e0d; --room2:#141816;
  --enamel:#56625a; --enamel-l:#66736a; --enamel-d:#3a443d; --engr:#ece5cf; --engr-d:#b9b29c;
  --bake:#15110e; --steel:#9aa0a0;
  --phos:#8dffc0; --phos2:#c9ffe0; --phos-d:#2f7a52; --led:#ff3b2a; --vfd:#6dffd2; --amber:#ffb54a; --lamp:#ffd89a;
  --paper:#ece5d3; --paper2:#e3dbc6; --log:#d6dbcf; --log2:#c9cfc1; --rule:#aab4b3; --card:#f3ecd9;
  --ink:#1d2024; --ink2:#50575c; --ink3:#7b8185; --graphite:#3b4046; --red:#bf3526; --red2:#d8553f; --blue:#2c4f8f;
  --display:"DX Stencil","Arial Narrow",Impact,sans-serif; --serif:"DX Serif",Georgia,serif; --type:"DX Type","Courier New",monospace;
  --mono:"DX Mono",ui-monospace,Menlo,Consolas,monospace; --hand:"DX Hand","Bradley Hand","Segoe Print",cursive;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --tabh:66px; --toph:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--room);color:var(--engr);overflow:hidden;overscroll-behavior:none}
body{font:16px/1.5 var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.screen{position:fixed;inset:0}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.03em;line-height:1}
p{margin:0 0 .7em}
.eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--mono)}
.engr{font:700 13px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--engr);text-shadow:0 -1px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.14)}
.engr.big{font-size:22px;letter-spacing:.24em}
.engr.sm{font-size:10.5px;letter-spacing:.2em;color:var(--engr-d)}
.engr.xs{font-size:10px;letter-spacing:.22em;color:var(--engr-d)}
.row{display:flex;flex-wrap:wrap;align-items:center}
.gap{gap:10px;margin-top:14px}
.note{font-size:14px;color:var(--ink2);font-style:italic}
.pencil{font-family:var(--hand);color:var(--graphite);font-style:normal;font-size:1.12em}
.lnk{color:var(--blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer;font-weight:600}
.lnk.r-callsign{font-family:var(--mono);font-size:.92em;color:#8a2a1c;text-decoration-style:dotted}
.lnk.r-place,.lnk.r-address{color:#2c4f8f}
.lnk.r-person{color:#1d2024;text-decoration-color:var(--red)}

/* ------------------------------------------------------------ buttons: keycaps */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:8px;
  font:700 12.5px/1.1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:#1e1c18;
  background:linear-gradient(#f0ebdd,#d2cbb6);box-shadow:0 2px 0 #857d69,0 4px 9px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .06s,box-shadow .06s,filter .15s}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 #857d69,0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:disabled{filter:grayscale(1) brightness(.8);opacity:.55}
.btn.pri{color:#fff4e8;background:linear-gradient(#e0553b,#a92b1b);box-shadow:0 2px 0 #651a10,0 4px 12px rgba(160,40,20,.45),inset 0 1px 0 rgba(255,210,190,.55)}
.btn.pri:active:not(:disabled){box-shadow:0 0 0 #651a10,0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,210,190,.4)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.85}
.btn.sm{min-height:36px;padding:0 12px;font-size:11.5px}
.btn.xs{min-height:30px;padding:0 10px;font-size:10.5px;border-radius:6px}
.btn.danger{background:linear-gradient(#5b1c14,#3a0f0a);color:#ffd5c8}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:10px;color:inherit;flex:none}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qbtn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;background:transparent;font:700 13px/1 var(--mono);opacity:.7;padding:0;vertical-align:middle}

/* ------------------------------------------------------------ the frame */
#game{display:grid;grid-template-rows:calc(var(--toph) + var(--safe-t)) 1fr calc(var(--tabh) + var(--safe-b));grid-template-columns:100%;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,196,120,.10),rgba(0,0,0,0) 60%),var(--tx-desk),linear-gradient(#171b19,#0c0f0e)}
#topbar{grid-row:1;position:relative;z-index:20;padding-top:var(--safe-t);
  background:var(--tx-brush),linear-gradient(#2b302e,#1a1e1c);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 -1px 0 rgba(0,0,0,.6) inset,0 6px 18px rgba(0,0,0,.55)}
.tb-plate{height:var(--toph);display:flex;align-items:center;gap:10px;padding:0 6px 0 10px}
.tb-clock{flex:none;display:flex;align-items:center;height:38px;padding:0 8px;border-radius:5px;background:linear-gradient(#0a0303,#150605);box-shadow:inset 0 2px 5px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.09)}
.led{display:flex;align-items:center;gap:2px;filter:drop-shadow(0 0 4px rgba(255,50,30,.65))}
.seg{width:14px;height:21px}
.seg .on{fill:var(--led)} .seg .off{fill:rgba(255,50,30,.07)}
.seg-colon{display:grid;gap:5px;padding:0 1px}.seg-colon b{width:3px;height:3px;border-radius:50%;background:var(--led);animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.tb-night{display:grid;line-height:1.05;min-width:0}
.tb-night b{font:800 19px/1 var(--display);letter-spacing:.08em;color:var(--engr);text-transform:uppercase}
.tb-night b small{font-size:13px;color:var(--engr-d);margin-left:1px}
.tb-night span{font:500 10.5px/1.3 var(--mono);color:#98a39b;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-tabs{display:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:2px}
.tb-war,.tb-alert{display:grid;justify-items:center;gap:3px;padding:4px 6px;border-radius:6px;cursor:pointer}
.tb-war .k,.tb-alert .k{font:600 8.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#8d978f}
.toks{display:flex;gap:3px}
.toks i{width:9px;height:12px;border:1.3px solid rgba(236,229,207,.45);border-radius:1.5px}
.toks i.on{background:linear-gradient(#e2573c,#a82a19);border-color:#ff9c80;box-shadow:0 0 6px rgba(255,90,50,.45)}
.tb-alert{grid-template-columns:auto auto;align-items:center;column-gap:5px}
.tb-alert .k{grid-column:1/-1}
.tb-alert .v{font:600 10px/1 var(--mono);color:#c7cfc8;letter-spacing:.06em;text-transform:uppercase}
.lamp{width:12px;height:12px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--lc,#5f5) 30%,color-mix(in srgb,var(--lc,#5f5) 40%,#000) 100%);box-shadow:0 0 8px var(--lc,#5f5),inset 0 -1px 2px rgba(0,0,0,.5)}
.lamp.a0{--lc:#58e07a}.lamp.a1{--lc:#e8d34a}.lamp.a2{--lc:#ff9a2e}.lamp.a3{--lc:#ff3a2a;animation:alarm 1s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 0 16px #ff3a2a,inset 0 -1px 2px rgba(0,0,0,.5)}}
.tb-snd{width:40px}
@media (max-width:420px){.tb-alert .v{display:none}.tb-alert{padding:4px 4px}.tb-war{padding:4px 3px}.tb-snd{display:none}}

#views{grid-row:2;position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;display:none;overscroll-behavior:contain}
.view.on{display:block}
#tabbar{grid-row:3;position:relative;z-index:20;padding:0 6px var(--safe-b);background:linear-gradient(#1c1916,#0e0c0a);box-shadow:0 -1px 0 rgba(255,255,255,.07) inset,0 -8px 20px rgba(0,0,0,.5)}
.tabs{display:flex;gap:5px;height:var(--tabh);padding:7px 0 7px}
.tab{flex:1;position:relative;display:grid;justify-items:center;align-content:center;gap:3px;border:0;border-radius:7px;color:#b8b09a;min-width:0;
  background:linear-gradient(#3a3530,#26221e);box-shadow:0 3px 0 #0a0908,0 4px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .06s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab-l{font:700 9.5px/1 var(--display);letter-spacing:.16em;text-transform:uppercase}
.tab-lamp{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#3b2a16;box-shadow:inset 0 1px 1px rgba(0,0,0,.7)}
.tab.on{transform:translateY(2px);color:#ffe2b0;background:linear-gradient(#2b2723,#1d1a17);box-shadow:0 1px 0 #0a0908,inset 0 2px 5px rgba(0,0,0,.6)}
.tab.on .tab-lamp{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px var(--mono);font-style:normal;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}

/* desktop: tabs live in the top bar */
@media (min-width:900px){
  :root{--toph:62px}
  #game{grid-template-rows:var(--toph) 1fr 0}
  #tabbar{display:none}
  .tb-tabs{display:flex;height:auto;padding:0;margin:0 auto;gap:6px}
  .tb-tabs .tab{flex:none;width:104px;height:48px;grid-template-columns:auto auto;gap:7px}
  .tb-tabs .tab-l{font-size:11px}
  .tb-right{margin-left:0}
  .tb-plate{padding:0 12px 0 14px;gap:14px}
}
/* phone landscape: tab rail on the left */
@media (max-height:520px) and (orientation:landscape){
  :root{--toph:44px}
  #game{grid-template-columns:78px 1fr;grid-template-rows:var(--toph) 1fr}
  #topbar{grid-column:1/-1}
  #tabbar{grid-row:2;grid-column:1;padding:6px 6px calc(6px + var(--safe-b)) calc(6px + env(safe-area-inset-left,0px));box-shadow:1px 0 0 rgba(255,255,255,.06) inset,8px 0 20px rgba(0,0,0,.5)}
  #tabbar .tabs{flex-direction:column;height:100%;padding:0}
  #views{grid-row:2;grid-column:2}
  .tb-plate{height:44px}
  .tb-clock{height:32px}.seg{width:12px;height:18px}
  .tb-night{grid-auto-flow:column;align-items:baseline;gap:8px}
}

/* ------------------------------------------------------------ painted enamel panels */
.panel{position:relative;border-radius:12px;background-color:var(--enamel);background-image:var(--tx-hammer),linear-gradient(170deg,rgba(255,255,255,.10),rgba(0,0,0,.16));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.3),0 2px 0 #1e2320,0 18px 36px -10px rgba(0,0,0,.8)}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8e6df,#8c8d88 55%,#4a4b47);box-shadow:0 1px 1px rgba(0,0,0,.6),inset 0 -1px 1px rgba(0,0,0,.4)}
.screw::after{content:"";position:absolute;left:1.5px;right:1.5px;top:4.6px;height:1.6px;background:#3a3b38;border-radius:1px;transform:rotate(var(--r,35deg))}
.screw.a{top:7px;left:7px;--r:32deg}.screw.b{top:7px;right:7px;--r:-60deg}.screw.c{bottom:7px;left:7px;--r:78deg}.screw.d{bottom:7px;right:7px;--r:12deg}

/* ------------------------------------------------------------ receiver */
.rx-wrap{display:grid;gap:14px;padding:10px 10px 22px;max-width:1280px;margin:0 auto}
.rx-set{padding:14px 14px 14px;display:grid;gap:10px}
.rx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px}
.plate{display:grid;gap:5px}
.vfd{display:flex;align-items:baseline;gap:5px;padding:6px 10px 5px;border-radius:5px;background:linear-gradient(#061210,#0b1a17);box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.14)}
.vfd b{font:600 22px/1 var(--mono);color:var(--vfd);letter-spacing:.04em;text-shadow:0 0 8px rgba(80,255,200,.7)}
.vfd small{font:600 10px/1 var(--mono);color:#3ecfa4;letter-spacing:.1em}
.vfd .vm{font:700 10px/1 var(--mono);color:#0b1a17;background:var(--vfd);padding:3px 4px 2px;border-radius:2px;margin-left:4px;box-shadow:0 0 8px rgba(80,255,200,.6)}
.rx-glass{height:34px;border-radius:5px;overflow:hidden;cursor:ew-resize;touch-action:none;box-shadow:0 0 0 3px #1b1714,0 0 0 4px rgba(255,255,255,.12),inset 0 2px 6px rgba(0,0,0,.5)}
.rx-glass canvas,.crt canvas,.meter canvas,.eye canvas{display:block}
.crt{position:relative;height:172px;border-radius:14px/18px;overflow:hidden;background:#020604;
  box-shadow:0 0 0 5px #121210,0 0 0 6px rgba(255,255,255,.1),0 0 0 9px #0b0b0a,inset 0 0 0 1px #000}
.crt-in,.crt-ov{position:absolute;inset:0}
.crt-ov{touch-action:none;cursor:crosshair}
.crt-glass{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(130% 90% at 30% 0%,rgba(255,255,255,.13),rgba(255,255,255,0) 45%),repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,rgba(0,0,0,0) 1px 3px);
  box-shadow:inset 0 0 38px rgba(0,0,0,.9),inset 0 0 8px rgba(0,0,0,.8)}
.crt-span{position:absolute;right:8px;bottom:18px;display:flex;gap:3px;z-index:2}
.crt-span button{border:0;border-radius:4px;padding:5px 7px;font:700 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#63c996;background:rgba(10,30,20,.72);box-shadow:inset 0 0 0 1px rgba(120,255,180,.22)}
.crt-span button.on{color:#062014;background:#8dffc0;box-shadow:0 0 10px rgba(120,255,180,.6)}
.tape{min-height:44px;border-radius:6px;background:linear-gradient(#030a06,#06120c);box-shadow:inset 0 2px 8px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.12);
  padding:8px 12px;display:flex;align-items:center;color:var(--phos);font:500 13.5px/1.35 var(--mono);text-shadow:0 0 6px rgba(100,255,170,.55);overflow:hidden}
.tape b{color:var(--phos2);font-weight:700;letter-spacing:.04em}
.tape em{font-style:normal;color:#ffcf8a;text-shadow:0 0 6px rgba(255,180,80,.5)}
.tape .dim{color:#5fae86}
.tp-st{display:block}
.tp-hold{display:grid;grid-template-columns:1fr auto;grid-template-areas:"k q" "bar bar" "hint hint";gap:4px 10px;width:100%}
.tp-k{grid-area:k;color:#7bd9a4;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tp-q{grid-area:q;font-weight:700;color:var(--phos2);font-size:16px}
.tp-bar{grid-area:bar;height:6px;border-radius:3px;background:rgba(120,255,180,.12);overflow:hidden}
.tp-bar i{display:block;height:100%;background:linear-gradient(90deg,#3fdc8a,#c9ffe0);box-shadow:0 0 8px #8dffc0;transition:width .2s}
.tp-hint{grid-area:hint;color:#ffcf8a;text-shadow:0 0 6px rgba(255,180,80,.5);font-size:13px}
.tp-copy{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:600;letter-spacing:.14em;white-space:nowrap}
.tp-copy .tp-n{font-size:11px;letter-spacing:.06em;color:#5fae86;font-weight:500}
.tg{opacity:.55}.tg.cur{opacity:1;color:#e8fff2;text-shadow:0 0 10px rgba(160,255,200,.9)}
.tg.ind{text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(141,255,192,.4)}
.tg .un{font-style:normal;opacity:.35}.tg .lost,.lost{font-style:normal;color:#ff8a6a;text-shadow:0 0 6px rgba(255,90,60,.6)}
.rx-ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 2px 0}
.rx-col{display:grid;justify-items:center;gap:6px;align-content:center}
.rx-main{position:relative;display:grid;justify-items:center;gap:6px}
.rx-main .k-lbl{order:2}
.meter{width:112px;height:66px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #16120f,0 0 0 4px rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.5)}
.eye-wrap{display:grid;justify-items:center;gap:4px}
.eye{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 3px #1a1a18,0 0 0 4px #9a9c97,0 0 0 5px #3a3b38,0 3px 8px rgba(0,0,0,.6)}
/* lever switch */
.lever{display:flex;align-items:center;gap:6px}
.lever button{border:0;background:transparent;font:700 12px/1 var(--display);letter-spacing:.14em;color:var(--engr-d);padding:8px 4px;min-height:40px}
.lever button.on{color:#ffe4b8;text-shadow:0 0 8px rgba(255,190,90,.8)}
.lv-slot{position:relative;width:34px;height:18px;border-radius:9px;background:linear-gradient(#0d0c0b,#262320);box-shadow:inset 0 2px 4px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.15);cursor:pointer}
.lv-bat{position:absolute;top:-9px;left:1px;width:14px;height:34px;border-radius:7px;background:linear-gradient(90deg,#8d918f,#f4f5f2 45%,#9ea3a0 70%,#5f6361);box-shadow:0 4px 5px rgba(0,0,0,.55);transform:rotate(-24deg);transform-origin:50% 80%;transition:left .14s,transform .14s}
.lever.cw .lv-bat{left:19px;transform:rotate(24deg)}
/* knobs */
.knob{position:relative;width:var(--sz);height:var(--sz);touch-action:none;cursor:grab;flex:none;border-radius:50%}
.knob.grab{cursor:grabbing}
.k-scale{position:absolute;inset:-6%;width:112%;height:112%;stroke:var(--engr);stroke-width:1.3;opacity:.75}
.k-skirt{position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 20deg,#d9dbd6,#8e928f,#eceeea,#7b7f7c,#d9dbd6,#8e928f,#eceeea,#7b7f7c,#d9dbd6);box-shadow:0 6px 14px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.35)}
.k-cap{position:absolute;inset:14%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#2a2521 0 4deg,#0f0c0a 4deg 8deg);box-shadow:0 3px 6px rgba(0,0,0,.7)}
.k-cap::before{content:"";position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#231e1a,#15110e 70%,#0c0907);box-shadow:inset 0 1px 1px rgba(255,255,255,.12),inset 0 -2px 3px rgba(0,0,0,.6)}
.k-mark{position:absolute;left:50%;top:9%;width:3px;height:22%;margin-left:-1.5px;border-radius:2px;background:#f2ecd9;box-shadow:0 0 2px rgba(0,0,0,.6)}
.k-dimple{position:absolute;left:50%;top:26%;width:22%;height:22%;margin-left:-11%;border-radius:50%;background:radial-gradient(circle at 50% 65%,#2c2622,#0a0807);box-shadow:inset 0 3px 5px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.12)}
.k-light{position:absolute;inset:14%;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.34),rgba(255,255,255,.06) 28%,rgba(255,255,255,0) 50%),radial-gradient(circle at 70% 85%,rgba(255,220,180,.07),rgba(0,0,0,0) 40%)}
.knob:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
/* push buttons */
.rx-btns{display:grid;grid-template-columns:1fr 64px 64px;gap:10px;padding:0 2px}
.pbtn{position:relative;border:0;border-radius:9px;min-height:58px;display:grid;justify-items:center;align-content:center;gap:3px;color:#262320;
  background:linear-gradient(#e7e3d8,#b9b3a2);box-shadow:0 3px 0 #5e5a4f,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .06s,filter .2s}
.pbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pbtn b{font:800 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase}
.pbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #5e5a4f,0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.pbtn:disabled{filter:brightness(.62) saturate(.4);cursor:default}
.pbtn.lit{background:linear-gradient(#ffe0a3,#e6a64a);box-shadow:0 3px 0 #7b5320,0 0 18px rgba(255,180,80,.55),inset 0 1px 0 rgba(255,255,255,.8)}
.pbtn.copy{grid-template-columns:auto 1fr;justify-items:start;align-items:center;column-gap:12px;padding:0 16px;color:#3a0c05;
  background:linear-gradient(#b8412c,#7c2012);box-shadow:0 3px 0 #3e0f07,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,190,170,.35)}
.pbtn.copy .pb-t{display:grid;gap:3px;color:#ffd9cc}
.pbtn.copy b{font-size:16px;letter-spacing:.22em}
.pbtn.copy small{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.pb-lamp{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3a0,#6a1a0f 70%);box-shadow:inset 0 -1px 2px rgba(0,0,0,.5)}
.pbtn.copy.ready{background:linear-gradient(#ff6a45,#c92f16);box-shadow:0 3px 0 #5b1407,0 0 24px rgba(255,90,50,.55),inset 0 1px 0 rgba(255,220,200,.6)}
.pbtn.copy.ready .pb-lamp,.pbtn.copy.busy .pb-lamp{background:radial-gradient(circle at 35% 30%,#fff,#ffd27a 35%,#ff7a2a 80%);box-shadow:0 0 12px #ffb35a}
.pbtn.copy.busy{background:linear-gradient(#ff6a45,#c92f16);animation:rec 1.2s ease-in-out infinite}
@keyframes rec{50%{box-shadow:0 3px 0 #5b1407,0 0 34px rgba(255,90,50,.85),inset 0 1px 0 rgba(255,220,200,.6)}}
.pb-ring{position:absolute;right:10px;top:50%;width:34px;height:34px;margin-top:-17px;transform:rotate(-90deg);opacity:0}
.pb-ring circle{fill:none;stroke:#ffe3c8;stroke-width:3;stroke-dasharray:107;stroke-dashoffset:107;stroke-linecap:round}
.holding .pb-ring{opacity:1}
/* schedule */
.sched{display:grid;gap:10px}
.sb-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.sb-sub{font:500 11px/1 var(--mono);color:#9ea79f}
.sb-strip{position:relative;height:62px;border-radius:4px;background-color:var(--card);background-image:var(--tx-paper),linear-gradient(transparent 21px,rgba(0,0,0,.08) 21px 22px,transparent 22px);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 18px -6px rgba(0,0,0,.7);transform:rotate(-.3deg);margin:0 4px}
.sb-ticks i{position:absolute;top:0;bottom:0;border-left:1px solid rgba(40,40,40,.18)}
.sb-ticks b{position:absolute;top:4px;left:3px;font:700 10px/1 var(--type);color:var(--ink2)}
.sb-ticks i:last-child b{left:auto;right:3px}
.sb-past u{position:absolute;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--graphite);opacity:.55}
.sb-past u.f{background:transparent;border:1.3px solid var(--graphite)}
.sb-blk{position:absolute;top:24px;height:28px;min-width:10px;border:0;border-radius:2px;padding:0;color:#fff;background:rgba(191,53,38,.85);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sb-blk.m-cw{background:rgba(44,79,143,.85)}.sb-blk.m-burst{background:rgba(120,60,140,.85)}
.sb-blk span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 10px/1 var(--mono);white-space:nowrap;padding:3px 4px;border-radius:3px;background:inherit}
.sb-blk::before{content:"";position:absolute;inset:-8px -6px}
.sb-now{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--led);box-shadow:0 0 6px rgba(255,60,40,.7)}
.sb-now::before{content:"";position:absolute;top:-2px;left:-4px;border:5px solid transparent;border-top-color:var(--led)}
.sb-btns{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px}
.sb-btns .btn{flex:1 1 auto;min-width:0;padding:0 12px}
.sb-btns .btn.next{flex-basis:100%;justify-content:space-between;background:linear-gradient(#ffe0a3,#e2a44c);box-shadow:0 2px 0 #7b5320,0 4px 12px rgba(255,170,70,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.sb-btns .btn.next span{display:inline-flex;align-items:center;gap:6px;opacity:.8}
.sb-btns .btn.next b{font-size:14px}
.sb-btns .btn.ghost{color:#c9c2ad}
/* the log sheet */
.logsheet{position:relative;padding:16px 14px 20px 34px;border-radius:2px;color:var(--ink);background-color:var(--log);
  background-image:linear-gradient(90deg,transparent 25px,rgba(191,53,38,.35) 25px 26px,transparent 26px),var(--tx-paper),repeating-linear-gradient(transparent 0 27px,rgba(80,110,120,.22) 27px 28px);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 16px 30px -10px rgba(0,0,0,.75),0 2px 4px rgba(0,0,0,.4);transform:rotate(.25deg)}
.logsheet::before{content:"";position:absolute;left:8px;top:40px;bottom:40px;width:10px;background:radial-gradient(circle,#101312 0 4px,transparent 5px) 0 0/10px 90px repeat-y;opacity:.85}
.ls-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
.ls-org{font:700 10.5px/1 var(--type);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.ls-head h3{font:700 22px/1.1 var(--type);letter-spacing:.02em;margin-top:3px}
.ls-form{font:700 10px/1 var(--type);color:var(--ink2);border:1px solid var(--ink2);padding:3px 5px}
.ls-empty{font-family:var(--hand);font-size:19px;color:var(--graphite);line-height:1.3;margin:10px 0}
.ls-night{font:700 11px/1 var(--type);letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:12px 0 4px}
.ls-rows{display:grid}
.ls-row{display:grid;grid-template-columns:44px 50px 36px 1fr auto;grid-template-areas:"t f m cs q" "g g g g g";column-gap:6px;row-gap:1px;align-items:baseline;text-align:left;
  width:100%;border:0;background:transparent;padding:6px 2px 7px;border-bottom:1px dashed rgba(60,80,90,.3);color:var(--ink);font:400 14px/1.35 var(--type);border-radius:3px}
.ls-row:active{background:rgba(0,0,0,.05)}
.ls-t{grid-area:t;font-weight:700}.ls-f{grid-area:f}.ls-m{grid-area:m;color:var(--ink2);font-size:12px}
.ls-cs{grid-area:cs;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ls-cs small{font-weight:400;color:var(--ink2);margin-left:2px}.ls-cs em{color:var(--ink3)}
.ls-q{grid-area:q;display:flex;gap:4px;align-items:center}
.ls-g{grid-area:g;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:14.5px;letter-spacing:.06em;padding-left:2px}
.ls-g .g.ind{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.ls-g .more{color:var(--ink3);font-size:12px}
.ls-row .lost,.groups-grid .lost{color:var(--red);font-style:normal;font-family:var(--hand);font-size:1.15em;line-height:.8}
.ls-row.faint{color:var(--graphite)}
.ls-row.faint .ls-t,.ls-row.faint .ls-cs{font-weight:400}
.ls-row.live{background:rgba(255,230,160,.35)}
.qs{font:700 10.5px/1 var(--type);padding:2px 4px;border:1.4px solid currentColor;border-radius:2px;transform:rotate(-3deg)}
.qs.q5,.qs.q4{color:#2d6a3a}.qs.q3{color:#8a6a10}.qs.q2,.qs.q1{color:var(--red)}
.dfm{font:700 9.5px/1 var(--mono);color:#fff;background:var(--red);padding:2px 3px;border-radius:2px}
/* receiver layouts */
@media (min-width:900px){
  .rx-wrap{grid-template-columns:minmax(560px,640px) minmax(340px,1fr);align-items:start;padding:18px 20px 30px}
  .crt{height:250px}
  .rx-side{display:grid;gap:16px}
  .ls-row{grid-template-columns:48px 56px 40px 110px auto 1fr;grid-template-areas:"t f m cs q g"}
}
@media (max-height:520px) and (orientation:landscape){
  .rx-wrap{grid-template-columns:minmax(0,1fr) 300px;align-items:start;padding:8px 8px 16px;gap:10px}
  .rx-set{grid-template-columns:minmax(0,1fr) 206px;grid-template-areas:"head head" "glass ctl" "crt ctl" "tape btns";gap:8px;padding:10px}
  .rx-head{grid-area:head}.rx-glass{grid-area:glass;height:28px}.crt{grid-area:crt;height:128px}.tape{grid-area:tape;min-height:40px}
  .rx-ctl{grid-area:ctl;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;align-self:start}
  .rx-ctl .rx-main{grid-column:1/-1;grid-row:1}
  .rx-btns{grid-area:btns;grid-template-columns:1fr 50px 50px;gap:6px}
  .pbtn{min-height:44px}.pbtn.copy{padding:0 10px}.pbtn.copy b{font-size:13px}
  .meter{width:92px;height:54px}
  .engr.big{font-size:17px}
  .rx-side{display:grid;gap:10px}
}

/* ------------------------------------------------------------ sheet: paper on a clipboard */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(3,5,4,.55);opacity:0;transition:opacity .25s;backdrop-filter:blur(1.5px)}
#scrim.on{opacity:1}
#sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#sheet.on{transform:none;pointer-events:auto}
#sheet.drag{transition:none}
.sh-clip{height:26px;display:grid;place-items:center;flex:none;position:relative;z-index:2;margin-bottom:-12px}
.sh-clip i{display:block;width:120px;height:26px;border-radius:6px 6px 3px 3px;background:var(--tx-brush),linear-gradient(#e2e4e0,#9ea29f 60%,#7c807d);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 #fff}
.sh-paper{display:flex;flex-direction:column;min-height:0;border-radius:4px 4px 0 0;color:var(--ink);background-color:var(--paper);background-image:var(--tx-paper);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sh-head{display:flex;align-items:flex-start;gap:6px;padding:20px 8px 10px 18px;border-bottom:1px solid rgba(0,0,0,.12);flex:none}
.sh-head .t{flex:1;min-width:0;padding-top:4px}
.sh-head h3{font:800 25px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-top:5px}
.sh-head .sub{font-size:14px;color:var(--ink2);margin-top:4px}
.sh-head .ib{color:var(--ink2)}
.sh-body{overflow:auto;padding:14px 18px calc(24px + var(--safe-b));font-size:16px;line-height:1.5;overscroll-behavior:contain}
.sh-body h4{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px}
@media (min-width:900px){
  #sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:84vh;transform:translate(-50%,-46%) rotate(-.4deg);opacity:0;transition:transform .25s,opacity .2s}
  #sheet.wide{width:820px}
  #sheet.on{transform:translate(-50%,-50%) rotate(-.4deg);opacity:1}
  .sh-paper{border-radius:4px;box-shadow:0 30px 70px rgba(0,0,0,.7)}
}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 12px;font-size:15px}
.kv dt{font:600 11px/1.9 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.kv dd{margin:0;font-family:var(--type)}
.groups-grid{display:flex;flex-wrap:wrap;gap:4px 14px;padding:12px 14px;background:var(--log);background-image:repeating-linear-gradient(transparent 0 25px,rgba(80,110,120,.22) 25px 26px);font:400 16px/26px var(--type);letter-spacing:.06em;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.groups-grid .g.ind{color:var(--red);font-weight:700}
.brg{padding-left:18px;font-family:var(--type);font-size:14.5px}
.pencil-note{font-family:var(--hand);font-size:20px;color:var(--graphite);line-height:1.25}
.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:12px 4px;border-bottom:1px solid rgba(0,0,0,.1);color:var(--ink);min-height:56px}
.li svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--ink2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.li span{display:grid;gap:2px}.li b{font:700 15px/1.2 var(--type)}.li small{font-size:13.5px;color:var(--ink2);line-height:1.35}
.chk{display:grid;gap:6px;margin:10px 0}
.chk label{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:6px;background:rgba(0,0,0,.05);font-family:var(--type)}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.alert-scale{display:grid;gap:8px;margin-bottom:12px}
.as-row{display:grid;grid-template-columns:auto 80px 1fr;gap:10px;align-items:center;padding:8px;border-radius:6px;font-size:14.5px}
.as-row b{font:700 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.as-row.on{background:rgba(191,53,38,.1);box-shadow:inset 0 0 0 1.5px rgba(191,53,38,.4)}
.help p{font-size:15.5px}

/* ------------------------------------------------------------ toast: a strip of teleprinter paper */
#toast{position:fixed;z-index:80;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 12px);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;
  width:min(94vw,520px);display:flex;gap:10px;align-items:flex-start;padding:11px 14px 12px;color:#1f1c16;font:400 14px/1.4 var(--type);
  background-color:#efe6c4;background-image:var(--tx-paper);box-shadow:0 10px 26px rgba(0,0,0,.6);border-radius:2px;
}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;margin-top:1px}
#toast span{padding-left:6px}
#toast.err{background-color:#f3d4c8}
#toast.good{background-color:#dfeccd}
@media (min-width:900px){#toast{bottom:22px}}
@media (max-height:520px) and (orientation:landscape){#toast{bottom:12px}}

/* ------------------------------------------------------------ explanations and the end-of-shift memo */
#explain{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
#explain.on{opacity:1}
.paper{color:var(--ink);background-color:var(--paper);background-image:var(--tx-paper)}
.ex-card{position:relative;width:min(420px,100%);padding:26px 22px 20px;border-radius:2px;transform:rotate(-1deg) translateY(10px);transition:transform .3s;box-shadow:0 20px 50px rgba(0,0,0,.7)}
#explain.on .ex-card{transform:rotate(-1deg)}
.ex-pin{position:absolute;top:-8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a70,#b3261a 60%,#5e0f08);box-shadow:0 3px 4px rgba(0,0,0,.5)}
.ex-from{font:600 21px/1 var(--hand);color:var(--red);margin-bottom:6px}
.ex-card h4{font:800 26px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.ex-card p{font-size:16px;line-height:1.55}
.ex-sig{font:600 22px/1 var(--hand);color:var(--graphite);text-align:right;margin:4px 6px 14px}
#night{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:20px;background:radial-gradient(90% 70% at 50% 40%,rgba(40,30,20,.6),rgba(0,0,0,.94));opacity:0;transition:opacity .45s}
#night.on{opacity:1}
.nc-memo{position:relative;width:min(460px,100%);padding:26px 24px 22px;border-radius:2px;transform:rotate(.6deg);box-shadow:0 30px 60px rgba(0,0,0,.8)}
.nc-h h2{font:800 34px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:6px 0 10px}
.nc-stamp{position:absolute;top:22px;right:18px;font:700 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red);border:2.5px solid var(--red);padding:6px 8px;transform:rotate(8deg);opacity:.85}
.nc-memo ul{margin:6px 0 14px;padding-left:20px;font:400 15px/1.5 var(--type)}
.nc-memo li.ev{font-family:var(--hand);font-size:18px;color:var(--graphite);list-style:"– "}
.nc-next{font-size:15px;border-top:1px solid rgba(0,0,0,.2);padding-top:10px}
/* coach */
#coach{position:fixed;inset:0;z-index:85;pointer-events:none}
.co-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 3px rgba(255,200,110,.95),0 0 0 9999px rgba(0,0,0,.42),0 0 24px rgba(255,190,90,.6);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#coach:not(.has-el) .co-spot{box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.co-card{position:fixed;pointer-events:auto;padding:16px 16px 12px;border-radius:2px;color:var(--ink);background-color:var(--card);background-image:var(--tx-paper);box-shadow:0 16px 40px rgba(0,0,0,.7);transition:top .3s,left .3s}
.co-k{font:600 17px/1 var(--hand);color:var(--red);margin-bottom:4px}
.co-card b{display:block;font:800 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.co-card p{font-size:15px;line-height:1.45;margin-bottom:10px}
.co-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.co-wait{display:inline-flex;align-items:center;gap:4px;font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.co-wait svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.co-card .btn.ghost{color:var(--ink2)}
