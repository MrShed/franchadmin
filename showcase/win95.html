<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fenestra 95 Desktop</title>
<meta name="description" content="A working mid-90s desktop homage — Fenestra 95 — with draggable windows, a Start menu, Notepad that remembers, playable Minesweeper, a tiny Paint and a history of the beveled-grey era.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#008080;
  --face:#c0c0c0;
  --hi:#ffffff;
  --lt:#dfdfdf;
  --sh:#808080;
  --dk:#0a0a0a;
  --title1:#000080;
  --title2:#1084d0;
  --ui:Tahoma,"MS Sans Serif","Microsoft Sans Serif",Geneva,Verdana,"Segoe UI",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --mono:"Courier Prime","Courier New",Courier,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);font:12px/1.35 var(--ui);color:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:none}
button{font:inherit;color:inherit}
:focus-visible{outline:1px dotted #000;outline-offset:-4px}

.out{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.in{background:#fff;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk)}
.btn{background:var(--face);border:0;padding:4px 12px;min-width:75px;min-height:23px;cursor:pointer;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--lt)}
.btn:active,.btn.pressed{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--sh);padding:5px 11px 3px 13px}
.btn:focus-visible{outline:1px dotted #000;outline-offset:-5px}

/* desktop */
#desktop{position:fixed;inset:0 0 32px 0;overflow:hidden}
.icons{position:absolute;left:max(8px,env(safe-area-inset-left));top:8px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,78px);gap:4px;height:calc(100% - 16px)}
.icon{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px 2px;cursor:pointer;color:#fff}
.icon svg{width:32px;height:32px;image-rendering:pixelated;shape-rendering:crispEdges}
.icon span{padding:1px 2px;text-align:center;line-height:1.2}
.icon:focus span,.icon.sel span{background:var(--title1);outline:1px dotted #ff0}
.icon:focus svg,.icon.sel svg{filter:url(#selTint)}
.wallmark{position:absolute;right:24px;bottom:18px;color:#ffffffaa;font:12px var(--pix);text-align:right;pointer-events:none}
.wallmark b{display:block;font-size:26px;color:#fff;text-shadow:2px 2px 0 #005858}

/* windows */
.win{position:absolute;padding:3px;display:flex;flex-direction:column;min-width:200px;max-width:calc(100vw - 16px);max-height:calc(100% - 8px)}
.win.hidden{display:none}
.title{height:18px;display:flex;align-items:center;gap:3px;padding:0 2px 0 3px;background:linear-gradient(90deg,#808080,#b5b5b5);color:#c0c0c0;font-weight:bold;cursor:default;touch-action:none;flex:none}
.win.active .title{background:linear-gradient(90deg,var(--title1),var(--title2));color:#fff}
.title svg{width:16px;height:16px;flex:none;shape-rendering:crispEdges}
.title .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{width:16px;height:14px;min-width:0;min-height:0;padding:0;display:grid;place-items:center;font:bold 10px/1 var(--ui)}
.tb:active{padding:1px 0 0 1px}
.tb svg{width:8px;height:7px}
.tb.x{margin-left:2px}
.menubar{display:flex;gap:0;padding:2px 0;flex:none}
.menubar button{background:none;border:0;padding:2px 7px;cursor:pointer}
.menubar button:hover,.menubar button:focus-visible{background:var(--title1);color:#fff;outline:0}
.body{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:2px}
.status{display:flex;gap:2px;margin-top:2px;flex:none}
.status div{padding:2px 6px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh);flex:1;white-space:nowrap;overflow:hidden}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;max-width:none}

/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:32px;padding:4px 2px 2px;display:flex;gap:4px;align-items:center;z-index:9000;box-shadow:inset 0 1px var(--lt),inset 0 2px var(--hi);padding-bottom:max(2px,env(safe-area-inset-bottom))}
#start{display:flex;align-items:center;gap:4px;font-weight:bold;min-width:0;padding:2px 6px;height:24px;flex:none}
#start svg{width:18px;height:16px}
#tasks{flex:1;display:flex;gap:3px;min-width:0;overflow:hidden}
.task{flex:0 1 160px;min-width:32px;height:24px;display:flex;align-items:center;gap:4px;padding:2px 6px;text-align:left;overflow:hidden;white-space:nowrap}
.task span{overflow:hidden;text-overflow:ellipsis}
.task svg{width:16px;height:16px;flex:none}
.task.pressed{background:repeating-conic-gradient(#fff 0 25%,#c0c0c0 0 50%) 0 0/2px 2px;font-weight:bold}
#tray{height:24px;display:flex;align-items:center;gap:6px;padding:0 8px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh);flex:none}
#tray svg{width:16px;height:16px}
.back{color:#000;text-decoration:none;font-size:11px;padding:0 2px}
.back:hover{text-decoration:underline}

/* start menu */
#startmenu{position:fixed;left:2px;bottom:30px;z-index:9500;display:none;padding:3px;width:220px}
#startmenu.open{display:flex}
#startmenu .side{width:24px;background:linear-gradient(0deg,#000080,#1084d0);color:#c0c0c0;writing-mode:vertical-rl;transform:rotate(180deg);font:bold 18px var(--ui);padding:6px 3px;letter-spacing:.02em;white-space:nowrap}
#startmenu .side b{color:#fff}
#startmenu ul{list-style:none;margin:0;padding:0;flex:1}
#startmenu li button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:6px 8px;cursor:pointer}
#startmenu li button svg{width:24px;height:24px;flex:none;shape-rendering:crispEdges}
#startmenu li button:hover,#startmenu li button:focus{background:var(--title1);color:#fff;outline:0}
#startmenu hr{border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi);margin:3px 2px}

/* notepad */
.np textarea{flex:1;resize:none;border:0;font:14px/1.45 var(--mono);padding:6px 8px;outline:0;user-select:text;-webkit-user-select:text;min-height:120px}
.np .in{flex:1;display:flex;padding:2px}

/* minesweeper */
.ms .panel{padding:6px;margin:0}
.ms .head{display:flex;justify-content:space-between;align-items:center;padding:4px 5px;margin-bottom:6px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--sh)}
.lcd{background:#000;color:#f00;font:bold 22px/1 "Courier New",monospace;padding:1px 3px;min-width:44px;text-align:right;letter-spacing:1px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh)}
.face{width:28px;height:28px;min-width:0;padding:0;display:grid;place-items:center}
.face svg{width:20px;height:20px}
.grid{display:grid;box-shadow:inset -3px -3px var(--hi),inset 3px 3px var(--sh);padding:3px;width:max-content}
.cell{width:22px;height:22px;border:0;padding:0;display:grid;place-items:center;font:bold 14px/1 var(--ui);cursor:pointer;background:var(--face);box-shadow:inset -2px -2px var(--sh),inset 2px 2px var(--hi)}
.cell.open{box-shadow:none;border-right:1px solid var(--sh);border-bottom:1px solid var(--sh);cursor:default}
.cell.boom{background:#f00}
.cell svg{width:14px;height:14px}
.n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}
.msopts{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.msopts label{display:flex;align-items:center;gap:4px}

/* paint */
.pt .work{display:flex;gap:4px;flex:1;min-height:0}
.tools{display:grid;grid-template-columns:repeat(2,25px);gap:0;align-content:start;padding:2px}
.tool{width:25px;height:25px;min-width:0;padding:0;display:grid;place-items:center}
.tool svg{width:16px;height:16px;shape-rendering:crispEdges}
.tool.pressed{background:repeating-conic-gradient(#fff 0 25%,#c0c0c0 0 50%) 0 0/2px 2px}
.canvasbox{flex:1;background:#808080;overflow:auto;padding:4px;box-shadow:inset 1px 1px var(--sh),inset 2px 2px var(--dk)}
.canvasbox canvas{background:#fff;display:block;touch-action:none;cursor:crosshair}
.palette{display:flex;align-items:center;gap:4px;margin-top:4px;flex:none}
.cur{width:30px;height:30px;position:relative;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh)}
.cur i{position:absolute;width:13px;height:13px;border:1px solid #000}
.cur .fg{left:5px;top:5px;z-index:1}.cur .bg{left:12px;top:12px}
.swatches{display:grid;grid-template-columns:repeat(14,15px);grid-template-rows:15px 15px;gap:1px}
.swatches button{border:0;padding:0;width:15px;height:15px;cursor:pointer;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset 2px 2px #000}

/* help / about */
.help .in{flex:1;overflow:auto;padding:12px 14px;user-select:text;-webkit-user-select:text;font-size:13px;line-height:1.5}
.help h1{font:bold 18px var(--ui);margin:0 0 8px;color:#000080}
.help h2{font:bold 13px var(--ui);margin:14px 0 4px;border-bottom:1px solid var(--sh);padding-bottom:2px}
.help p{margin:0 0 8px}
.help ul{margin:0 0 8px;padding-left:18px}
.help dt{font-weight:bold;margin-top:6px}
.help dd{margin:0 0 4px 12px}
.tabs{display:flex;gap:0;padding:0 4px;position:relative;top:2px;z-index:1;flex:none}
.tab{padding:3px 10px;background:var(--face);border:0;cursor:pointer;box-shadow:inset 1px 1px var(--hi),inset -1px 0 var(--dk),inset -2px 0 var(--sh);margin-right:-2px}
.tab[aria-selected="true"]{padding-bottom:6px;margin-top:-2px;z-index:2;position:relative}
.tabpanel{box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh);padding:8px;flex:1;display:flex;min-height:0}
.welcome{display:flex;gap:12px;padding:10px}
.welcome .tip{flex:1;display:flex;gap:10px;padding:12px;background:#ffffe1}
.welcome .tip svg{width:32px;height:32px;flex:none}
.welcome .tip b{display:block;font-size:14px;margin-bottom:6px}
.welcome .side{display:flex;flex-direction:column;gap:6px}
.welcome h1{font:bold 22px var(--ui);margin:6px 10px 0;letter-spacing:-.5px}
.welcome h1 span{font-family:var(--pix);font-weight:700;color:#fff;text-shadow:1px 1px 0 #000;-webkit-text-stroke:.5px #000;font-size:26px}
.chk{display:flex;align-items:center;gap:6px;padding:0 10px 10px}

/* my computer */
.mc .in{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:10px;overflow:auto}
.mc .icon{color:#000}

/* boot + shutdown */
#boot,#off{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#boot{background:#000;color:#fff;transition:opacity .35s}
#boot.gone{opacity:0;pointer-events:none}
#boot .logo{display:flex;align-items:center;gap:16px}
#boot .logo svg{width:84px;height:72px}
#boot .logo div{font:700 42px/1 var(--pix);letter-spacing:1px}
#boot .logo small{display:block;font:400 14px var(--pix);color:#8ab4ff;margin-top:8px}
#boot .bar{width:220px;height:10px;margin-top:40px;background:linear-gradient(90deg,transparent,#1084d0 30%,#6fd0ff 50%,#1084d0 70%,transparent) 0 0/220px 100% no-repeat;animation:sweep 1s linear infinite;background-color:#111}
@keyframes sweep{from{background-position:-220px 0}to{background-position:220px 0}}
#off{background:#000;color:#ff8c00;font:22px var(--pix);text-align:center;display:none;cursor:pointer;padding:20px}
#off.show{display:flex}

#ctx{position:fixed;z-index:9600;display:none;padding:3px;min-width:150px}
#ctx.open{display:block}
#ctx button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 18px;cursor:pointer}
#ctx button:hover,#ctx button:focus{background:var(--title1);color:#fff;outline:0}
#ctx hr{border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi);margin:3px 2px}

@media (max-width:560px){
  .icons{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,78px);grid-template-rows:none;right:16px;left:16px;height:auto}
  .wallmark{display:none}
  .task{flex-basis:40px}
  .task span{display:none}
  #tray .back{font-size:11px}
  .welcome{flex-direction:column}
  .welcome .side{flex-direction:row;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){#boot .bar{animation:none;background:#1084d0}}
</style>
</head>

<template id="tpl-help">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="0">History</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="1">People</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="2">Principles</button>
  </div>
  <div class="tabpanel"><div class="in" style="flex:1;overflow:auto;padding:12px 14px;user-select:text;-webkit-user-select:text;font-size:13px;line-height:1.5">
    <section data-panel="0">
      <h1>The Grey Era, 1990–2001</h1>
      <p>For about a decade, the personal computer was the colour of a filing cabinet — and that was a feature. The mid-90s desktop turned an intimidating machine into something that looked like an office: buttons that bulged, fields that sank, a taskbar that always told you what was open.</p>
      <h2>1990 · the chiseled look</h2>
      <p>With the third major release of the dominant PC shell, designers introduced 3D bevels: a one-pixel white edge on the top-left, dark grey on the bottom-right, as if light came from over your left shoulder. Suddenly flat pixels had depth.</p>
      <h2>1995 · the Start button</h2>
      <p>The big 1995 release added the taskbar, the Start menu, right-click context menus, long filenames and the desktop as a place to put things. Usability tests had shown new users couldn't find programs; a single labelled button in the corner fixed that. The launch campaign used a Rolling Stones song and the startup sound was composed by Brian Eno.</p>
      <h2>1996–2000 · grey everywhere</h2>
      <p>Every toolkit copied the look — Motif, OS/2, BeOS, early Java Swing. Web pages had grey backgrounds and beveled table borders. Screensavers flew toasters and pipes.</p>
      <h2>2001 · the end</h2>
      <p>Rounded blue title bars and a green Start button arrived, followed by glass and gloss. The grey era became nostalgia, and later an aesthetic of its own: vaporwave backgrounds, indie games, and web homages like this one.</p>
    </section>
    <section data-panel="1" hidden>
      <h1>People behind the pixels</h1>
      <dl>
        <dt>Virginia Howlett</dt><dd>Led visual design for the PC shell from 1985 to 1995; responsible for the 3D-chiselled look and the teal desktop that greeted millions.</dd>
        <dt>Susan Kare</dt><dd>The pioneer of pixel icons; after defining the 1984 Macintosh look she drew icons and the playing cards for the 1990 PC Solitaire.</dd>
        <dt>Kent Sullivan &amp; the usability lab</dt><dd>Ran the studies that produced the Start button, taskbar and "Click here to begin" arrow.</dd>
        <dt>Robert Donner &amp; Curt Johnson</dt><dd>Wrote Minesweeper, which quietly taught a generation to right-click.</dd>
        <dt>Brian Eno</dt><dd>Composed the 3.25-second startup sound, reportedly on a Mac.</dd>
        <dt>Wes Cherry</dt><dd>Wrote Solitaire as an intern, a program that taught drag and drop.</dd>
      </dl>
    </section>
    <section data-panel="2" hidden>
      <h1>Design principles of the grey era</h1>
      <ul>
        <li><b>Light from the top-left.</b> Every raised element has a white top-left edge and a dark bottom-right edge. Pressed things invert it.</li>
        <li><b>Affordance over beauty.</b> A button must look pushable. Fields look carved in. Nothing is flat unless it is text.</li>
        <li><b>Always show state.</b> The taskbar shows open windows; the active title bar is blue, inactive ones grey.</li>
        <li><b>Right-click for more.</b> Context menus put the verbs next to the nouns.</li>
        <li><b>Documents first.</b> The desktop is a place you keep things, not just a program launcher.</li>
        <li><b>Palette of sixteen.</b> Designed for 16-colour VGA, so every colour had a job: teal desktop, navy title, grey face.</li>
        <li><b>Keyboard everything.</b> Every menu had an underlined accelerator; Alt+Tab switched windows.</li>
      </ul>
      <p>Try it here: drag windows by their title bars, right-click the desktop, play Minesweeper (right-click or Flag mode to flag).</p>
    </section>
  </div></div>
</template>

<script>
(function(){
  "use strict";
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function $(s,r){return (r||document).querySelector(s);}
  function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

  /* boot */
  var boot=$('#boot');
  setTimeout(function(){boot.classList.add('gone');},reduce?50:900);
  boot.addEventListener('click',function(){boot.classList.add('gone');});

  var desktop=$('#desktop'),tasks=$('#tasks');
  var z=10,wins={},cascade=0;
  var APPS={
    welcome:{title:"Welcome",icon:"#i-run",w:470,h:null,tpl:"tpl-welcome"},
    help:{title:"The Grey Era — Help",icon:"#i-help",w:520,h:430,tpl:"tpl-help"},
    notepad:{title:"Untitled - Notepad",icon:"#i-note",w:420,h:320,tpl:"tpl-notepad"},
    mines:{title:"Minesweeper",icon:"#i-mine",w:null,h:null,tpl:"tpl-mines",noMax:true},
    paint:{title:"untitled - Paint",icon:"#i-paint",w:590,h:430,tpl:"tpl-paint"},
    computer:{title:"This Machine",icon:"#i-pc",w:380,h:250,tpl:"tpl-computer"},
    bin:{title:"Wastebasket",icon:"#i-bin",w:380,h:200,tpl:"tpl-bin"}
  };

  function focusWin(w){
    $$('.win').forEach(function(x){x.classList.toggle('active',x===w);});
    if(w){w.style.zIndex=++z;}
    $$('.task').forEach(function(t){t.classList.toggle('pressed',w&&t.dataset.app===w.dataset.app&&!w.classList.contains('hidden'));});
  }
  function open(app){
    closeStart();
    if(wins[app]){var w0=wins[app];w0.classList.remove('hidden');focusWin(w0);return w0;}
    var A=APPS[app];if(!A)return;
    var w=document.createElement('div');w.className='win out '+({notepad:'np',mines:'ms',paint:'pt',help:'help',computer:'mc'}[app]||'');w.dataset.app=app;w.id='win-'+app;
    w.setAttribute('role','dialog');w.setAttribute('aria-label',A.title);
    w.innerHTML='<div class="title"><svg viewBox="0 0 32 32"><use href="'+A.icon+'"/></svg><span class="t">'+A.title+'</span>'+
      '<button class="btn tb min" aria-label="Minimize"><svg viewBox="0 0 8 7"><rect x="1" y="5" width="6" height="2"/></svg></button>'+
      (A.noMax?'':'<button class="btn tb max" aria-label="Maximize"><svg viewBox="0 0 8 7"><rect x=".5" y=".5" width="7" height="6" fill="none" stroke="#000"/><rect x="0" y="0" width="8" height="2"/></svg></button>')+
      '<button class="btn tb x" aria-label="Close"><svg viewBox="0 0 8 7"><path d="M0 0 L8 7 M8 0 L0 7" stroke="#000" stroke-width="1.6"/></svg></button></div><div class="body"></div>';
    $('.body',w).appendChild(document.getElementById(A.tpl).content.cloneNode(true));
    desktop.appendChild(w);
    var dw=desktop.clientWidth,dh=desktop.clientHeight;
    if(A.w){w.style.width=Math.min(A.w,dw-16)+'px';}if(A.h){w.style.height=Math.min(A.h,dh-16)+'px';}
    var ww=w.offsetWidth,wh=w.offsetHeight;
    var x=Math.max(8,Math.min(dw-ww-8,(dw>600?110:8)+cascade*26)),y=Math.max(8,Math.min(dh-wh-8,20+cascade*24));
    if(dw<=560){x=8;y=Math.max(8,Math.min(dh-wh-8,8+cascade*18));}
    cascade=(cascade+1)%6;
    w.style.left=x+'px';w.style.top=y+'px';
    wins[app]=w;
    // taskbar
    var t=document.createElement('button');t.className='btn task';t.dataset.app=app;t.id='task-'+app;
    t.innerHTML='<svg viewBox="0 0 32 32"><use href="'+A.icon+'"/></svg><span>'+A.title+'</span>';
    t.addEventListener('click',function(){
      if(w.classList.contains('hidden')){w.classList.remove('hidden');focusWin(w);}
      else if(w.classList.contains('active')){w.classList.add('hidden');focusWin(null);}
      else focusWin(w);
    });
    tasks.appendChild(t);
    // controls
    $('.tb.x',w).addEventListener('click',function(){close(app);});
    $('.tb.min',w).addEventListener('click',function(){w.classList.add('hidden');focusWin(null);});
    var mx=$('.tb.max',w);if(mx)mx.addEventListener('click',function(){w.classList.toggle('max');});
    $('.title',w).addEventListener('dblclick',function(){if(!A.noMax)w.classList.toggle('max');});
    w.addEventListener('pointerdown',function(){focusWin(w);},true);
    drag(w);
    $$('[data-open]',w).forEach(function(b){b.addEventListener('click',function(){open(b.dataset.open);});});
    $$('[data-close]',w).forEach(function(b){b.addEventListener('click',function(){close(app);});});
    if(INIT[app])INIT[app](w);
    focusWin(w);
    return w;
  }
  function close(app){var w=wins[app];if(!w)return;if(w._cleanup)w._cleanup();w.remove();var t=$('#task-'+app);if(t)t.remove();delete wins[app];focusWin(null);}
  function drag(w){
    var bar=$('.title',w);
    bar.addEventListener('pointerdown',function(e){
      if(e.target.closest('.tb')||w.classList.contains('max'))return;
      e.preventDefault();
      var sx=e.clientX,sy=e.clientY,ox=w.offsetLeft,oy=w.offsetTop;
      bar.setPointerCapture(e.pointerId);
      function mv(m){
        var nx=ox+m.clientX-sx,ny=oy+m.clientY-sy;
        nx=Math.max(-w.offsetWidth+60,Math.min(desktop.clientWidth-60,nx));
        ny=Math.max(0,Math.min(desktop.clientHeight-20,ny));
        w.style.left=nx+'px';w.style.top=ny+'px';
      }
      function up(){bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up);}
      bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up);
    });
  }

  /* ---------- app initialisers ---------- */
  var INIT={};
  var TIPS=[
    "To open a program, click the Start button, then point to it. In 1995 usability tests, first-time users found programs ten times faster with a Start button.",
    "You can move a window by dragging its title bar. The blue one is active; grey ones are waiting patiently.",
    "Right-click almost anything to see what you can do with it. Try the desktop.",
    "Minesweeper was included partly to teach people how to right-click. Solitaire taught drag and drop.",
    "The beveled look assumes a light source above your left shoulder. Every raised edge is white on the top-left.",
    "Long filenames arrived in 1995. Before that, 'LETTER~1.DOC' was a perfectly reasonable name."
  ];
  INIT.welcome=function(w){var i=Math.floor(Math.random()*TIPS.length);var tt=$('.tiptext',w);tt.textContent=TIPS[i];$('.nexttip',w).addEventListener('click',function(){i=(i+1)%TIPS.length;tt.textContent=TIPS[i];});};
  INIT.help=function(w){
    $$('.tab',w).forEach(function(t){t.addEventListener('click',function(){
      $$('.tab',w).forEach(function(x){x.setAttribute('aria-selected',x===t?'true':'false');});
      $$('[data-panel]',w).forEach(function(p){p.hidden=p.dataset.panel!==t.dataset.tab;});
    });});
  };
  INIT.notepad=function(w){
    var ta=$('textarea',w),st=$('.np-status',w),ct=$('.np-count',w);
    var saved=store('fen95-notepad');
    ta.value=saved!=null?saved:"Things to do before the millennium\r\n----------------------------------\r\n- Defragment C: (again)\r\n- Burn mix CD for Dana: Moby, Portishead, Air\r\n- Beat Minesweeper on Intermediate under 100 s\r\n- Ask Dad to stay off the phone line after 9\r\n- Learn what 'Plug and Play' actually means\r\n\r\nThis note saves itself. Close the window and it will still be here.";
    function upd(){var v=ta.value.slice(0,ta.selectionStart);var ln=v.split('\n').length,col=v.length-v.lastIndexOf('\n');ct.textContent='Ln '+ln+', Col '+col;}
    ta.addEventListener('input',function(){store('fen95-notepad',ta.value);st.textContent='Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});upd();});
    ta.addEventListener('keyup',upd);ta.addEventListener('click',upd);
    $$('[data-np]',w).forEach(function(b){b.addEventListener('click',function(){
      var a=b.dataset.np;
      if(a==='new'){ta.value='';store('fen95-notepad','');st.textContent='New document';}
      if(a==='time'){var s=ta.selectionStart;var d=new Date().toLocaleString();ta.value=ta.value.slice(0,s)+d+ta.value.slice(ta.selectionEnd);store('fen95-notepad',ta.value);ta.focus();}
      if(a==='wrap'){ta.style.whiteSpace=ta.style.whiteSpace==='pre'?'':'pre';ta.style.overflowX=ta.style.whiteSpace==='pre'?'auto':'';b.textContent='Format: Word Wrap'+(ta.style.whiteSpace==='pre'?' (off)':'');}
    });});
    upd();
  };
  INIT.mines=function(w){
    var gridEl=$('.ms-grid',w),cnt=$('.ms-count',w),tm=$('.ms-time',w),face=$('.ms-face',w),fm=$('.ms-flagmode',w);
    var R=9,C=9,M=10,cells,over,started,opened,flags,timer=null,secs=0;
    function pad(n){n=Math.max(-99,Math.min(999,n));return (n<0?'-':'')+String(Math.abs(n)).padStart(n<0?2:3,'0');}
    function setFace(k){$('use',face).setAttribute('href','#i-'+k);}
    function newGame(r,c,m){
      if(r){R=r;C=c;M=m;}
      clearInterval(timer);timer=null;secs=0;over=false;started=false;opened=0;flags=0;
      tm.textContent='000';cnt.textContent=pad(M);setFace('smile');
      gridEl.style.gridTemplateColumns='repeat('+C+',22px)';
      gridEl.innerHTML='';cells=[];
      for(var i=0;i<R*C;i++){
        var b=document.createElement('button');b.className='cell';b.dataset.i=i;b.setAttribute('aria-label','hidden');
        gridEl.appendChild(b);cells.push({el:b,mine:false,n:0,open:false,flag:false});
      }
    }
    function nb(i){var r=Math.floor(i/C),c=i%C,out=[];for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;var rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C)out.push(rr*C+cc);}return out;}
    function plant(safe){
      var avoid=nb(safe).concat([safe]),placed=0;
      while(placed<M){var k=Math.floor(Math.random()*R*C);if(cells[k].mine||avoid.indexOf(k)>=0)continue;cells[k].mine=true;placed++;}
      cells.forEach(function(c,i){c.n=nb(i).filter(function(j){return cells[j].mine;}).length;});
    }
    function reveal(i){
      var c=cells[i];if(c.open||c.flag)return;
      c.open=true;opened++;c.el.classList.add('open');c.el.setAttribute('aria-label',c.mine?'mine':(c.n||'empty'));
      if(c.mine){c.el.innerHTML='<svg><use href="#i-bomb"/></svg>';return;}
      if(c.n){c.el.textContent=c.n;c.el.classList.add('n'+c.n);}
      else nb(i).forEach(reveal);
    }
    function lose(i){
      over=true;clearInterval(timer);setFace('dead');
      cells.forEach(function(c,j){
        if(c.mine&&!c.flag){c.el.classList.add('open');c.el.innerHTML='<svg><use href="#i-bomb"/></svg>';}
        if(!c.mine&&c.flag){c.el.innerHTML='<svg><use href="#i-bomb"/></svg>';c.el.style.background='#faa';}
      });
      cells[i].el.classList.add('boom');
    }
    function checkWin(){if(opened===R*C-M){over=true;clearInterval(timer);setFace('cool');cells.forEach(function(c){if(c.mine&&!c.flag){c.flag=true;c.el.innerHTML='<svg><use href="#i-mflag"/></svg>';}});cnt.textContent=pad(0);var best=+store('fen95-best-'+R)||0;if(!best||secs<best)store('fen95-best-'+R,String(secs));}}
    function toggleFlag(i){var c=cells[i];if(c.open||over)return;c.flag=!c.flag;flags+=c.flag?1:-1;c.el.innerHTML=c.flag?'<svg><use href="#i-mflag"/></svg>':'';c.el.setAttribute('aria-label',c.flag?'flagged':'hidden');cnt.textContent=pad(M-flags);}
    function chord(i){var c=cells[i];if(!c.open||!c.n)return;var f=nb(i).filter(function(j){return cells[j].flag;}).length;if(f!==c.n)return;nb(i).forEach(function(j){if(!cells[j].flag&&!cells[j].open){if(cells[j].mine){reveal(j);lose(j);}else reveal(j);}});if(!over)checkWin();}
    function click(i){
      if(over)return;var c=cells[i];
      if(fm.checked){toggleFlag(i);return;}
      if(c.flag)return;
      if(c.open){chord(i);return;}
      if(!started){started=true;plant(i);timer=setInterval(function(){secs++;tm.textContent=pad(secs);},1000);}
      if(c.mine){reveal(i);lose(i);return;}
      reveal(i);checkWin();
    }
    gridEl.addEventListener('click',function(e){var b=e.target.closest('.cell');if(b)click(+b.dataset.i);});
    gridEl.addEventListener('contextmenu',function(e){var b=e.target.closest('.cell');if(!b)return;e.preventDefault();if(!started&&!over){/* allow pre-flag */}toggleFlag(+b.dataset.i);});
    gridEl.addEventListener('pointerdown',function(e){if(!over&&e.button===0&&e.target.closest('.cell'))setFace('oh');});
    document.addEventListener('pointerup',function(){if(!over&&cells)setFace('smile');});
    face.addEventListener('click',function(){newGame();});
    $$('[data-ms]',w).forEach(function(b){b.addEventListener('click',function(){var a=b.dataset.ms;if(a==='new')newGame();if(a==='beg')newGame(9,9,10);if(a==='int')newGame(16,16,40);});});
    w._cleanup=function(){clearInterval(timer);};
    newGame();
  };
  INIT.paint=function(w){
    var cv=$('.pt-canvas',w),ctx=cv.getContext('2d'),status=$('.pt-status',w);
    var COLORS=["#000000","#808080","#800000","#808000","#008000","#008080","#000080","#800080","#808040","#004040","#0080ff","#004080","#8000ff","#804000","#ffffff","#c0c0c0","#ff0000","#ffff00","#00ff00","#00ffff","#0000ff","#ff00ff","#ffff80","#00ff80","#80ffff","#8080ff","#ff0080","#ff8040"];
    var fg="#000000",bg="#ffffff",tool="pencil",drawing=false,last=null,start=null,snap=null;
    var sw=$('.swatches',w);
    COLORS.forEach(function(c,i){var b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','colour '+c);b.title='Left: foreground · Right: background';
      b.addEventListener('click',function(){fg=c;cur();});
      b.addEventListener('contextmenu',function(e){e.preventDefault();bg=c;cur();});
      sw.appendChild(b);});
    function cur(){$('.fg',w).style.background=fg;$('.bg',w).style.background=bg;}
    cur();
    // size canvas to box
    function fit(){
      var box=$('.canvasbox',w);var nw=Math.max(200,Math.floor(box.clientWidth-10)),nh=Math.max(140,Math.floor(box.clientHeight-10));
      if(nw===cv.width&&nh===cv.height)return;
      var tmp=document.createElement('canvas');tmp.width=cv.width;tmp.height=cv.height;tmp.getContext('2d').drawImage(cv,0,0);
      cv.width=nw;cv.height=nh;ctx.fillStyle='#fff';ctx.fillRect(0,0,nw,nh);ctx.drawImage(tmp,0,0);
    }
    function demo(){
      ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
      ctx.fillStyle='#80ffff';ctx.fillRect(0,0,cv.width,cv.height*.62);
      ctx.fillStyle='#00ff00';ctx.fillRect(0,cv.height*.62,cv.width,cv.height);
      ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(cv.width-60,50,28,0,7);ctx.fill();
      ctx.fillStyle='#800000';ctx.fillRect(60,cv.height*.62-70,90,70);
      ctx.fillStyle='#ff0000';ctx.beginPath();ctx.moveTo(50,cv.height*.62-70);ctx.lineTo(105,cv.height*.62-115);ctx.lineTo(160,cv.height*.62-70);ctx.fill();
      ctx.fillStyle='#ffff80';ctx.fillRect(95,cv.height*.62-35,22,35);
      ctx.fillStyle='#000';ctx.font='bold 16px Tahoma,Arial';ctx.fillText('my house.bmp',190,cv.height*.62+34);
      status.textContent='A masterpiece in 16 colours.';
    }
    setTimeout(function(){fit();demo();},0);
    var ro=window.ResizeObserver?new ResizeObserver(function(){fit();}):null;if(ro)ro.observe($('.canvasbox',w));
    w._cleanup=function(){if(ro)ro.disconnect();};
    $$('.tool',w).forEach(function(b){b.addEventListener('click',function(){tool=b.dataset.tool;$$('.tool',w).forEach(function(x){x.classList.toggle('pressed',x===b);});status.textContent=b.title+' selected. Right mouse button paints with the background colour.';});});
    function pos(e){var r=cv.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*cv.width/r.width),y:Math.floor((e.clientY-r.top)*cv.height/r.height)};}
    function hexRGB(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
    function flood(x,y,col){
      var img=ctx.getImageData(0,0,cv.width,cv.height),d=img.data,W=cv.width,H=cv.height;
      var i0=(y*W+x)*4,t=[d[i0],d[i0+1],d[i0+2]],c=hexRGB(col);
      if(t[0]===c[0]&&t[1]===c[1]&&t[2]===c[2])return;
      var stack=[[x,y]];
      function same(i){return Math.abs(d[i]-t[0])<8&&Math.abs(d[i+1]-t[1])<8&&Math.abs(d[i+2]-t[2])<8;}
      while(stack.length){
        var p=stack.pop(),px=p[0],py=p[1];
        while(px>=0&&same((py*W+px)*4))px--;px++;
        var up=false,dn=false;
        while(px<W&&same((py*W+px)*4)){
          var k=(py*W+px)*4;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;
          if(py>0){if(same(((py-1)*W+px)*4)){if(!up){stack.push([px,py-1]);up=true;}}else up=false;}
          if(py<H-1){if(same(((py+1)*W+px)*4)){if(!dn){stack.push([px,py+1]);dn=true;}}else dn=false;}
          px++;
        }
      }
      ctx.putImageData(img,0,0);
    }
    function stroke(a,b,col,width){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.lineCap=width>1?'round':'square';ctx.beginPath();ctx.moveTo(a.x+.5,a.y+.5);ctx.lineTo(b.x+.5,b.y+.5);ctx.stroke();}
    var col;
    cv.addEventListener('contextmenu',function(e){e.preventDefault();});
    cv.addEventListener('pointerdown',function(e){
      e.preventDefault();cv.setPointerCapture(e.pointerId);
      col=e.button===2?bg:fg;var p=pos(e);
      if(tool==='fill'){flood(p.x,p.y,col);return;}
      drawing=true;last=p;start=p;
      if(tool==='line'||tool==='rect'||tool==='ellipse')snap=ctx.getImageData(0,0,cv.width,cv.height);
      move(e);
    });
    function move(e){
      var p=pos(e);status.textContent=p.x+', '+p.y;
      if(!drawing)return;
      if(tool==='pencil')stroke(last,p,col,1);
      else if(tool==='brush')stroke(last,p,col,5);
      else if(tool==='eraser')stroke(last,p,bg,14);
      else if(tool==='spray'){ctx.fillStyle=col;for(var i=0;i<18;i++){var a=Math.random()*6.283,r=Math.random()*10;ctx.fillRect(Math.round(p.x+Math.cos(a)*r),Math.round(p.y+Math.sin(a)*r),1,1);}}
      else if(snap){
        ctx.putImageData(snap,0,0);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();
        if(tool==='line'){ctx.moveTo(start.x+.5,start.y+.5);ctx.lineTo(p.x+.5,p.y+.5);}
        else if(tool==='rect'){ctx.rect(Math.min(start.x,p.x)+.5,Math.min(start.y,p.y)+.5,Math.abs(p.x-start.x),Math.abs(p.y-start.y));}
        else{ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.abs(p.x-start.x)/2+.1,Math.abs(p.y-start.y)/2+.1,0,0,6.283);}
        ctx.stroke();
      }
      last=p;
    }
    cv.addEventListener('pointermove',move);
    function end(){drawing=false;snap=null;}
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
    $$('[data-pt]',w).forEach(function(b){b.addEventListener('click',function(){var a=b.dataset.pt;
      if(a==='clear'){ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height);}
      if(a==='swap'){var t=fg;fg=bg;bg=t;cur();}
      if(a==='demo')demo();});});
  };
  INIT.bin=function(w){$('.empty-bin',w).addEventListener('click',function(e){e.target.parentNode.innerHTML='<b>Wastebasket</b><br>The Wastebasket is empty. It feels lighter already.';});};

  /* icons */
  $$('.icon[data-open]',$('#icons')).forEach(function(b){
    b.addEventListener('dblclick',function(){open(b.dataset.open);});
    b.addEventListener('click',function(e){
      $$('.icon').forEach(function(x){x.classList.toggle('sel',x===b);});
      if(e.detail===0||matchMedia('(pointer:coarse)').matches)open(b.dataset.open); // keyboard Enter / touch = open
    });
  });
  desktop.addEventListener('pointerdown',function(e){if(e.target===desktop||e.target.id==='icons'){$$('.icon').forEach(function(x){x.classList.remove('sel');});focusWin(null);}});

  /* start menu */
  var sm=$('#startmenu'),sb=$('#start');
  function closeStart(){sm.classList.remove('open');sb.classList.remove('pressed');sb.setAttribute('aria-expanded','false');}
  sb.addEventListener('click',function(e){e.stopPropagation();var o=!sm.classList.contains('open');sm.classList.toggle('open',o);sb.classList.toggle('pressed',o);sb.setAttribute('aria-expanded',o);if(o){var f=$('button',sm);f&&f.focus();}});
  $$('button[data-open]',sm).forEach(function(b){b.addEventListener('click',function(){open(b.dataset.open);});});
  $('#sm-showcase').addEventListener('click',function(){location.href='index.html';});
  $('#sm-shut').addEventListener('click',function(){closeStart();Object.keys(wins).forEach(close);$('#off').classList.add('show');$('#off').focus();});
  function restart(){$('#off').classList.remove('show');boot.classList.remove('gone');setTimeout(function(){boot.classList.add('gone');open('welcome');},reduce?50:900);}
  $('#off').addEventListener('click',restart);
  $('#off').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')restart();});
  document.addEventListener('pointerdown',function(e){if(!e.target.closest('#startmenu,#start'))closeStart();if(!e.target.closest('#ctx'))ctx.classList.remove('open');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeStart();ctx.classList.remove('open');}});

  /* context menu */
  var ctx=$('#ctx');
  var walls=["#008080","#000080","#3a6ea5","#008000","#808080","#400040"],wi=0;
  try{var sw0=localStorage.getItem('fen95-wall');if(sw0&&walls.indexOf(sw0)>=0){wi=walls.indexOf(sw0);document.body.style.background=sw0;}}catch(e){}
  desktop.addEventListener('contextmenu',function(e){
    if(e.target.closest('.win'))return;
    e.preventDefault();ctx.classList.add('open');
    ctx.style.left=Math.min(e.clientX,innerWidth-160)+'px';ctx.style.top=Math.min(e.clientY,innerHeight-140)+'px';
  });
  $('#ctx-wall').addEventListener('click',function(){wi=(wi+1)%walls.length;document.body.style.background=walls[wi];try{localStorage.setItem('fen95-wall',walls[wi]);}catch(e){}ctx.classList.remove('open');});
  $('#ctx-arrange').addEventListener('click',function(){ctx.classList.remove('open');var ic=$('#icons');var kids=$$('.icon',ic).sort(function(a,b){return a.textContent.localeCompare(b.textContent);});kids.forEach(function(k){ic.appendChild(k);});});
  $('#ctx-tile').addEventListener('click',function(){ctx.classList.remove('open');var i=0;Object.keys(wins).forEach(function(k){var w=wins[k];w.classList.remove('hidden','max');w.style.left=(desktop.clientWidth>600?110:8)+i*26+'px';w.style.top=20+i*24+'px';focusWin(w);i++;});});
  $('#ctx-props').addEventListener('click',function(){ctx.classList.remove('open');open('computer');});

  /* clock */
  function tick(){var d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});$('#clock').title=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
  tick();setInterval(tick,10000);

  /* initial windows */
  var small=innerWidth<=560;
  open('help');
  if(!small){var m=open('mines');m.style.left=Math.max(8,desktop.clientWidth-m.offsetWidth-40)+'px';m.style.top='40px';}
  var wel=open('welcome');
  if(!small){wel.style.left=Math.max(110,(desktop.clientWidth-wel.offsetWidth)/2)+'px';wel.style.top=Math.max(20,desktop.clientHeight-wel.offsetHeight-40)+'px';}
})();
</script>
