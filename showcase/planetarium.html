<title>Brass Dome Planetarium</title>
<meta name="description" content="A live night-sky planetarium: nearly three hundred real bright stars, constellation figures, the Milky Way, Sun and Moon computed for the current time and your chosen city, drag to look around and hover for names.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#02040c;
  --brass:#c8a25a;
  --brass2:#8a6a2e;
  --parch:#efe4c8;
  --dim:#8f8a78;
  --line:rgba(200,162,90,.28);
  --panel:rgba(8,9,16,.78);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--sky);color:var(--parch);font-family:Spectral,"Iowan Old Style",Georgia,serif;font-weight:300;overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.drag{cursor:grabbing}
.title{position:fixed;left:max(20px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));z-index:2;pointer-events:none}
.title h1{font-family:Cinzel,"Trajan Pro",Georgia,serif;font-weight:600;font-size:clamp(20px,2.6vw,32px);letter-spacing:.18em;margin:0;color:var(--brass);text-shadow:0 1px 0 #000}
.title p{margin:6px 0 0;font-size:14px;font-style:italic;color:var(--dim)}
.title p b{font-style:normal;font-weight:400;color:var(--parch)}
.back{position:fixed;right:max(20px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:3;font-family:Cinzel,Georgia,serif;font-size:12px;letter-spacing:.2em;color:var(--brass);text-decoration:none;border:1px solid var(--line);padding:6px 12px;background:var(--panel)}
.back:hover,.back:focus-visible{background:var(--brass);color:#120c02;outline:none}
.console{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);z-index:3;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 0 0 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(200,162,90,.2);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;font-size:14px}
.grp{display:flex;gap:6px;align-items:center}
.lbl{font-family:Cinzel,serif;font-size:10px;letter-spacing:.2em;color:var(--brass);text-transform:uppercase}
select,input[type=datetime-local],input[type=number]{background:#0c0d16;color:var(--parch);border:1px solid var(--line);font:inherit;font-size:14px;padding:4px 6px;color-scheme:dark}
input[type=number]{width:74px}
.b{background:transparent;border:1px solid var(--line);color:var(--parch);font-family:Cinzel,serif;font-size:11px;letter-spacing:.14em;padding:6px 10px;cursor:pointer}
.b:hover{border-color:var(--brass);color:var(--brass)}
.b[aria-pressed=true]{background:var(--brass);color:#120c02;border-color:var(--brass)}
.b:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.tip{position:fixed;z-index:4;pointer-events:none;background:rgba(8,9,16,.92);border:1px solid var(--line);padding:8px 12px;font-size:13px;line-height:1.45;opacity:0;transition:opacity .15s;min-width:170px}
.tip h3{font-family:Cinzel,serif;font-weight:600;font-size:14px;letter-spacing:.08em;margin:0 0 2px;color:var(--brass)}
.tip small{color:var(--dim);font-size:12px}
.compass{position:fixed;right:max(20px,env(safe-area-inset-right));top:max(60px,calc(env(safe-area-inset-top) + 48px));z-index:2;text-align:right;font-family:Cinzel,serif;font-size:11px;letter-spacing:.16em;color:var(--dim);pointer-events:none;line-height:1.9}
.compass b{color:var(--parch);font-weight:400}
.custom{display:none;gap:6px;align-items:center}
.custom.on{display:flex}
@media (max-width:760px){
  .console{gap:8px 10px;font-size:13px;padding:8px 10px}
  .title p{display:none}
  .compass{display:none}
  .hideS{display:none}
}
</style>
</head>

// ---------- astronomy ----------
function jd(date){return date.getTime()/86400000+2440587.5;}
function lstRad(date,lon){const d=jd(date)-2451545.0;let g=18.697374558+24.06570982441908*d;g=((g%24)+24)%24;return((g+lon/15)%24+24)%24*15*D2R;}
function altAz(ra,dec,lst,lat){const H=lst-ra;const sa=Math.sin(dec)*Math.sin(lat)+Math.cos(dec)*Math.cos(lat)*Math.cos(H);const alt=Math.asin(sa);
  const az=Math.atan2(-Math.cos(dec)*Math.sin(H),Math.sin(dec)*Math.cos(lat)-Math.cos(dec)*Math.sin(lat)*Math.cos(H));return[alt,(az+2*Math.PI)%(2*Math.PI)];}
function sunPos(date){const n=jd(date)-2451545.0;const L=(280.460+.9856474*n)*D2R,g=(357.528+.9856003*n)*D2R;const lam=L+(1.915*Math.sin(g)+.020*Math.sin(2*g))*D2R;const eps=(23.439-.0000004*n)*D2R;
  return{ra:Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),dec:Math.asin(Math.sin(eps)*Math.sin(lam)),lam};}
function moonPos(date){const d=jd(date)-2451545.0;const L=(218.316+13.176396*d)*D2R,M=(134.963+13.064993*d)*D2R,F=(93.272+13.229350*d)*D2R;
  const lam=L+6.289*D2R*Math.sin(M),bet=5.128*D2R*Math.sin(F);const eps=23.439*D2R;
  const ra=Math.atan2(Math.sin(lam)*Math.cos(eps)-Math.tan(bet)*Math.sin(eps),Math.cos(lam));const dec=Math.asin(Math.sin(bet)*Math.cos(eps)+Math.cos(bet)*Math.sin(eps)*Math.sin(lam));return{ra,dec,lam};}

// ---------- view ----------
const cv=document.getElementById('sky'),g=cv.getContext('2d');let W=0,H=0,dpr=1;
const view={az:180*D2R,alt:35*D2R,fov:100*D2R};
let loc={lat:51.5074,lon:-0.1278,name:'London'};
let simTime=Date.now(),speed=1,lastReal=performance.now();
const layers={lines:true,names:true,grid:false,mw:true};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);if(W<640&&view.fov>1.6)view.fov=110*D2R;}
function vec(alt,az){const c=Math.cos(alt);return[c*Math.sin(az),c*Math.cos(az),Math.sin(alt)];}
let basis=null,scale=1;
function setBasis(){const f=vec(view.alt,view.az);const r=[Math.cos(view.az),-Math.sin(view.az),0];const u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];basis={f,r,u};
  scale=Math.max(W,H)/2/(2*Math.tan(view.fov/4));}
function project(alt,az){const v=vec(alt,az);const cz=v[0]*basis.f[0]+v[1]*basis.f[1]+v[2]*basis.f[2];if(cz<-.35)return null;
  const cx=v[0]*basis.r[0]+v[1]*basis.r[1]+v[2]*basis.r[2],cy=v[0]*basis.u[0]+v[1]*basis.u[1]+v[2]*basis.u[2];const k=2/(1+cz);return[W/2+cx*k*scale,H/2-cy*k*scale,cz];}

let projected=[];
function draw(t){
  const date=new Date(simTime);const lat=loc.lat*D2R;const lst=lstRad(date,loc.lon);setBasis();
  const sun=sunPos(date);const [sAlt,sAz]=altAz(sun.ra,sun.dec,lst,lat);
  // sky colour by solar altitude
  const sa=sAlt*R2D;const day=Math.max(0,Math.min(1,(sa+12)/18));
  g.setTransform(dpr,0,0,dpr,0,0);
  const top=mix([2,4,12],[40,90,170],day),hor=mix([10,14,30],[150,190,230],day);
  const hp=project(0,view.az);const hy=hp?hp[1]:H;
  const sky=g.createLinearGradient(0,0,0,Math.max(10,hy));sky.addColorStop(0,rgb(top));sky.addColorStop(1,rgb(mix(hor,[255,140,80],Math.max(0,1-Math.abs(sa+3)/9)*.6)));
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  const starVis=Math.max(0,Math.min(1,(-sa-2)/10));
  // milky way
  if(layers.mw&&starVis>0){g.globalCompositeOperation='lighter';for(const p of MW){const [a,z]=altAz(p.ra,p.dec,lst,lat);if(a<-.05)continue;const q=project(a,z);if(!q)continue;
      const r=p.r*scale/500;const gr=g.createRadialGradient(q[0],q[1],0,q[0],q[1],r);gr.addColorStop(0,`rgba(150,160,210,${.05*p.a*starVis})`);gr.addColorStop(1,'rgba(150,160,210,0)');g.fillStyle=gr;g.fillRect(q[0]-r,q[1]-r,r*2,r*2);}g.globalCompositeOperation='source-over';}
  // grid
  if(layers.grid){g.strokeStyle='rgba(200,162,90,.18)';g.lineWidth=1;
    for(let a=0;a<90;a+=15){g.beginPath();let pen=false;for(let z=0;z<=360;z+=3){const q=project(a*D2R,z*D2R);if(!q){pen=false;continue;}pen?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);pen=true;}g.stroke();}
    for(let z=0;z<360;z+=15){g.beginPath();let pen=false;for(let a=0;a<=90;a+=3){const q=project(a*D2R,z*D2R);if(!q){pen=false;continue;}pen?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);pen=true;}g.stroke();}}
  // stars
  projected=[];const conCenters={};
  for(const s of stars){const [a,z]=altAz(s.ra,s.dec,lst,lat);s.alt=a;s.az=z;if(a<-.02){s.p=null;continue;}const q=project(a,z);s.p=q;if(!q)continue;
    if(q[0]<-40||q[0]>W+40||q[1]<-40||q[1]>H+40)continue;projected.push(s);
    if(!conCenters[s.con])conCenters[s.con]={x:0,y:0,n:0};const cc=conCenters[s.con];cc.x+=q[0];cc.y+=q[1];cc.n++;}
  if(layers.lines&&starVis>0){g.strokeStyle=`rgba(200,162,90,${.45*starVis})`;g.lineWidth=1;g.beginPath();
    for(const [a,b] of lines){if(!a.p||!b.p)continue;const dx=b.p[0]-a.p[0],dy=b.p[1]-a.p[1],d=Math.hypot(dx,dy);if(d>W*.9)continue;const ra=Math.min(6,d*.2)/d;
      g.moveTo(a.p[0]+dx*ra,a.p[1]+dy*ra);g.lineTo(b.p[0]-dx*ra,b.p[1]-dy*ra);}g.stroke();}
  const zoom=100*D2R/view.fov;
  for(const s of projected){const q=s.p;const r=Math.max(.6,(4.6-s.mag)*.72*Math.pow(zoom,.35));const tw=reduce?1:.82+.18*Math.sin(t*3+s.tw)*(s.alt<.35?1.6:.6);
    const al=Math.min(1,(1.1-s.mag*.12))*starVis*tw*Math.min(1,.3+s.alt*3);if(al<=.01)continue;const [cr,cg2,cb]=s.col;
    if(s.mag<1.6){const gr=g.createRadialGradient(q[0],q[1],0,q[0],q[1],r*4.5);gr.addColorStop(0,`rgba(${cr},${cg2},${cb},${.35*al})`);gr.addColorStop(1,`rgba(${cr},${cg2},${cb},0)`);g.fillStyle=gr;g.fillRect(q[0]-r*4.5,q[1]-r*4.5,r*9,r*9);}
    g.fillStyle=`rgba(${cr},${cg2},${cb},${al})`;g.beginPath();g.arc(q[0],q[1],r,0,6.283);g.fill();}
  if(layers.names&&starVis>0){g.font='12px Spectral, Georgia, serif';g.fillStyle=`rgba(239,228,200,${.7*starVis})`;g.textBaseline='middle';
    const lim=1.6+Math.max(0,(zoom-1))*1.8;for(const s of projected){if(s.mag>lim||/^[A-Z][a-z]+ [A-Z]/.test(s.name)&&s.mag>1.8)continue;g.fillText(s.name,s.p[0]+6,s.p[1]-7);}
    g.font='600 11px Cinzel, Georgia, serif';g.fillStyle=`rgba(200,162,90,${.55*starVis})`;g.textAlign='center';
    for(const c in conCenters){const cc=conCenters[c];if(cc.n<3||!CON[c])continue;g.fillText(CON[c].toUpperCase(),cc.x/cc.n,cc.y/cc.n+22);}g.textAlign='left';}
  // moon & sun
  const moon=moonPos(date);const [mAlt,mAz]=altAz(moon.ra,moon.dec,lst,lat);const mq=mAlt>-.02?project(mAlt,mAz):null;
  if(mq){const r=Math.max(7,.26*D2R*scale*2);const phase=((moon.lam-sun.lam)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);drawMoon(mq[0],mq[1],r,phase);
    if(layers.names){g.font='italic 13px Spectral, Georgia, serif';g.fillStyle='rgba(239,228,200,.85)';g.fillText('Moon · '+phaseName(phase),mq[0]+r+6,mq[1]);}}
  if(sAlt>-.02){const sq=project(sAlt,sAz);if(sq){const r=Math.max(9,.27*D2R*scale*2);const gr=g.createRadialGradient(sq[0],sq[1],0,sq[0],sq[1],r*8);gr.addColorStop(0,'rgba(255,245,210,1)');gr.addColorStop(.12,'rgba(255,230,160,.9)');gr.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gr;g.fillRect(sq[0]-r*8,sq[1]-r*8,r*16,r*16);}}
  // ground
  drawGround(day);
  // cardinal points
  g.font='600 14px Cinzel, Georgia, serif';g.textAlign='center';
  const card=[['N',0],['NE',45],['E',90],['SE',135],['S',180],['SW',225],['W',270],['NW',315]];
  for(const [n,z] of card){const q=project(0,z*D2R);if(!q)continue;g.fillStyle=n.length===1?'#c8a25a':'rgba(200,162,90,.6)';g.fillText(n,q[0],q[1]+20);}
  g.textAlign='left';
  // compass readouts
  if((t*4|0)!==draw._k){draw._k=t*4|0;
    document.getElementById('cAz').textContent=(view.az*R2D).toFixed(0)+'°';document.getElementById('cAlt').textContent=(view.alt*R2D).toFixed(0)+'°';document.getElementById('cFov').textContent=(view.fov*R2D).toFixed(0)+'°';
    const lh=lst*R2D/15;document.getElementById('cLst').textContent=String(Math.floor(lh)).padStart(2,'0')+'h '+String(Math.floor(lh%1*60)).padStart(2,'0')+'m';
    const dirs=['north','north-east','east','south-east','south','south-west','west','north-west'];document.getElementById('facing').textContent=dirs[Math.round(view.az*R2D/45)%8];
    document.getElementById('where').textContent=loc.name;document.getElementById('when').textContent=date.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
}
function drawGround(day){
  const col=mix([8,10,8],[40,52,36],day);g.fillStyle=rgb(col);g.strokeStyle=rgb(col);g.lineWidth=1;
  for(let a=0;a>-90;a-=10)for(let z=0;z<360;z+=10){const p1=project(a*D2R,z*D2R),p2=project(a*D2R,(z+10)*D2R),p3=project((a-10)*D2R,(z+10)*D2R),p4=project((a-10)*D2R,z*D2R);
    if(!p1||!p2||!p3||!p4)continue;g.beginPath();g.moveTo(p1[0],p1[1]);g.lineTo(p2[0],p2[1]);g.lineTo(p3[0],p3[1]);g.lineTo(p4[0],p4[1]);g.closePath();g.fill();g.stroke();}
  // skyline silhouette and horizon glow
  g.beginPath();let first=true;for(let z=0;z<=360;z+=1){const h=(Math.sin(z*.9)*.5+Math.sin(z*2.3)*.3+Math.sin(z*.17)*.8+1.4)*.9+(Math.sin(z*7.1)>.6?1.6:0);const q=project(h*D2R,z*D2R);if(!q){first=true;continue;}first?g.moveTo(q[0],q[1]):g.lineTo(q[0],q[1]);first=false;}
  for(let z=360;z>=0;z-=1){const q=project(-.5*D2R,z*D2R);if(q)g.lineTo(q[0],q[1]);}g.closePath();g.fill();
  g.strokeStyle='rgba(200,162,90,.35)';g.beginPath();first=true;for(let z=0;z<=360;z+=2){const q=project(0,z*D2R);if(!q){first=true;continue;}first?g.moveTo(q[0],q[1]):g.lineTo(q[0],q[1]);first=false;}g.stroke();
}
function drawMoon(x,y,r,phase){
  g.save();g.fillStyle='rgba(40,40,50,.9)';g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
  const lit=(1-Math.cos(phase))/2;const waxing=phase<Math.PI;
  g.fillStyle='#f4efdc';g.beginPath();
  g.arc(x,y,r,-Math.PI/2,Math.PI/2,!waxing);
  const k=Math.cos(phase);g.ellipse(x,y,Math.abs(k)*r,r,0,Math.PI/2,-Math.PI/2,(k<0)!==waxing?false:true);
  g.fill();g.shadowBlur=0;
  const gl=g.createRadialGradient(x,y,r,x,y,r*3);gl.addColorStop(0,`rgba(244,239,220,${.18*lit})`);gl.addColorStop(1,'rgba(244,239,220,0)');g.fillStyle=gl;g.beginPath();g.arc(x,y,r*3,0,6.283);g.fill();
  g.restore();
}
function phaseName(p){const d=p*R2D;return d<10||d>350?'new':d<80?'waxing crescent':d<100?'first quarter':d<170?'waxing gibbous':d<190?'full':d<260?'waning gibbous':d<280?'last quarter':'waning crescent';}
function mix(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t);}function rgb(c){return`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}

// ---------- interaction ----------
const pts=new Map();let pinch0=0,dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1){dragging=true;lx=e.clientX;ly=e.clientY;cv.classList.add('drag');}else{const a=[...pts.values()];pinch0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const a=[...pts.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch0)zoomBy(pinch0/d);pinch0=d;return;}
  if(dragging){const k=view.fov/Math.max(W,H)*1.3;view.az=((view.az-(e.clientX-lx)*k)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);view.alt=Math.max(-10*D2R,Math.min(89.5*D2R,view.alt+(e.clientY-ly)*k));lx=e.clientX;ly=e.clientY;hideTip();return;}
  hover(e.clientX,e.clientY);});
function up(e){pts.delete(e.pointerId);if(!pts.size){dragging=false;cv.classList.remove('drag');}pinch0=0;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',hideTip);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(e.deltaY*.001));},{passive:false});
function zoomBy(f){view.fov=Math.max(15*D2R,Math.min(160*D2R,view.fov*f));}
const tip=document.getElementById('tip');
function hover(x,y){let best=null,bd=14*14;for(const s of projected){const dx=s.p[0]-x,dy=s.p[1]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=s;}}
  if(!best){hideTip();return;}
  const raH=best.ra*R2D/15,dec=best.dec*R2D;
  tip.innerHTML=`<h3>${best.name}</h3>${CON[best.con]||best.con} · magnitude ${best.mag.toFixed(2)}<br><small>RA ${Math.floor(raH)}h ${String(Math.round(raH%1*60)).padStart(2,'0')}m · Dec ${dec>=0?'+':'−'}${Math.abs(dec).toFixed(1)}°<br>Alt ${(best.alt*R2D).toFixed(1)}° · Az ${(best.az*R2D).toFixed(1)}°</small>`;
  tip.style.opacity='1';tip.style.left=Math.min(W-200,x+16)+'px';tip.style.top=Math.min(H-110,y+16)+'px';}
function hideTip(){tip.style.opacity='0';}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const st=5*D2R;
  if(e.key==='ArrowLeft')view.az=(view.az-st+2*Math.PI)%(2*Math.PI);if(e.key==='ArrowRight')view.az=(view.az+st)%(2*Math.PI);
  if(e.key==='ArrowUp')view.alt=Math.min(89.5*D2R,view.alt+st);if(e.key==='ArrowDown')view.alt=Math.max(-10*D2R,view.alt-st);
  if(e.key==='+'||e.key==='=')zoomBy(.85);if(e.key==='-')zoomBy(1.18);});

// controls
const dtEl=document.getElementById('dt');
function toLocalInput(ms){const d=new Date(ms);const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
dtEl.value=toLocalInput(simTime);
dtEl.addEventListener('change',()=>{const v=new Date(dtEl.value);if(!isNaN(v))simTime=v.getTime();});
document.getElementById('btnNow').addEventListener('click',()=>{simTime=Date.now();setSpeed(1);dtEl.value=toLocalInput(simTime);});
function setSpeed(s){speed=s;document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===s)));}
document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>setSpeed(+b.dataset.s)));
document.getElementById('city').addEventListener('change',e=>{const v=e.target.value;const box=document.getElementById('customBox');
  if(v==='custom'){box.classList.add('on');applyCustom();return;}box.classList.remove('on');const [la,lo,n]=v.split(',');loc={lat:+la,lon:+lo,name:n};
  document.getElementById('lat').value=(+la).toFixed(1);document.getElementById('lon').value=(+lo).toFixed(1);
  // face the celestial equator by default: south in the north, north in the south
  view.az=(+la>=0?180:0)*D2R;});
function applyCustom(){const la=Math.max(-90,Math.min(90,+document.getElementById('lat').value||0)),lo=Math.max(-180,Math.min(180,+document.getElementById('lon').value||0));loc={lat:la,lon:lo,name:`${Math.abs(la).toFixed(1)}°${la>=0?'N':'S'}, ${Math.abs(lo).toFixed(1)}°${lo>=0?'E':'W'}`};}
document.getElementById('lat').addEventListener('change',applyCustom);document.getElementById('lon').addEventListener('change',applyCustom);
function tog(id,key){const b=document.getElementById(id);b.addEventListener('click',()=>{layers[key]=!layers[key];b.setAttribute('aria-pressed',String(layers[key]));});}
tog('lyLines','lines');tog('lyNames','names');tog('lyGrid','grid');tog('lyMW','mw');

// if it's daytime in London right now, open on tonight at 22:00 so the sky shows stars
(function(){const d=new Date();const s=sunPos(d);const [a]=altAz(s.ra,s.dec,lstRad(d,loc.lon),loc.lat*D2R);if(a>-8*D2R){const n=new Date(d);n.setHours(22,0,0,0);if(n<d)n.setDate(n.getDate()+1);simTime=n.getTime();dtEl.value=toLocalInput(simTime);}})();

let dtT=0;
function loop(now){const dt=(now-lastReal)/1000;lastReal=now;simTime+=dt*1000*speed;
  if(speed!==1&&(dtT+=dt)>.5){dtT=0;dtEl.value=toLocalInput(simTime);}
  draw(now/1000);requestAnimationFrame(loop);}
addEventListener('resize',resize);resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
