<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compositor Text Case</title>
<meta name="description" content="A letterpress type-case of text utilities: case transforms, slugify, counts, sort and dedupe lines, find and replace with regex, a two-text diff and Base64, URL and HTML encoding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Spectral:ital,wght@0,400;0,600;1,400&family=Overpass+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ecebe7; --paper-2:#f7f6f3; --ink:#1d1b19; --ink-2:#4a4640; --muted:#77716a; --hair:#cfccc5;
  --wood:#6b4a2f; --wood-2:#4d341f; --wood-3:#8a6340; --slot:#2a1d12; --metal:#b9b4ab; --metal-2:#8d887f;
  --pink:#d6006f; --pink-soft:rgba(214,0,111,.12); --add:#1f7a4d; --add-bg:rgba(31,122,77,.13); --del:#b3261e; --del-bg:rgba(179,38,30,.12);
  --slab:"Alfa Slab One","Rockwell Extra Bold","Rockwell",Georgia,serif; --serif:"Spectral",Georgia,serif; --mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#171513;--paper-2:#201d1a;--ink:#ece7df;--ink-2:#c3bbb0;--muted:#8f877c;--hair:#34302b;--wood:#3e2a1a;--wood-2:#2a1c11;--wood-3:#553a24;--slot:#120c07;--metal:#a8a298;--metal-2:#7d776e;--pink:#ff4fa7;--pink-soft:rgba(255,79,167,.14);--add:#63d49a;--add-bg:rgba(99,212,154,.13);--del:#ff8a80;--del-bg:rgba(255,138,128,.13);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button{font:inherit;color:inherit}
.wrap{max-width:1220px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 70px max(16px,env(safe-area-inset-left))}
.back{font:600 12px var(--mono);color:var(--muted);text-decoration:none;letter-spacing:.06em}
.back:hover{color:var(--pink)}
header{display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:end;margin:18px 0 26px}
@media (max-width:700px){header{grid-template-columns:1fr}}
h1{font:400 clamp(52px,10vw,128px)/.82 var(--slab);margin:0;letter-spacing:-.01em;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.25)}
h1 span{color:var(--pink);display:block;font-size:.42em;letter-spacing:.02em;margin-top:.1em}
.intro{font:italic 400 18px/1.45 var(--serif);color:var(--ink-2);max-width:48ch;margin:0}
.intro b{font-style:normal;font-weight:600;color:var(--ink)}
/* stick */
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.panes{grid-template-columns:minmax(0,1fr)}}
.pane{display:grid;gap:6px}
.pane .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pane label,.lbl{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pane .acts{display:flex;gap:6px;flex-wrap:wrap}
.mini{font:600 11px var(--mono);letter-spacing:.06em;padding:5px 9px;border:1px solid var(--hair);background:var(--paper-2);cursor:pointer;border-radius:2px;color:var(--ink-2)}
.mini:hover{border-color:var(--pink);color:var(--pink)}
.mini.pk{background:var(--pink);color:#fff;border-color:var(--pink)}
.mini.pk:hover{color:#fff;filter:brightness(1.1)}
textarea{width:100%;min-height:230px;resize:vertical;font:14px/1.6 var(--mono);color:var(--ink);background:var(--paper-2);border:1px solid var(--hair);border-top:4px solid var(--metal);padding:12px 14px;border-radius:0 0 2px 2px;box-shadow:inset 0 2px 6px rgba(0,0,0,.06);tab-size:2}
textarea:focus{outline:none;border-top-color:var(--pink)}
.stats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:1px solid var(--hair);margin:14px 0 26px;background:var(--paper-2)}
@media (max-width:820px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:10px 10px 8px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-bottom:-1px}
.stat:nth-child(8n){border-right:0}
.stat b{display:block;font:400 22px var(--slab);color:var(--ink)}
.stat span{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* tabs */
.tabs{display:flex;gap:0;margin-bottom:0;flex-wrap:wrap}
.tabs button{font:400 18px var(--slab);padding:10px 18px 8px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pink)}
.tabpanel{border-top:1px solid var(--hair);padding-top:18px}
.tabpanel[hidden]{display:none}
/* type case */
.case{background:linear-gradient(180deg,var(--wood-3),var(--wood));padding:12px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--wood-2),0 20px 34px -24px rgba(0,0,0,.7);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.bay{grid-column:span 3;background:var(--wood-2);padding:6px;display:grid;gap:4px;border-radius:2px;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.bay.w4{grid-column:span 4}.bay.w6{grid-column:span 6}.bay.w2{grid-column:span 2}
@media (max-width:980px){.bay,.bay.w4,.bay.w2{grid-column:span 6}.bay.w6{grid-column:span 12}}
@media (max-width:560px){.bay,.bay.w4,.bay.w2,.bay.w6{grid-column:span 12}}
.bay h3{margin:0 2px 2px;font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#e9d9c4;opacity:.8}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:4px}
.sort{position:relative;background:var(--slot);border:0;cursor:pointer;padding:8px 4px 6px;display:grid;justify-items:center;gap:4px;border-radius:1px;box-shadow:inset 0 3px 5px rgba(0,0,0,.6);min-width:0}
.sort .blk{width:44px;height:40px;display:grid;place-items:center;background:linear-gradient(180deg,var(--metal),var(--metal-2));color:#1b1b1b;font:400 19px var(--slab);border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.25),0 2px 2px rgba(0,0,0,.5);transform:scaleX(-1);transition:transform .35s cubic-bezier(.4,1.6,.5,1);white-space:nowrap;overflow:hidden}
.sort:hover .blk,.sort:focus-visible .blk{transform:scaleX(1) translateY(-2px)}
.sort .nm{font:600 10.5px var(--mono);color:#efe4d6;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.sort.hit .blk{background:var(--pink);color:#fff}
@media (prefers-reduced-motion:reduce){.sort .blk{transition:none}}
.last{font:13px var(--mono);color:var(--muted);margin:10px 0 0;min-height:1.3em}
.last b{color:var(--pink);font-weight:600}
/* find */
.frrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:700px){.frrow{grid-template-columns:minmax(0,1fr)}}
.frrow input[type=text]{width:100%;font:15px var(--mono);padding:9px 10px;border:1px solid var(--hair);border-bottom:3px solid var(--ink);background:var(--paper-2);color:var(--ink)}
.checks{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;font:13px var(--mono);color:var(--ink-2)}
.checks input{accent-color:var(--pink)}
.bigbtn{font:400 16px var(--slab);padding:10px 18px;border:0;background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px}
.bigbtn:hover{background:var(--pink);color:#fff}
.hl{white-space:pre-wrap;word-break:break-word;font:14px/1.6 var(--mono);background:var(--paper-2);border:1px solid var(--hair);padding:12px 14px;max-height:280px;overflow:auto}
.hl mark{background:var(--pink-soft);color:var(--pink);border-bottom:2px solid var(--pink)}
.frmsg{font:13px var(--mono);color:var(--muted);margin:8px 0}
.frmsg.err{color:var(--del)}
/* diff */
.difftools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{font:600 12px var(--mono);padding:6px 12px;border:0;background:transparent;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.diffout{font:13.5px/1.6 var(--mono);border:1px solid var(--hair);background:var(--paper-2);max-height:420px;overflow:auto}
.dl{display:grid;grid-template-columns:34px 34px 18px minmax(0,1fr);white-space:pre-wrap;word-break:break-word}
.dl .n{color:var(--muted);text-align:right;padding-right:6px;font-size:11.5px;user-select:none}
.dl .s{text-align:center;user-select:none}
.dl.add{background:var(--add-bg)}.dl.add .s{color:var(--add)}
.dl.del{background:var(--del-bg)}.dl.del .s{color:var(--del)}
.words{padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.words ins{background:var(--add-bg);color:var(--add);text-decoration:none;border-bottom:2px solid var(--add)}
.words del{background:var(--del-bg);color:var(--del)}
.dsum{font:13px var(--mono);color:var(--muted)}
.dsum b.a{color:var(--add)}.dsum b.d{color:var(--del)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);font:600 13px var(--mono);padding:8px 14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html" id="backLink">← SHOWCASE</a>
  <header>
    <h1>Compositor<span>text case &amp; press</span></h1>
    <p class="intro">Set your copy in the <b>stick</b>, pick a sort from the <b>case</b>, and pull a proof. Every tool reads the left pane and prints to the right. Hover a block to read it the right way round.</p>
  </header>

  <div class="panes">
    <div class="pane">
      <div class="hd"><label for="inp">Composing stick · input</label><div class="acts"><button class="mini" id="undo" type="button">Undo</button><button class="mini" id="clearIn" type="button">Clear</button><button class="mini" id="sample" type="button">Sample</button></div></div>
      <textarea id="inp" spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="hd"><label for="out">Proof · output</label><div class="acts"><button class="mini" id="useOut" type="button">← Use as input</button><button class="mini pk" id="copyOut" type="button">Copy</button></div></div>
      <textarea id="out" spellcheck="false" readonly></textarea>
    </div>
  </div>

  <div class="stats" id="stats" aria-live="polite"></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-case" aria-selected="true" aria-controls="p-case" type="button">The case</button>
    <button role="tab" id="tab-find" aria-selected="false" aria-controls="p-find" type="button">Find &amp; replace</button>
    <button role="tab" id="tab-diff" aria-selected="false" aria-controls="p-diff" type="button">Compare</button>
  </div>

  <section class="tabpanel" id="p-case" role="tabpanel" aria-labelledby="tab-case">
    <div class="case" id="case"></div>
    <p class="last" id="last">Tip: tools chain — press “Use as input” to keep composing.</p>
  </section>

  <section class="tabpanel" id="p-find" role="tabpanel" aria-labelledby="tab-find" hidden>
    <div class="frrow">
      <div><label class="lbl" for="fFind">Find</label><input type="text" id="fFind" spellcheck="false" autocomplete="off"></div>
      <div><label class="lbl" for="fRep">Replace with</label><input type="text" id="fRep" spellcheck="false" autocomplete="off"></div>
      <button class="bigbtn" id="fGo" type="button">Replace all</button>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="fRegex"> Regular expression</label>
      <label><input type="checkbox" id="fCase"> Match case</label>
      <label><input type="checkbox" id="fWord"> Whole words</label>
    </div>
    <p class="frmsg" id="fMsg"></p>
    <div class="hl" id="fPrev" aria-label="Matches highlighted"></div>
  </section>

  <section class="tabpanel" id="p-diff" role="tabpanel" aria-labelledby="tab-diff" hidden>
    <div class="pane"><label for="diffB">Revised text (compared against the input)</label><textarea id="diffB" spellcheck="false" style="min-height:160px"></textarea></div>
    <div class="difftools">
      <div class="seg" role="group" aria-label="Diff granularity"><button type="button" id="dLines" aria-pressed="true">Lines</button><button type="button" id="dWords" aria-pressed="false">Words</button></div>
      <label class="checks" style="margin:0"><input type="checkbox" id="dWs"> Ignore whitespace</label>
      <span class="dsum" id="dSum"></span>
    </div>
    <div class="diffout" id="diffOut"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const KEY='compositor-text-v1';
  const ls={get(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};
  const SAMPLE=`Harbour Street Press — autumn list
the quiet art of setting type by hand
  Wood type, metal type & the long afternoon
Harbour Street Press — autumn list
Ink on the rollers, paper on the tympan
https://harbourstreet.example/autumn-list?ref=newsletter&issue=14
café crème, 12 copies, £4.50 each
the quiet art of setting type by hand

Order of work: lock up the forme, make ready, pull a proof.`;
  const SAMPLE_B=`Harbour Street Press — winter list
the quiet art of setting type by hand
Wood type, metal type & the long evening
Ink on the rollers, paper on the tympan
café crème, 20 copies, £4.50 each

Order of work: lock up the forme, make ready, pull a proof, then clean the press.`;
  const saved=ls.get()||{};
  const inp=$('inp'),out=$('out');
  inp.value=saved.inp??SAMPLE;$('diffB').value=saved.b??SAMPLE_B;
  ['fFind','fRep'].forEach(k=>$(k).value=saved[k]??(k==='fFind'?'(\\d+) copies':'$1 prints'));
  $('fRegex').checked=saved.fRegex??true;$('fCase').checked=!!saved.fCase;$('fWord').checked=!!saved.fWord;
  let undoStack=[];
  function persist(){ls.set({inp:inp.value,b:$('diffB').value,fFind:$('fFind').value,fRep:$('fRep').value,fRegex:$('fRegex').checked,fCase:$('fCase').checked,fWord:$('fWord').checked})}
  // ---- transforms ----
  const words=s=>s.match(/[\p{L}\p{N}]+(?:['’][\p{L}]+)?/gu)||[];
  const splitId=s=>s.replace(/([\p{Ll}\p{N}])(\p{Lu})/gu,'$1 $2').replace(/(\p{Lu})(\p{Lu}\p{Ll})/gu,'$1 $2').split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const perLine=f=>s=>s.split('\n').map(f).join('\n');
  const SMALL=new Set('a an and as at but by for from in into nor of on or over per the to up via vs with'.split(' '));
  const title=perLine(l=>/^\s*\w+:\/\//.test(l)?l:l.toLowerCase().replace(/[\p{L}\p{N}][\p{L}\p{N}'’]*/gu,(w,i)=>i>0&&SMALL.has(w)&&!/[:—-]\s*$/.test(l.slice(0,i))?w:w[0].toUpperCase()+w.slice(1)));
  const sentence=s=>s.toLowerCase().replace(/(^\s*|[.!?]\s+|\n\s*)(\p{Ll})/gu,(m,a,b)=>a+b.toUpperCase());
  const camel=perLine(l=>{const w=splitId(l);return w.map((x,i)=>i?x[0].toUpperCase()+x.slice(1).toLowerCase():x.toLowerCase()).join('')});
  const pascal=perLine(l=>splitId(l).map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase()).join(''));
  const joinWith=(sep,up)=>perLine(l=>splitId(deacc(l)).map(x=>up?x.toUpperCase():x.toLowerCase()).join(sep));
  const deacc=s=>s.normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/æ/g,'ae').replace(/ø/g,'o').replace(/&/g,' and ').replace(/£/g,' gbp ');
  const slug=perLine(l=>deacc(l).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''));
  const b64e=s=>{const b=new TextEncoder().encode(s);let bin='';b.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin)};
  const b64d=s=>{const bin=atob(s.replace(/\s+/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))};
  const collator=new Intl.Collator('en',{numeric:true,sensitivity:'base'});
  const L=s=>s.split('\n');
  const TOOLS=[
    {bay:'Capitals & small',w:'w4',items:[
      ['UPPER','AB',s=>s.toUpperCase()],['lower','ab',s=>s.toLowerCase()],['Title Case','Tc',title],['Sentence','Sc',sentence],['iNVERT','iN',s=>[...s].map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('')],['aLtErNaTe','aL',s=>{let i=0;return [...s].map(c=>/\p{L}/u.test(c)?(i++%2?c.toUpperCase():c.toLowerCase()):c).join('')}]]},
    {bay:'Identifiers',w:'w4',items:[
      ['camelCase','cC',camel],['PascalCase','PC',pascal],['snake_case','s_',joinWith('_')],['kebab-case','k-',joinWith('-')],['CONSTANT','C_',joinWith('_',true)],['slugify','/s',slug]]},
    {bay:'Lines · order',w:'w4',items:[
      ['Sort A→Z','A↓',s=>L(s).sort(collator.compare).join('\n')],['Sort Z→A','Z↓',s=>L(s).sort((a,b)=>collator.compare(b,a)).join('\n')],['By length','≡',s=>L(s).sort((a,b)=>a.length-b.length||collator.compare(a,b)).join('\n')],['Reverse','⇅',s=>L(s).reverse().join('\n')],['Shuffle','⁂',s=>{const a=L(s);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.join('\n')}],['Number','1.',s=>{const a=L(s);const w=String(a.length).length;return a.map((l,i)=>String(i+1).padStart(w,' ')+'. '+l).join('\n')}]]},
    {bay:'Lines · clean',w:'w6',items:[
      ['Dedupe','≠',s=>{const seen=new Set();return L(s).filter(l=>{const k=l.trim();if(k&&seen.has(k))return false;seen.add(k);return true}).join('\n')}],['Dedupe (any case)','≠a',s=>{const seen=new Set();return L(s).filter(l=>{const k=l.trim().toLowerCase();if(k&&seen.has(k))return false;seen.add(k);return true}).join('\n')}],['Drop blanks','¶',s=>L(s).filter(l=>l.trim()).join('\n')],['Trim lines','|x|',s=>L(s).map(l=>l.trim()).join('\n')],['Collapse spaces','␣',s=>L(s).map(l=>l.replace(/[ \t]+/g,' ')).join('\n')],['Join lines','⌒',s=>L(s).map(l=>l.trim()).filter(Boolean).join(' ')],['Split sentences','.↵',s=>s.replace(/([.!?])\s+(?=\S)/g,'$1\n')],['Strip tags','<>',s=>s.replace(/<[^>]*>/g,'')]]},
    {bay:'Encode',w:'w6',items:[
      ['Base64 encode','64',b64e],['Base64 decode','46',b64d],['URL encode','%',s=>encodeURIComponent(s)],['URL decode','%⁻',s=>decodeURIComponent(s.replace(/\+/g,' '))],['HTML escape','&;',s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')],['HTML unescape',';&',s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value}],['ASCII fold','é→e',s=>s.normalize('NFKD').replace(/[̀-ͯ]/g,'')],['Reverse text','◁',s=>[...s].reverse().join('')]]}
  ];
  const caseEl=$('case');
  TOOLS.forEach((b,bi)=>{const bay=document.createElement('div');bay.className='bay '+(b.w||'');bay.innerHTML=`<h3>${b.bay}</h3><div class="slots"></div>`;
    b.items.forEach(([name,glyph,fn],ii)=>{const bt=document.createElement('button');bt.type='button';bt.className='sort';bt.id='t'+bi+'_'+ii;bt.innerHTML=`<span class="blk" aria-hidden="true"></span><span class="nm"></span>`;bt.querySelector('.blk').textContent=glyph;bt.querySelector('.nm').textContent=name;bt.setAttribute('aria-label',name);
      bt.onclick=()=>{try{out.value=fn(inp.value);$('last').innerHTML='Pulled a proof with <b></b>. '+diffNote(inp.value,out.value);$('last').querySelector('b').textContent=name;bt.classList.add('hit');setTimeout(()=>bt.classList.remove('hit'),400)}catch(e){$('last').textContent='That sort does not fit this copy: '+(e.message||e)}};
      bay.querySelector('.slots').appendChild(bt)});
    caseEl.appendChild(bay)});
  function diffNote(a,b){const la=L(a).length,lb=L(b).length;return la!==lb?`${la} → ${lb} lines.`:`${b.length.toLocaleString()} characters.`}
  // stats
  function stats(){
    const s=inp.value;const w=words(s);const lines=s?L(s).length:0;const sent=(s.match(/[^.!?\n]+[.!?]+/g)||[]).length||(s.trim()?1:0);const paras=s.split(/\n\s*\n/).filter(p=>p.trim()).length;
    const avg=w.length?(w.reduce((a,x)=>a+x.length,0)/w.length).toFixed(1):'0';const bytes=new TextEncoder().encode(s).length;
    const items=[[w.length,'words'],[[...s].length,'characters'],[s.replace(/\s/g,'').length,'no spaces'],[lines,'lines'],[sent,'sentences'],[paras,'paragraphs'],[avg,'avg word'],[Math.max(w.length?1:0,Math.round(w.length/230))+' min','read · '+bytes+' B']];
    $('stats').innerHTML=items.map(([v,k])=>`<div class="stat"><b>${typeof v==='number'?v.toLocaleString():v}</b><span>${k}</span></div>`).join('');
  }
  let pT;
  inp.addEventListener('input',()=>{stats();clearTimeout(pT);pT=setTimeout(()=>{persist();if(!$('p-find').hidden)findPrev();if(!$('p-diff').hidden)diff()},200)});
  inp.addEventListener('beforeinput',()=>{if(!undoStack.length||undoStack[undoStack.length-1]!==inp.value){undoStack.push(inp.value);if(undoStack.length>50)undoStack.shift()}},{capture:true});
  function setInput(v){undoStack.push(inp.value);inp.value=v;stats();persist();findPrev();diff()}
  $('undo').onclick=()=>{if(undoStack.length){inp.value=undoStack.pop();stats();persist();findPrev();diff()}else toast('Nothing to undo')};
  $('clearIn').onclick=()=>{setInput('');inp.focus()};
  $('sample').onclick=()=>setInput(SAMPLE);
  $('useOut').onclick=()=>{if(!out.value){toast('Proof is empty');return}setInput(out.value);toast('Proof moved to the stick')};
  $('copyOut').onclick=()=>copy(out.value||inp.value);
  function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1500)}
  async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(e){out.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Copy blocked')}}}
  // tabs
  const tabs=['case','find','diff'];
  function tab(k){tabs.forEach(t=>{$('tab-'+t).setAttribute('aria-selected',t===k);$('p-'+t).hidden=t!==k});if(k==='find')findPrev();if(k==='diff')diff()}
  tabs.forEach(t=>$('tab-'+t).onclick=()=>tab(t));
  document.querySelector('.tabs').addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const i=tabs.findIndex(t=>$('tab-'+t).getAttribute('aria-selected')==='true');const n=(i+(e.key==='ArrowRight'?1:-1)+3)%3;tab(tabs[n]);$('tab-'+tabs[n]).focus()});
  // find & replace
  const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const escH=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function buildRe(){
    let src=$('fFind').value;if(!src)return null;if(!$('fRegex').checked)src=escRe(src);if($('fWord').checked)src='\\b(?:'+src+')\\b';
    return new RegExp(src,'g'+($('fCase').checked?'':'i')+'u');
  }
  function findPrev(){
    const msg=$('fMsg');let re;try{re=buildRe()}catch(e){msg.textContent='Pattern error: '+e.message;msg.className='frmsg err';$('fPrev').textContent=inp.value;return}
    msg.className='frmsg';
    if(!re){msg.textContent='Type something to find.';$('fPrev').textContent=inp.value;return}
    let html='',last=0,count=0,m;const s=inp.value;re.lastIndex=0;
    while((m=re.exec(s))){if(m[0]===''){re.lastIndex++;continue}html+=escH(s.slice(last,m.index))+'<mark>'+escH(m[0])+'</mark>';last=m.index+m[0].length;count++;if(count>5000)break}
    html+=escH(s.slice(last));$('fPrev').innerHTML=html;
    msg.textContent=count?count+' match'+(count===1?'':'es')+'. Replace all prints the result to the proof.':'No matches.';
  }
  ['fFind','fRep'].forEach(k=>$(k).addEventListener('input',()=>{findPrev();persist()}));
  ['fRegex','fCase','fWord'].forEach(k=>$(k).addEventListener('change',()=>{findPrev();persist()}));
  $('fGo').onclick=()=>{let re;try{re=buildRe()}catch(e){return}if(!re)return;let n=0;const rep=$('fRep').value.replace(/\\n/g,'\n').replace(/\\t/g,'\t');
    out.value=inp.value.replace(re,(...a)=>{n++;const m=a[0];const groups=a.slice(1,-2);return $('fRegex').checked?rep.replace(/\$(\d+|&)/g,(x,g)=>g==='&'?m:(groups[+g-1]??'')):rep});toast(n+' replaced — see proof')};
  $('fFind').addEventListener('keydown',e=>{if(e.key==='Enter')$('fGo').click()});$('fRep').addEventListener('keydown',e=>{if(e.key==='Enter')$('fGo').click()});
  // diff (LCS)
  function lcs(a,b,eq){
    const n=a.length,m=b.length;if(n*m>4e6)return null;
    const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=eq(a[i],b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const ops=[];let i=0,j=0;
    while(i<n&&j<m){if(eq(a[i],b[j])){ops.push(['=',a[i],i,j]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){ops.push(['-',a[i],i,null]);i++}else{ops.push(['+',b[j],null,j]);j++}}
    while(i<n)ops.push(['-',a[i],i++,null]);while(j<m)ops.push(['+',b[j],null,j++]);return ops;
  }
  let dMode='lines';
  function diff(){
    const ws=$('dWs').checked;const norm=s=>ws?s.replace(/\s+/g,' ').trim():s;
    const A=inp.value,B=$('diffB').value;const out=$('diffOut');
    if(dMode==='lines'){
      const ops=lcs(L(A),L(B),(x,y)=>norm(x)===norm(y));if(!ops){out.innerHTML='<div class="words">Texts too long to compare line-by-line here.</div>';return}
      let add=0,del=0;out.innerHTML=ops.map(([t,s,i,j])=>{if(t==='+')add++;if(t==='-')del++;return `<div class="dl ${t==='+'?'add':t==='-'?'del':''}"><span class="n">${i!=null?i+1:''}</span><span class="n">${j!=null?j+1:''}</span><span class="s">${t==='='?'':t}</span><span>${escH(s)||' '}</span></div>`}).join('');
      $('dSum').innerHTML=`<b class="a">+${add}</b> added · <b class="d">−${del}</b> removed · ${ops.length-add-del} unchanged lines`;
    }else{
      const tok=s=>s.match(/\s+|[\p{L}\p{N}'’]+|[^\s\p{L}\p{N}]/gu)||[];
      let a=tok(A),b=tok(B);if(ws){a=a.filter(t=>!/^\s+$/.test(t));b=b.filter(t=>!/^\s+$/.test(t))}
      const ops=lcs(a,b,(x,y)=>x===y);if(!ops){out.innerHTML='<div class="words">Texts too long for a word diff.</div>';return}
      let add=0,del=0,h='';const sp=ws?' ':'';
      ops.forEach(([t,s])=>{if(t==='=')h+=escH(s)+sp;else if(t==='+'){add++;h+='<ins>'+escH(s)+'</ins>'+sp}else{del++;h+='<del>'+escH(s)+'</del>'+sp}});
      out.innerHTML='<div class="words">'+h+'</div>';$('dSum').innerHTML=`<b class="a">+${add}</b> tokens added · <b class="d">−${del}</b> removed`;
    }
  }
  $('diffB').addEventListener('input',()=>{clearTimeout(pT);pT=setTimeout(()=>{diff();persist()},200)});
  $('dWs').onchange=diff;
  $('dLines').onclick=()=>{dMode='lines';$('dLines').setAttribute('aria-pressed',true);$('dWords').setAttribute('aria-pressed',false);diff()};
  $('dWords').onclick=()=>{dMode='words';$('dWords').setAttribute('aria-pressed',true);$('dLines').setAttribute('aria-pressed',false);diff()};
  stats();
  out.value=title(inp.value);$('last').innerHTML='Opening proof pulled with <b>Title Case</b>. Tools chain — press “Use as input” to keep composing.';
})();
</script>
</body>
