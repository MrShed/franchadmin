<style id="dx-css">
:root{
  --room:#0b0e0d; --room2:#141816;
  --enamel:#56625a; --enamel-l:#66736a; --enamel-d:#3a443d; --engr:#ece5cf; --engr-d:#b9b29c;
  --bake:#15110e; --steel:#9aa0a0;
  --phos:#8dffc0; --phos2:#c9ffe0; --phos-d:#2f7a52; --led:#ff3b2a; --vfd:#6dffd2; --amber:#ffb54a; --lamp:#ffd89a;
  --paper:#ece5d3; --paper2:#e3dbc6; --log:#d6dbcf; --log2:#c9cfc1; --rule:#aab4b3; --card:#f3ecd9;
  --ink:#1d2024; --ink2:#50575c; --ink3:#7b8185; --graphite:#3b4046; --red:#bf3526; --red2:#d8553f; --blue:#2c4f8f;
  --display:"DX Stencil","Arial Narrow",Impact,sans-serif; --serif:"DX Serif",Georgia,serif; --type:"DX Type","Courier New",monospace;
  --mono:"DX Mono",ui-monospace,Menlo,Consolas,monospace; --hand:"DX Hand","Bradley Hand","Segoe Print",cursive;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --tabh:66px; --toph:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--room);color:var(--engr);overflow:hidden;overscroll-behavior:none}
body{font:16px/1.5 var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.screen{position:fixed;inset:0}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.03em;line-height:1}
p{margin:0 0 .7em}
.eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--mono)}
.engr{font:700 13px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--engr);text-shadow:0 -1px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.14)}
.engr.big{font-size:22px;letter-spacing:.24em}
.engr.sm{font-size:10.5px;letter-spacing:.2em;color:var(--engr-d)}
.engr.xs{font-size:10px;letter-spacing:.22em;color:var(--engr-d)}
.row{display:flex;flex-wrap:wrap;align-items:center}
.gap{gap:10px;margin-top:14px}
.note{font-size:14px;color:var(--ink2);font-style:italic}
.pencil{font-family:var(--hand);color:var(--graphite);font-style:normal;font-size:1.12em}
.lnk{color:var(--blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer;font-weight:600}
.lnk.r-callsign{font-family:var(--mono);font-size:.92em;color:#8a2a1c;text-decoration-style:dotted}
.lnk.r-place,.lnk.r-address{color:#2c4f8f}
.lnk.r-person{color:#1d2024;text-decoration-color:var(--red)}

/* ------------------------------------------------------------ buttons: keycaps */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:8px;
  font:700 12.5px/1.1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:#1e1c18;
  background:linear-gradient(#f0ebdd,#d2cbb6);box-shadow:0 2px 0 #857d69,0 4px 9px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .06s,box-shadow .06s,filter .15s}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 #857d69,0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:disabled{filter:grayscale(1) brightness(.8);opacity:.55}
.btn.pri{color:#fff4e8;background:linear-gradient(#e0553b,#a92b1b);box-shadow:0 2px 0 #651a10,0 4px 12px rgba(160,40,20,.45),inset 0 1px 0 rgba(255,210,190,.55)}
.btn.pri:active:not(:disabled){box-shadow:0 0 0 #651a10,0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,210,190,.4)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.85}
.btn.sm{min-height:36px;padding:0 12px;font-size:11.5px}
.btn.xs{min-height:30px;padding:0 10px;font-size:10.5px;border-radius:6px}
.btn.danger{background:linear-gradient(#5b1c14,#3a0f0a);color:#ffd5c8}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:10px;color:inherit;flex:none}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qbtn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;background:transparent;font:700 13px/1 var(--mono);opacity:.7;padding:0;vertical-align:middle}

/* ------------------------------------------------------------ the frame */
#game{display:grid;grid-template-rows:calc(var(--toph) + var(--safe-t)) 1fr calc(var(--tabh) + var(--safe-b));grid-template-columns:100%;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,196,120,.10),rgba(0,0,0,0) 60%),var(--tx-desk),linear-gradient(#171b19,#0c0f0e)}
#topbar{grid-row:1;position:relative;z-index:20;padding-top:var(--safe-t);
  background:var(--tx-brush),linear-gradient(#2b302e,#1a1e1c);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 -1px 0 rgba(0,0,0,.6) inset,0 6px 18px rgba(0,0,0,.55)}
.tb-plate{height:var(--toph);display:flex;align-items:center;gap:10px;padding:0 6px 0 10px}
.tb-clock{flex:none;display:flex;align-items:center;height:38px;padding:0 8px;border-radius:5px;background:linear-gradient(#0a0303,#150605);box-shadow:inset 0 2px 5px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.09)}
.led{display:flex;align-items:center;gap:2px;filter:drop-shadow(0 0 4px rgba(255,50,30,.65))}
.sg7{width:14px;height:21px}
.sg7 .on{fill:var(--led)} .sg7 .off{fill:rgba(255,50,30,.07)}
.sg7-colon{display:grid;gap:5px;padding:0 1px}.sg7-colon b{width:3px;height:3px;border-radius:50%;background:var(--led);animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.tb-night{display:grid;line-height:1.05;min-width:0}
.tb-night b{font:800 19px/1 var(--display);letter-spacing:.08em;color:var(--engr);text-transform:uppercase}
.tb-night b small{font-size:13px;color:var(--engr-d);margin-left:1px}
.tb-night span{font:500 10.5px/1.3 var(--mono);color:#98a39b;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-plate .tb-tabs{display:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:2px}
.tb-war,.tb-alert{display:grid;justify-items:center;gap:3px;padding:4px 6px;border-radius:6px;cursor:pointer}
.tb-war .k,.tb-alert .k{font:600 8.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#8d978f}
.toks{display:flex;gap:3px}
.toks i{width:9px;height:12px;border:1.3px solid rgba(236,229,207,.45);border-radius:1.5px}
.toks i.on{background:linear-gradient(#e2573c,#a82a19);border-color:#ff9c80;box-shadow:0 0 6px rgba(255,90,50,.45)}
.tb-alert{grid-template-columns:auto auto;align-items:center;column-gap:5px}
.tb-alert .k{grid-column:1/-1}
.tb-alert .v{font:600 10px/1 var(--mono);color:#c7cfc8;letter-spacing:.06em;text-transform:uppercase}
.lamp{width:12px;height:12px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--lc,#5f5) 30%,color-mix(in srgb,var(--lc,#5f5) 40%,#000) 100%);box-shadow:0 0 8px var(--lc,#5f5),inset 0 -1px 2px rgba(0,0,0,.5)}
.lamp.a0{--lc:#58e07a}.lamp.a1{--lc:#e8d34a}.lamp.a2{--lc:#ff9a2e}.lamp.a3{--lc:#ff5a2a}.lamp.a4{--lc:#ff2a1a;animation:alarm 1s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 0 16px #ff3a2a,inset 0 -1px 2px rgba(0,0,0,.5)}}
.tb-snd{width:40px}
@media (max-width:420px){.tb-alert .v{display:none}.tb-alert{padding:4px 4px}.tb-war{padding:4px 3px}.tb-snd{display:none}}

#views{grid-row:2;position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;display:none;overscroll-behavior:contain}
.view.on{display:block}
#tabbar{grid-row:3;position:relative;z-index:20;padding:0 6px var(--safe-b);background:linear-gradient(#1c1916,#0e0c0a);box-shadow:0 -1px 0 rgba(255,255,255,.07) inset,0 -8px 20px rgba(0,0,0,.5)}
.tabs{display:flex;gap:5px;height:var(--tabh);padding:7px 0 7px}
.tab{flex:1;position:relative;display:grid;justify-items:center;align-content:center;gap:3px;border:0;border-radius:7px;color:#b8b09a;min-width:0;
  background:linear-gradient(#3a3530,#26221e);box-shadow:0 3px 0 #0a0908,0 4px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .06s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab-l{font:700 9.5px/1 var(--display);letter-spacing:.16em;text-transform:uppercase}
.tab-lamp{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#3b2a16;box-shadow:inset 0 1px 1px rgba(0,0,0,.7)}
.tab.on{transform:translateY(2px);color:#ffe2b0;background:linear-gradient(#2b2723,#1d1a17);box-shadow:0 1px 0 #0a0908,inset 0 2px 5px rgba(0,0,0,.6)}
.tab.on .tab-lamp{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px var(--mono);font-style:normal;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}

/* desktop: tabs live in the top bar */
@media (min-width:900px){
  :root{--toph:62px}
  #game{grid-template-rows:var(--toph) 1fr 0}
  #tabbar{display:none}
  .tb-plate .tb-tabs{display:flex;height:auto;padding:0;margin:0 auto;gap:6px}
  .tb-tabs .tab{flex:none;width:112px;height:46px;grid-template-columns:auto auto;align-items:center;gap:8px}
  .tb-tabs .tab .badge{top:-5px;left:auto;right:-4px}
  .meter{width:150px;height:88px}
  .tb-tabs .tab-l{font-size:11px}
  .tb-right{margin-left:0}
  .tb-plate{padding:0 12px 0 14px;gap:14px}
}
/* phone landscape: tab rail on the left */
@media (max-height:520px) and (orientation:landscape){
  :root{--toph:44px}
  #game{grid-template-columns:78px 1fr;grid-template-rows:var(--toph) 1fr}
  #topbar{grid-column:1/-1}
  #tabbar{grid-row:2;grid-column:1;padding:6px 6px calc(6px + var(--safe-b)) calc(6px + env(safe-area-inset-left,0px));box-shadow:1px 0 0 rgba(255,255,255,.06) inset,8px 0 20px rgba(0,0,0,.5)}
  #tabbar .tabs{flex-direction:column;height:100%;padding:0}
  #views{grid-row:2;grid-column:2}
  .tb-plate{height:44px}
  .tb-clock{height:32px}.sg7{width:12px;height:18px}
  .tb-night{grid-auto-flow:column;align-items:baseline;gap:8px}
}

/* ------------------------------------------------------------ painted enamel panels */
.panel{position:relative;border-radius:12px;background-color:var(--enamel);background-image:var(--tx-hammer),linear-gradient(170deg,rgba(255,255,255,.10),rgba(0,0,0,.16));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.3),0 2px 0 #1e2320,0 18px 36px -10px rgba(0,0,0,.8)}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8e6df,#8c8d88 55%,#4a4b47);box-shadow:0 1px 1px rgba(0,0,0,.6),inset 0 -1px 1px rgba(0,0,0,.4)}
.screw::after{content:"";position:absolute;left:1.5px;right:1.5px;top:4.6px;height:1.6px;background:#3a3b38;border-radius:1px;transform:rotate(var(--r,35deg))}
.screw.a{top:7px;left:7px;--r:32deg}.screw.b{top:7px;right:7px;--r:-60deg}.screw.c{bottom:7px;left:7px;--r:78deg}.screw.d{bottom:7px;right:7px;--r:12deg}

/* ------------------------------------------------------------ receiver */
.rx-wrap{display:grid;gap:14px;padding:10px 10px 22px;max-width:1280px;margin:0 auto}
.rx-set{padding:14px 14px 14px;display:grid;gap:10px}
.rx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px}
.plate{display:grid;gap:5px}
.vfd{display:flex;align-items:baseline;gap:5px;padding:6px 10px 5px;border-radius:5px;background:linear-gradient(#061210,#0b1a17);box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.14)}
.vfd b{font:600 22px/1 var(--mono);color:var(--vfd);letter-spacing:.04em;text-shadow:0 0 8px rgba(80,255,200,.7)}
.vfd small{font:600 10px/1 var(--mono);color:#3ecfa4;letter-spacing:.1em}
.vfd .vm{font:700 10px/1 var(--mono);color:#0b1a17;background:var(--vfd);padding:3px 4px 2px;border-radius:2px;margin-left:4px;box-shadow:0 0 8px rgba(80,255,200,.6)}
.rx-glass{height:34px;border-radius:5px;overflow:hidden;cursor:ew-resize;touch-action:pan-y;box-shadow:0 0 0 3px #1b1714,0 0 0 4px rgba(255,255,255,.12),inset 0 2px 6px rgba(0,0,0,.5)}
.rx-glass canvas,.crt canvas,.meter canvas,.eye canvas{display:block}
.crt{position:relative;height:172px;border-radius:14px/18px;overflow:hidden;background:#020604;
  box-shadow:0 0 0 5px #121210,0 0 0 6px rgba(255,255,255,.1),0 0 0 9px #0b0b0a,inset 0 0 0 1px #000}
.crt-in,.crt-ov{position:absolute;inset:0}
.crt-glow{position:absolute;inset:0;width:100%;height:100%;filter:blur(7px) brightness(1.6);mix-blend-mode:screen;opacity:.55;pointer-events:none}
.crt-ov{touch-action:pan-y;cursor:crosshair}
.crt-glass{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(130% 90% at 30% 0%,rgba(255,255,255,.13),rgba(255,255,255,0) 45%),repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,rgba(0,0,0,0) 1px 3px);
  box-shadow:inset 0 0 38px rgba(0,0,0,.9),inset 0 0 8px rgba(0,0,0,.8)}
.crt-span{position:absolute;right:8px;bottom:18px;display:flex;gap:3px;z-index:2}
.crt-span button{border:0;border-radius:4px;padding:5px 7px;font:700 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#63c996;background:rgba(10,30,20,.72);box-shadow:inset 0 0 0 1px rgba(120,255,180,.22)}
.crt-span button.on{color:#062014;background:#8dffc0;box-shadow:0 0 10px rgba(120,255,180,.6)}
.tape{min-height:44px;border-radius:6px;background:linear-gradient(#030a06,#06120c);box-shadow:inset 0 2px 8px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.12);
  padding:8px 12px;display:flex;align-items:center;color:var(--phos);font:500 13.5px/1.35 var(--mono);text-shadow:0 0 6px rgba(100,255,170,.55);overflow:hidden}
.tape b{color:var(--phos2);font-weight:700;letter-spacing:.04em}
.tape em{font-style:normal;color:#ffcf8a;text-shadow:0 0 6px rgba(255,180,80,.5)}
.tape .dim{color:#5fae86}
.tp-st{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
@media (max-width:520px){.tape{font-size:12.5px}}
.tp-hold{display:grid;grid-template-columns:1fr auto;grid-template-areas:"k q" "bar bar" "hint hint";gap:4px 10px;width:100%}
.tp-k{grid-area:k;color:#7bd9a4;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tp-q{grid-area:q;font-weight:700;color:var(--phos2);font-size:16px}
.tp-bar{grid-area:bar;height:6px;border-radius:3px;background:rgba(120,255,180,.12);overflow:hidden}
.tp-bar i{display:block;height:100%;background:linear-gradient(90deg,#3fdc8a,#c9ffe0);box-shadow:0 0 8px #8dffc0;transition:width .2s}
.tp-hint{grid-area:hint;color:#ffcf8a;text-shadow:0 0 6px rgba(255,180,80,.5);font-size:13px}
.tp-copy{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:600;letter-spacing:.14em;white-space:nowrap}
.tp-copy .tp-n{font-size:11px;letter-spacing:.06em;color:#5fae86;font-weight:500}
.tg{opacity:.55}.tg.cur{opacity:1;color:#e8fff2;text-shadow:0 0 10px rgba(160,255,200,.9)}
.tg.ind{text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(141,255,192,.4)}
.tg .un{font-style:normal;opacity:.35}.tg .lost,.lost{font-style:normal;color:#ff8a6a;text-shadow:0 0 6px rgba(255,90,60,.6)}
.rx-ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 2px 0}
.rx-col{display:grid;justify-items:center;gap:6px;align-content:center}
.rx-main{position:relative;display:grid;justify-items:center;gap:6px}
.rx-main .k-lbl{order:2}
.meter{width:112px;height:66px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #16120f,0 0 0 4px rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.5)}
.eye-wrap{display:grid;justify-items:center;gap:4px}
.eye{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 3px #1a1a18,0 0 0 4px #9a9c97,0 0 0 5px #3a3b38,0 3px 8px rgba(0,0,0,.6)}
/* lever switch */
.lever{display:flex;align-items:center;gap:6px}
.lever button{border:0;background:transparent;font:700 12px/1 var(--display);letter-spacing:.14em;color:var(--engr-d);padding:8px 4px;min-height:40px}
.lever button.on{color:#ffe4b8;text-shadow:0 0 8px rgba(255,190,90,.8)}
.lv-slot{position:relative;width:34px;height:18px;border-radius:9px;background:linear-gradient(#0d0c0b,#262320);box-shadow:inset 0 2px 4px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.15);cursor:pointer}
.lv-bat{position:absolute;top:-9px;left:1px;width:14px;height:34px;border-radius:7px;background:linear-gradient(90deg,#8d918f,#f4f5f2 45%,#9ea3a0 70%,#5f6361);box-shadow:0 4px 5px rgba(0,0,0,.55);transform:rotate(-24deg);transform-origin:50% 80%;transition:left .14s,transform .14s}
.lever.cw .lv-bat{left:19px;transform:rotate(24deg)}
/* knobs */
.knob{position:relative;width:var(--sz);height:var(--sz);touch-action:none;cursor:grab;flex:none;border-radius:50%}
.knob.grab{cursor:grabbing}
.k-scale{position:absolute;inset:-6%;width:112%;height:112%;stroke:var(--engr);stroke-width:1.3;opacity:.75}
.k-skirt{position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 20deg,#d9dbd6,#8e928f,#eceeea,#7b7f7c,#d9dbd6,#8e928f,#eceeea,#7b7f7c,#d9dbd6);box-shadow:0 6px 14px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.35)}
.k-cap{position:absolute;inset:14%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#2a2521 0 4deg,#0f0c0a 4deg 8deg);box-shadow:0 3px 6px rgba(0,0,0,.7)}
.k-cap::before{content:"";position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#231e1a,#15110e 70%,#0c0907);box-shadow:inset 0 1px 1px rgba(255,255,255,.12),inset 0 -2px 3px rgba(0,0,0,.6)}
.k-mark{position:absolute;left:50%;top:9%;width:3px;height:22%;margin-left:-1.5px;border-radius:2px;background:#f2ecd9;box-shadow:0 0 2px rgba(0,0,0,.6)}
.k-dimple{position:absolute;left:50%;top:26%;width:22%;height:22%;margin-left:-11%;border-radius:50%;background:radial-gradient(circle at 50% 65%,#2c2622,#0a0807);box-shadow:inset 0 3px 5px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.12)}
.k-light{position:absolute;inset:14%;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.34),rgba(255,255,255,.06) 28%,rgba(255,255,255,0) 50%),radial-gradient(circle at 70% 85%,rgba(255,220,180,.07),rgba(0,0,0,0) 40%)}
.knob:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
/* push buttons */
.rx-btns{display:grid;grid-template-columns:1fr 64px 64px;gap:10px;padding:0 2px}
.pbtn{position:relative;border:0;border-radius:9px;min-height:58px;display:grid;justify-items:center;align-content:center;gap:3px;color:#262320;
  background:linear-gradient(#e7e3d8,#b9b3a2);box-shadow:0 3px 0 #5e5a4f,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .06s,filter .2s}
.pbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pbtn b{font:800 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase}
.pbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #5e5a4f,0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.pbtn:disabled{filter:brightness(.62) saturate(.4);cursor:default}
.pbtn.lit{background:linear-gradient(#ffe0a3,#e6a64a);box-shadow:0 3px 0 #7b5320,0 0 18px rgba(255,180,80,.55),inset 0 1px 0 rgba(255,255,255,.8)}
.pbtn.copy{grid-template-columns:auto 1fr;justify-items:start;align-items:center;column-gap:12px;padding:0 16px;color:#3a0c05;
  background:linear-gradient(#b8412c,#7c2012);box-shadow:0 3px 0 #3e0f07,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,190,170,.35)}
.pbtn.copy .pb-t{display:grid;gap:3px;color:#ffd9cc}
.pbtn.copy b{font-size:16px;letter-spacing:.22em}
.pbtn.copy small{font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.pb-lamp{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3a0,#6a1a0f 70%);box-shadow:inset 0 -1px 2px rgba(0,0,0,.5)}
.pbtn.copy.ready{background:linear-gradient(#ff6a45,#c92f16);box-shadow:0 3px 0 #5b1407,0 0 24px rgba(255,90,50,.55),inset 0 1px 0 rgba(255,220,200,.6)}
.pbtn.copy.ready .pb-lamp,.pbtn.copy.busy .pb-lamp{background:radial-gradient(circle at 35% 30%,#fff,#ffd27a 35%,#ff7a2a 80%);box-shadow:0 0 12px #ffb35a}
.pbtn.copy.busy{background:linear-gradient(#ff6a45,#c92f16);animation:rec 1.2s ease-in-out infinite}
@keyframes rec{50%{box-shadow:0 3px 0 #5b1407,0 0 34px rgba(255,90,50,.85),inset 0 1px 0 rgba(255,220,200,.6)}}
.pb-ring{position:absolute;right:10px;top:50%;width:34px;height:34px;margin-top:-17px;transform:rotate(-90deg);opacity:0}
.pb-ring circle{fill:none;stroke:#ffe3c8;stroke-width:3;stroke-dasharray:107;stroke-dashoffset:107;stroke-linecap:round}
.holding .pb-ring{opacity:1}
/* schedule */
.sched{display:grid;gap:10px}
.sb-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.sb-sub{font:500 11px/1 var(--mono);color:#9ea79f}
.sb-strip{position:relative;height:66px;border-radius:4px;background-color:var(--card);background-image:var(--tx-paper),linear-gradient(transparent 21px,rgba(0,0,0,.08) 21px 22px,transparent 22px);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 18px -6px rgba(0,0,0,.7);transform:rotate(-.3deg);margin:0 4px}
.sb-ticks i{position:absolute;top:0;bottom:0;border-left:1px solid rgba(40,40,40,.18)}
.sb-ticks b{position:absolute;top:4px;left:3px;font:700 10px/1 var(--type);color:var(--ink2)}
.sb-ticks i:last-child b{left:auto;right:3px}
.sb-past u{position:absolute;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--graphite);opacity:.55}
.sb-past u.f{background:transparent;border:1.3px solid var(--graphite)}
.sb-blk{position:absolute;top:21px;height:19px;min-width:10px;border:0;border-radius:2px;padding:0;color:#fff;background:rgba(191,53,38,.85);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sb-blk.m-cw{background:rgba(44,79,143,.85)}.sb-blk.m-burst{background:rgba(120,60,140,.85)}
.sb-blk.ln1{top:41px}
.sb-blk span{position:absolute;left:0;top:50%;transform:translate(-2px,-50%);font:700 10px/1 var(--mono);white-space:nowrap;padding:3px 5px;border-radius:3px;background:inherit;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sb-blk span i{font-style:normal;opacity:.75;margin-left:3px;font-size:9px}
.sb-blk::before{content:"";position:absolute;inset:-8px -6px}
.sb-now{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--led);box-shadow:0 0 6px rgba(255,60,40,.7)}
.sb-now::before{content:"";position:absolute;top:-2px;left:-4px;border:5px solid transparent;border-top-color:var(--led)}
.sb-btns{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px}
.sb-btns .btn{flex:1 1 auto;min-width:0;padding:0 12px}
.sb-btns .btn.next{flex-basis:100%;justify-content:space-between;background:linear-gradient(#ffe0a3,#e2a44c);box-shadow:0 2px 0 #7b5320,0 4px 12px rgba(255,170,70,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.sb-btns .btn.next span{display:inline-flex;align-items:center;gap:6px;opacity:.8}
.sb-btns .btn.next b{font-size:14px}
.sb-btns .btn.ghost{color:#c9c2ad}
/* the log sheet */
.logsheet{position:relative;padding:16px 14px 20px 34px;border-radius:2px;color:var(--ink);background-color:var(--log);
  background-image:linear-gradient(90deg,transparent 25px,rgba(191,53,38,.35) 25px 26px,transparent 26px),var(--tx-paper),repeating-linear-gradient(transparent 0 27px,rgba(80,110,120,.22) 27px 28px);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 16px 30px -10px rgba(0,0,0,.75),0 2px 4px rgba(0,0,0,.4);transform:rotate(.25deg)}
.logsheet::before{content:"";position:absolute;left:8px;top:40px;bottom:40px;width:10px;background:radial-gradient(circle,#101312 0 4px,transparent 5px) 0 0/10px 90px repeat-y;opacity:.85}
.ls-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:8px}
.ls-org{font:700 10.5px/1 var(--type);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.ls-head h3{font:700 22px/1.1 var(--type);letter-spacing:.02em;margin-top:3px}
.ls-form{font:700 10px/1 var(--type);color:var(--ink2);border:1px solid var(--ink2);padding:3px 5px}
.ls-empty{font-family:var(--hand);font-size:19px;color:var(--graphite);line-height:1.3;margin:10px 0}
.ls-night{font:700 11px/1 var(--type);letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:12px 0 4px}
.ls-rows{display:grid}
.ls-row{display:grid;grid-template-columns:44px 50px 36px 1fr auto;grid-template-areas:"t f m cs q" "g g g g g";column-gap:6px;row-gap:1px;align-items:baseline;text-align:left;
  width:100%;border:0;background:transparent;padding:6px 2px 7px;border-bottom:1px dashed rgba(60,80,90,.3);color:var(--ink);font:400 14px/1.35 var(--type);border-radius:3px}
.ls-row:active{background:rgba(0,0,0,.05)}
.ls-t{grid-area:t;font-weight:700}.ls-f{grid-area:f}.ls-m{grid-area:m;color:var(--ink2);font-size:12px}
.ls-cs{grid-area:cs;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ls-cs small{font-weight:400;color:var(--ink2);margin-left:2px}.ls-cs em{color:var(--ink3)}
.ls-q{grid-area:q;display:flex;gap:4px;align-items:center}
.ls-g{grid-area:g;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:14.5px;letter-spacing:.06em;padding-left:2px}
.ls-g .g.ind{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.ls-g .more{color:var(--ink3);font-size:12px}
.ls-row .lost,.groups-grid .lost{color:var(--red);font-style:normal;font-family:var(--hand);font-size:1.15em;line-height:.8}
.ls-row.faint{color:var(--graphite)}
.ls-row.faint .ls-t,.ls-row.faint .ls-cs{font-weight:400}
.ls-row.live{background:rgba(255,230,160,.35)}
.ls-row .onair{color:var(--red)}
.qs{font:700 10.5px/1 var(--type);padding:2px 4px;border:1.4px solid currentColor;border-radius:2px;transform:rotate(-3deg)}
.qs.q5,.qs.q4{color:#2d6a3a}.qs.q3{color:#8a6a10}.qs.q2,.qs.q1{color:var(--red)}
.dfm{font:700 9.5px/1 var(--mono);color:#fff;background:var(--red);padding:2px 3px;border-radius:2px}
/* receiver layouts */
@media (min-width:900px){
  .rx-wrap{grid-template-columns:minmax(560px,640px) minmax(340px,1fr);align-items:start;padding:18px 20px 30px}
  .crt{height:250px}
  .rx-side{display:grid;gap:16px}
  .ls-row{grid-template-columns:48px 56px 40px 110px auto 1fr;grid-template-areas:"t f m cs q g"}
}
@media (max-height:520px) and (orientation:landscape){
  .rx-wrap{grid-template-columns:minmax(0,1fr) 300px;align-items:start;padding:8px 8px 16px;gap:10px}
  .rx-set{grid-template-columns:minmax(0,1fr) 176px;grid-template-areas:"head head" "glass ctl" "crt ctl" "tape ctl" "btns ctl";gap:8px;padding:10px 10px 12px}
  .rx-head{grid-area:head}.rx-glass{grid-area:glass;height:28px}.crt{grid-area:crt;height:132px}.tape{grid-area:tape;min-height:38px;padding:6px 10px;font-size:12.5px}
  .rx-ctl{grid-area:ctl;grid-template-columns:1fr 1fr;grid-template-areas:"main main" "l r";align-self:start;gap:6px 4px;padding:0}
  .rx-ctl .rx-main{grid-area:main}.rx-ctl .rx-col.l{grid-area:l}.rx-ctl .rx-col.r{grid-area:r}
  .rx-btns{grid-area:btns;grid-template-columns:1fr 50px 50px;gap:6px}
  .rx-head .engr.sm{display:none}.vfd b{font-size:17px}.vfd{padding:4px 8px}
  .rx-set{row-gap:6px}.rx-head{padding:0 2px}.crt{height:116px}
  .tp-hold{grid-template-columns:auto 1fr auto;grid-template-areas:"k bar q" "hint hint hint";align-items:center;gap:2px 8px}
  .tp-k{font-size:10.5px}.tp-q{font-size:14px}.tp-hint{font-size:12px}.tp-copy{font-size:17px}
  .pbtn.copy small{display:none}
  .sb-head .sb-sub{display:none}
  .lever button{min-height:32px;padding:4px 2px}.lv-slot{width:28px}.lever.cw .lv-bat{left:13px}
  .pbtn{min-height:44px}.pbtn.copy{padding:0 10px}.pbtn.copy b{font-size:13px}
  .meter{width:92px;height:54px}
  .engr.big{font-size:17px}
  .rx-side{display:grid;gap:10px}
}

/* ------------------------------------------------------------ sheet: paper on a clipboard */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(3,5,4,.55);opacity:0;transition:opacity .25s;backdrop-filter:blur(1.5px)}
#scrim.on{opacity:1}
#sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#sheet.on{transform:none;pointer-events:auto}
#sheet.drag{transition:none}
.sh-clip{height:26px;display:grid;place-items:center;flex:none;position:relative;z-index:2;margin-bottom:-12px}
.sh-clip i{display:block;width:120px;height:26px;border-radius:6px 6px 3px 3px;background:var(--tx-brush),linear-gradient(#e2e4e0,#9ea29f 60%,#7c807d);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 #fff}
.sh-paper{display:flex;flex-direction:column;min-height:0;border-radius:4px 4px 0 0;color:var(--ink);background-color:var(--paper);background-image:var(--tx-paper);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sh-head{display:flex;align-items:flex-start;gap:6px;padding:20px 8px 10px 18px;border-bottom:1px solid rgba(0,0,0,.12);flex:none}
.sh-head .t{flex:1;min-width:0;padding-top:4px}
.sh-head h3{font:800 25px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-top:5px}
.sh-head .sub{font-size:14px;color:var(--ink2);margin-top:4px}
.sh-head .ib{color:var(--ink2)}
.sh-body{overflow:auto;padding:14px 18px calc(24px + var(--safe-b));font-size:16px;line-height:1.5;overscroll-behavior:contain}
.sh-body h4{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px}
@media (min-width:900px){
  #sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:84vh;transform:translate(-50%,-46%) rotate(-.4deg);opacity:0;transition:transform .25s,opacity .2s}
  #sheet.wide{width:820px}
  #sheet.on{transform:translate(-50%,-50%) rotate(-.4deg);opacity:1}
  .sh-paper{border-radius:4px;box-shadow:0 30px 70px rgba(0,0,0,.7)}
}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 12px;font-size:15px}
.kv dt{font:600 11px/1.9 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.kv dd{margin:0;font-family:var(--type)}
.groups-grid{display:flex;flex-wrap:wrap;gap:4px 14px;padding:12px 14px;background:var(--log);background-image:repeating-linear-gradient(transparent 0 25px,rgba(80,110,120,.22) 25px 26px);font:400 16px/26px var(--type);letter-spacing:.06em;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.groups-grid .g.ind{color:var(--red);font-weight:700}
.brg{padding-left:18px;font-family:var(--type);font-size:14.5px}
.pencil-note{font-family:var(--hand);font-size:20px;color:var(--graphite);line-height:1.25}
.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:12px 4px;border-bottom:1px solid rgba(0,0,0,.1);color:var(--ink);min-height:56px}
.li svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--ink2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.li span{display:grid;gap:2px}.li b{font:700 15px/1.2 var(--type)}.li small{font-size:13.5px;color:var(--ink2);line-height:1.35}
.chk{display:grid;gap:6px;margin:10px 0}
.chk label{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:6px;background:rgba(0,0,0,.05);font-family:var(--type)}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.alert-scale{display:grid;gap:8px;margin-bottom:12px}
.as-row{display:grid;grid-template-columns:auto 80px 1fr;gap:10px;align-items:center;padding:8px;border-radius:6px;font-size:14.5px}
.as-row b{font:700 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.as-row.on{background:rgba(191,53,38,.1);box-shadow:inset 0 0 0 1.5px rgba(191,53,38,.4)}
.help p{font-size:15.5px}
.pat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font:700 13px/1 var(--mono)}.pat i{height:10px;border-radius:5px;background:rgba(0,0,0,.1);overflow:hidden}.pat b{display:block;height:100%}

/* ------------------------------------------------------------ toast: a strip of teleprinter paper */
#toast{position:fixed;z-index:80;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 12px);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;
  width:min(94vw,520px);display:flex;gap:10px;align-items:flex-start;padding:11px 14px 12px;color:#1f1c16;font:400 14px/1.4 var(--type);
  background-color:#efe6c4;background-image:var(--tx-paper);box-shadow:0 10px 26px rgba(0,0,0,.6);border-radius:2px;
}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;margin-top:1px}
#toast span{padding-left:6px}
#toast.err{background-color:#f3d4c8}
#toast.good{background-color:#dfeccd}
@media (min-width:900px){#toast{bottom:22px}}
@media (max-height:520px) and (orientation:landscape){#toast{bottom:12px}}

/* ------------------------------------------------------------ explanations and the end-of-shift memo */
#explain{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
#explain.on{opacity:1}
.paper{color:var(--ink);background-color:var(--paper);background-image:var(--tx-paper)}
.ex-card{position:relative;width:min(420px,100%);padding:26px 22px 20px;border-radius:2px;transform:rotate(-1deg) translateY(10px);transition:transform .3s;box-shadow:0 20px 50px rgba(0,0,0,.7)}
#explain.on .ex-card{transform:rotate(-1deg)}
.ex-pin{position:absolute;top:-8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a70,#b3261a 60%,#5e0f08);box-shadow:0 3px 4px rgba(0,0,0,.5)}
.ex-from{font:600 21px/1 var(--hand);color:var(--red);margin-bottom:6px}
.ex-card h4{font:800 26px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.ex-card p{font-size:16px;line-height:1.55}
.ex-sig{font:600 22px/1 var(--hand);color:var(--graphite);text-align:right;margin:4px 6px 14px}
#night{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:20px;background:radial-gradient(90% 70% at 50% 40%,rgba(40,30,20,.6),rgba(0,0,0,.94));opacity:0;transition:opacity .45s}
#night.on{opacity:1}
.nc-memo{position:relative;width:min(460px,100%);padding:26px 24px 22px;border-radius:2px;transform:rotate(.6deg);box-shadow:0 30px 60px rgba(0,0,0,.8)}
.nc-h h2{font:800 34px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:6px 0 10px}
.nc-stamp{position:absolute;bottom:26px;right:20px;font:700 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red);border:2.5px solid var(--red);padding:6px 8px;transform:rotate(8deg);opacity:.85}
.nc-memo ul{margin:6px 0 14px;padding-left:20px;font:400 15px/1.5 var(--type)}
.nc-memo li.ev{font-family:var(--hand);font-size:18px;color:var(--graphite);list-style:"– "}
.nc-next{font-size:15px;border-top:1px solid rgba(0,0,0,.2);padding-top:10px}
/* coach */
#coach{position:fixed;inset:0;z-index:85;pointer-events:none}
.co-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 3px rgba(255,200,110,.95),0 0 0 9999px rgba(0,0,0,.42),0 0 24px rgba(255,190,90,.6);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#coach:not(.has-el) .co-spot{box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.co-card{position:fixed;pointer-events:auto;padding:16px 16px 12px;border-radius:2px;color:var(--ink);background-color:var(--card);background-image:var(--tx-paper);box-shadow:0 16px 40px rgba(0,0,0,.7);transition:top .3s,left .3s}
.co-k{font:600 17px/1 var(--hand);color:var(--red);margin-bottom:4px}
.co-card b{display:block;font:800 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.co-card p{font-size:15px;line-height:1.45;margin-bottom:10px}
.co-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.co-wait{display:inline-flex;align-items:center;gap:4px;font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.co-wait svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.co-card .btn.ghost{color:var(--ink2)}

/* ------------------------------------------------------------ title */
#title{background:#060908;overflow:hidden}
.t-bg{position:absolute;inset:0;overflow:hidden}
.t-bg canvas{position:absolute;left:50%;top:50%;width:max(140vw,140vh);height:max(105vw,105vh);transform:translate(-50%,-50%);filter:blur(1.4px) saturate(1.2);opacity:.62;image-rendering:auto}
.t-shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 50% 35%,rgba(0,0,0,0),rgba(0,0,0,.72) 80%),linear-gradient(rgba(6,9,8,.2),rgba(6,9,8,.35) 40%,rgba(6,9,8,.92) 75%),repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,rgba(0,0,0,0) 1px 3px)}
.t-wrap{position:relative;height:100%;overflow:auto;max-width:520px;margin:0 auto;padding:calc(12px + var(--safe-t)) 18px calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:16px}
.t-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.t-eyebrow{font:600 10.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#6fc79b;text-shadow:0 0 8px rgba(100,255,170,.35)}
.t-top .ib{color:#9fd8b8}
.t-brand{position:relative;margin-top:auto;padding-top:24px}
.t-title{font:800 clamp(104px,33vw,188px)/.8 var(--display);letter-spacing:.01em;text-transform:uppercase;color:#ece5cf;
  background:linear-gradient(#f5efdc,#d9d0b6 70%,#bfb597);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 0 30px rgba(120,255,180,.12))}
.t-stamp{position:absolute;right:4px;top:6px;font:700 12px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#e04a34;border:2.5px solid #e04a34;padding:6px 8px 5px;transform:rotate(-7deg);opacity:.9;mix-blend-mode:screen}
.t-dek{font:italic 400 18.5px/1.45 var(--serif);color:#d6dcd4;max-width:30ch;margin:14px 0 0}
.t-groups{display:flex;gap:14px;margin-top:14px;font:600 17px/1 var(--mono);letter-spacing:.12em;color:#4fb884;text-shadow:0 0 8px rgba(100,255,170,.45);overflow:hidden;white-space:nowrap}
.t-groups .cur{color:#d9ffe9;text-shadow:0 0 12px rgba(160,255,200,.9)}
.t-folder{position:relative;margin-top:6px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7))}
.t-tab{display:inline-block;padding:8px 18px 6px;border-radius:8px 8px 0 0;background-color:#d6b878;background-image:var(--tx-paper);font:700 11px/1 var(--type);letter-spacing:.18em;text-transform:uppercase;color:#4a3a1c}
.t-card{padding:16px 16px 16px;border-radius:0 6px 6px 6px;background-color:#dcc083;background-image:var(--tx-paper),linear-gradient(#e2c88e,#cfb071);color:#2c2415;display:grid;gap:12px}
.t-cont{display:grid!important;justify-items:start;gap:4px;min-height:60px!important;text-align:left;padding:10px 16px!important}
.t-cont span{font-size:15px}.t-cont small{font:500 11px/1.2 var(--mono);letter-spacing:.04em;text-transform:none;opacity:.85}
.t-lbl{font:700 10.5px/1 var(--type);letter-spacing:.18em;text-transform:uppercase;color:#6a5630}
.t-grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t-grade{position:relative;display:grid;justify-items:start;gap:6px;min-height:62px;padding:10px 10px 9px;border:0;border-radius:3px;text-align:left;color:#2a2418;
  background-color:#f3ecd9;background-image:var(--tx-paper),repeating-linear-gradient(transparent 0 15px,rgba(80,110,160,.18) 15px 16px);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 6px rgba(60,40,10,.35);transform:rotate(var(--r,0deg));transition:transform .15s}
.t-grade:nth-child(1){--r:-1deg}.t-grade:nth-child(2){--r:.6deg}.t-grade:nth-child(3){--r:-.4deg}
.t-grade b{font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.t-grade .lv{display:flex;gap:3px}.t-grade .lv u{width:14px;height:4px;border-radius:1px;background:rgba(0,0,0,.14)}.t-grade .lv u.f{background:#b3321f}
.t-grade.on{transform:translateY(-4px) rotate(var(--r,0deg));box-shadow:0 0 0 2px #b3321f,0 8px 14px rgba(60,40,10,.4)}
.t-grade.on::after{content:"Selected";position:absolute;right:6px;bottom:8px;font:700 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#b3321f;border:1.5px solid #b3321f;padding:2px 3px;transform:rotate(-8deg)}
.t-blurb{font:400 14.5px/1.45 var(--type);margin:0;min-height:3em}
.t-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t-row .btn{min-height:52px;padding:0 10px;font-size:12px}
.t-seed{display:flex;align-items:center;gap:10px;font:700 11px/1 var(--type);letter-spacing:.14em;text-transform:uppercase;color:#6a5630}
.t-seed input{width:110px;height:36px;border:0;border-bottom:1.5px solid #6a5630;background:transparent;font:700 18px/1 var(--type);letter-spacing:.12em;color:#2a2418;padding:0 4px}
.t-seed input:focus{outline:none;border-bottom-color:#b3321f}
.t-msg{font:400 12px/1.3 var(--type);letter-spacing:0;text-transform:none;color:#8a2a1c}
.t-foot{font:italic 400 13px/1.4 var(--serif);color:#7f8c85;margin:0;text-align:center}
@media (min-width:900px){
  .t-wrap{max-width:1120px;display:grid;grid-template-columns:1.2fr 420px;grid-template-rows:auto 1fr auto;column-gap:56px;padding:28px 40px 26px}
  .t-top{grid-column:1/-1}.t-brand{grid-column:1;align-self:center;margin:0}.t-folder{grid-column:2;align-self:center}.t-foot{grid-column:1/-1}
  .t-title{font-size:200px}
}
@media (max-height:520px) and (orientation:landscape){
  .t-wrap{max-width:none;display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr auto;column-gap:26px;row-gap:8px;padding:10px 20px 10px}
  .t-top{grid-column:1/-1}.t-brand{grid-column:1;align-self:center;margin:0;padding-top:0}.t-folder{grid-column:2;grid-row:2/4;align-self:start}.t-foot{grid-column:1;text-align:left}
  .t-title{font-size:120px}.t-dek{font-size:15.5px}.t-groups{font-size:14px}
  .t-card{padding:12px;gap:9px}.t-grade{min-height:50px;padding:7px 8px}.t-grade b{font-size:16px}.t-blurb{font-size:13px;min-height:0}.t-row .btn{min-height:44px}
}
/* ------------------------------------------------------------ shared small parts */

.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#bfb8a4;font:700 11.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.seg button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
.seg button.on{background:linear-gradient(#f0ebdd,#d2cbb6);color:#1e1c18;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.paper .seg{background:rgba(0,0,0,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.paper .seg button{color:var(--ink2)}
.sel{width:100%;min-height:46px;margin:6px 0 12px;padding:0 10px;border:1.5px solid rgba(0,0,0,.3);border-radius:6px;background:#f8f3e6;font:400 15px var(--type);color:var(--ink)}
.seg.nights{display:flex;flex-wrap:wrap;margin:6px 0 4px}
.stamp-line{display:inline-block;font:700 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red);border:2px solid var(--red);padding:5px 8px;transform:rotate(-2deg)}
.vstamp{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:3px 5px;border:1.5px solid currentColor;border-radius:2px;transform:rotate(-4deg);color:var(--ink2)}
.vstamp.ok{color:#2d6a3a}.vstamp.part{color:#8a6a10}.vstamp.bad{color:var(--red)}.vstamp.dim{opacity:.5}
.plist{display:grid}
.evid{padding-left:18px;font-size:15px}
.wbtns{display:grid;gap:8px}
.wbtn,.wr-k{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;border-radius:6px;padding:12px;background:rgba(0,0,0,.05);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);color:var(--ink);min-height:60px}
.wbtn svg,.wr-k svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--blue);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.wbtn span,.wr-k span{display:grid;gap:3px}.wbtn b,.wr-k b{font:700 15px/1.1 var(--type)}.wbtn small,.wr-k small{font-size:13.5px;line-height:1.35;color:var(--ink2)}
.wbtn:disabled,.wr-k:disabled{opacity:.45}
.warnline{display:flex;gap:8px;align-items:center;color:var(--red);font:600 13px/1.3 var(--mono)}
.warnline svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.hint-card{position:relative;display:grid;gap:10px;padding:14px 14px 12px;border-radius:2px;color:var(--ink);background-color:#f4e7a6;background-image:var(--tx-paper);box-shadow:0 8px 18px rgba(0,0,0,.45);transform:rotate(-.6deg)}
.hint-card p{margin:0;font-size:15px}
.hint-card .btn{justify-self:start}
.hc-pin{position:absolute;top:-7px;left:22px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fb4ff,#2c4f8f 60%,#122444);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.pencil-note{font-family:var(--hand);font-size:21px;color:var(--graphite);line-height:1.25}

/* ------------------------------------------------------------ map */
.map-wrap{position:absolute;inset:0}
.map-cv{position:absolute;inset:0;touch-action:none;cursor:grab}
.map-top{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.map-top>*{pointer-events:auto}
.map-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.map-chips .qbtn{color:#e8e2cf;background:rgba(20,22,20,.7);width:30px;height:30px}
.map-zoom{display:grid;gap:4px;padding:4px;border-radius:10px;background:rgba(20,22,20,.78);box-shadow:inset 0 0 0 1px rgba(236,229,207,.2)}
.map-zoom .ib{width:40px;height:40px;color:#e8e2cf}
.map-air{position:absolute;left:10px;right:10px;bottom:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(12,16,14,.9);box-shadow:inset 0 0 0 1px rgba(141,255,192,.3),0 8px 20px rgba(0,0,0,.6);color:var(--phos)}
.air-lamp{width:12px;height:12px;border-radius:50%;background:#ff5a3a;box-shadow:0 0 10px #ff5a3a;animation:blink 1.2s steps(1) infinite;flex:none}
.air-t{flex:1;min-width:0;display:grid;font:500 12.5px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.air-t b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#ffb89a}
.map-air .btn{min-height:40px;padding:0 10px}
.map-legend{position:absolute;left:10px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;padding:7px 10px;border-radius:8px;background:rgba(20,22,20,.7);font:500 11px/1 var(--mono);color:#cfc8b3;pointer-events:none}

.map-legend span{display:inline-flex;align-items:center;gap:5px}
.map-legend i{display:inline-block;width:16px;height:10px}
.lg-cone{background:linear-gradient(100deg,transparent 40%,rgba(220,70,50,.7) 45% 55%,transparent 60%),rgba(220,70,50,.18)}
.lg-fix{border:1.5px dashed #e05a44;border-radius:50%}
.lg-bld{background:#e8e2cf;clip-path:polygon(0 100%,0 40%,50% 0,100% 40%,100% 100%)}
.lg-spot{border:1.5px solid #e8e2cf;border-radius:50%;width:10px!important}

/* ------------------------------------------------------------ van */
#van{z-index:70;background:#060707}
.van-cv{position:absolute;inset:0;touch-action:none}
.van-hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-t)) 12px 10px;background:linear-gradient(rgba(8,10,10,.95),rgba(8,10,10,.7) 70%,rgba(8,10,10,0))}
.van-meter{width:120px;height:72px;border-radius:6px;overflow:hidden;flex:none;box-shadow:0 0 0 3px #16120f,0 0 0 4px rgba(255,255,255,.14)}
.van-mid{flex:1;display:grid;gap:5px;min-width:0}
.van-clock{display:flex}.van-clock .led{padding:4px 7px;border-radius:4px;background:#0a0303;box-shadow:inset 0 2px 5px rgba(0,0,0,.9)}
.van-hint{font:500 12px/1.3 var(--mono);color:#ffd9a8}
.van-quit{color:#cfc8b3}
.van-foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 12px calc(14px + var(--safe-b));background:linear-gradient(rgba(8,10,10,0),rgba(8,10,10,.92))}
.van-foot .btn{min-width:240px;min-height:52px}
.van-res{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.6)}
.van-card{width:min(420px,100%);padding:22px;border-radius:2px;box-shadow:0 20px 50px rgba(0,0,0,.8);transform:rotate(-.8deg)}
.van-card h3{font:800 30px/1 var(--display);text-transform:uppercase;margin:6px 0 10px}

/* ------------------------------------------------------------ bench */
.bench{display:grid;gap:12px;padding:10px 10px 28px;max-width:1280px;margin:0 auto}
.bn-tray{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.bn-empty{font:italic 15px/1.4 var(--serif);color:#b7b19c;padding:14px 6px}
.mcard{flex:none;width:142px;min-height:104px;scroll-snap-align:start;display:grid;align-content:start;gap:4px;padding:9px 10px 10px;border:0;border-radius:2px;text-align:left;color:var(--ink);
  background-color:var(--card);background-image:linear-gradient(transparent 26px,rgba(191,53,38,.55) 26px 27px,transparent 27px),var(--tx-paper),repeating-linear-gradient(transparent 0 17px,rgba(80,110,160,.2) 17px 18px);
  box-shadow:0 5px 10px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.5) inset;transform:rotate(var(--r,0deg));transition:transform .15s}
.mcard.on{transform:translateY(-6px) rotate(var(--r,0deg));box-shadow:0 0 0 2.5px var(--amber),0 12px 20px rgba(0,0,0,.55)}
.mcard.new::after{content:"new";position:absolute;right:-4px;top:-6px;font:700 9px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:#fff;background:var(--red);padding:3px 5px;border-radius:2px;transform:rotate(6deg)}
.mcard{position:relative}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mc-top b{font:800 20px/1 var(--display);letter-spacing:.04em}
.mc-k{font:700 9px/1 var(--mono);letter-spacing:.1em;padding:3px 4px;border-radius:2px;background:rgba(0,0,0,.08)}
.mc-k.k-periodic{background:rgba(44,79,143,.18);color:var(--blue)}.mc-k.k-clear{background:rgba(45,106,58,.18);color:#2d6a3a}
.mc-rt{font:700 12px/1.2 var(--type);margin-top:4px}
.mc-ind{font:400 11.5px/1.2 var(--type);color:var(--ink2)}
.mc-ind u{text-decoration:none;font-weight:700;color:var(--ink)}.mc-ind u.twin{color:var(--red);text-decoration:underline wavy rgba(191,53,38,.6)}
.mc-twin{font:600 15px/1 var(--hand);color:var(--red)}
.mc-holes{font:600 14px/1 var(--hand);color:var(--graphite)}
.mcard .vstamp{justify-self:start;margin-top:2px}
.bn-main{display:grid;gap:12px;min-width:0}
.bn-tabs{display:flex;gap:4px;overflow-x:auto;padding:3px;border-radius:10px;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bn-tabs button{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#bfb8a4;font:700 11.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.bn-tabs svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}
.bn-tabs button.on{background:linear-gradient(#f0ebdd,#d2cbb6);color:#1e1c18}
.bn-blank{padding:26px 16px;border-radius:3px;background:rgba(236,229,207,.06);box-shadow:inset 0 0 0 1.5px rgba(236,229,207,.12)}
.bn-blank .pencil-note{color:#e0d8c2}.bn-blank .note{color:#b7b19c}
.msg-card{padding:16px 16px 18px;border-radius:2px;box-shadow:0 14px 28px -8px rgba(0,0,0,.7)}
.msg-card header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.msg-card h3{font:800 30px/1 var(--display);letter-spacing:.03em;margin-top:4px}
.msg-card h3 small{font:700 14px/1 var(--type);letter-spacing:0;color:var(--ink2);margin-left:6px}
.msg-card .note{margin-top:10px}
.clear-text{font:400 17px/1.5 var(--type);background:rgba(0,0,0,.04);padding:12px}
.dec{margin-top:12px;padding:10px 12px;border-left:3px solid var(--red);background:rgba(191,53,38,.06)}
.dec-t{font:600 20px/1.3 var(--hand);color:var(--graphite);margin:4px 0 0}
.msg-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.heard{font-size:13.5px;color:var(--ink2);margin-top:12px}
/* depth */
.depth,.keyws{display:grid;gap:12px;padding:14px 12px 18px;border-radius:3px;color:var(--ink);background-color:#e9e4d4;background-image:var(--tx-paper);box-shadow:0 14px 28px -8px rgba(0,0,0,.7)}
.dp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dp-head h3{font:800 26px/1 var(--display);letter-spacing:.03em;margin-top:4px}
.dp-head h3 span{font:400 13px/1 var(--type);letter-spacing:0;color:var(--ink2);margin:0 4px}
.dp-hb{display:flex;align-items:center;gap:8px}
.dp-scroll{overflow-x:auto;overflow-y:hidden;margin:0 -12px;padding:4px 12px 10px;-webkit-overflow-scrolling:touch}
.dp-strip{position:relative;height:238px}
.dp-cols i{position:absolute;top:26px;bottom:26px;width:0;border-left:1px dotted rgba(0,0,0,.08)}
.dp-cols i.g5{border-left:1px solid rgba(0,0,0,.18)}
.dp-lab{position:sticky;left:0;display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.1em;color:var(--ink2);z-index:3}
.dp-lab.la{position:absolute;top:2px;left:0}.dp-lab.lb{position:absolute;bottom:0;left:0}
.dp-row{position:absolute;left:0;right:0;height:26px}
.dp-row span,.dp-row b,.dp-row em{position:absolute;top:0;width:26px;height:26px;display:grid;place-items:center}
.dp-row.plain.pa{top:16px}.dp-row.ciph.ca{top:48px}.dp-row.diff{top:82px;height:32px}.dp-row.ciph.cb{top:122px}.dp-row.plain.pb{top:154px}
.dp-row.ciph span{font:400 13px/1 var(--type);color:var(--ink3)}
.dp-row.ciph span.q,.dp-row.diff span.q{color:var(--red)}
.dp-row.diff{background:linear-gradient(#f6ecc3,#efe1a6);box-shadow:0 1px 0 rgba(0,0,0,.15),0 -1px 0 rgba(0,0,0,.08);border-radius:1px}
.dp-row.diff span{height:32px;font:700 17px/1 var(--type);color:var(--ink);cursor:pointer}
.dp-row.diff span.z{color:#1f6a36;background:rgba(80,160,100,.16)}
.zeroline{margin:0;font:400 13.5px/1.4 var(--serif);color:var(--ink2)}.zeroline b{font:700 12px/1 var(--type);color:#1f6a36;background:rgba(80,160,100,.16);padding:2px 4px;margin-right:4px;letter-spacing:.1em}
.dp-row.plain b{font:700 16px/1 var(--type);color:var(--ink)}
.dp-row.plain b,.dp-row.plain em{border-bottom:1px solid rgba(0,0,0,.25)}
.dp-row.plain em{font:600 21px/1 var(--hand);color:var(--red);font-style:normal;border-bottom-color:rgba(191,53,38,.4)}
.dp-row.plain em.good{color:#1f6a36;border-bottom-color:rgba(31,106,54,.5)}
.dp-marks{position:absolute;left:0;right:0;top:-9px;height:9px;pointer-events:none}
.dp-marks i{position:absolute;width:0;height:0;margin-left:7px;border:6px solid transparent;border-top:7px solid var(--red);border-bottom:0}
.dp-slide{position:absolute;height:34px;top:12px;border-radius:4px;background:rgba(160,200,230,.32);box-shadow:inset 0 0 0 1.5px rgba(44,79,143,.55),0 3px 8px rgba(0,0,0,.18),inset 0 8px 10px rgba(255,255,255,.35);cursor:grab;touch-action:none;z-index:4;transition:left .06s}
.dp-slide.sb{top:150px}
.dp-slide.good{background:rgba(140,220,160,.32);box-shadow:inset 0 0 0 1.5px rgba(31,106,54,.6),0 3px 8px rgba(0,0,0,.18),inset 0 8px 10px rgba(255,255,255,.35)}
.dp-slide.drag{cursor:grabbing;box-shadow:inset 0 0 0 2px rgba(44,79,143,.8),0 8px 16px rgba(0,0,0,.25);transition:none}
.dp-slide b{position:absolute;top:0;height:34px;display:grid;place-items:center;font:700 17px/1 var(--type);color:var(--blue)}
.dp-slide .grip{position:absolute;right:-10px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.dp-slide .grip::before{content:"⇔";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 12px/1 var(--mono)}
.dp-ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.dp-step{display:flex;align-items:center;gap:4px;font:700 13px/1 var(--mono);color:var(--ink2)}
.ib.big{width:48px;height:48px;border-radius:10px;background:linear-gradient(#f0ebdd,#d2cbb6);box-shadow:0 2px 0 #857d69,0 3px 6px rgba(0,0,0,.3);color:var(--ink)}
.dp-cribin{display:grid;gap:6px}
.dp-cribin input{min-height:48px;padding:0 12px;border:0;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.35);font:700 22px/1 var(--type);letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.dp-cribin input:focus{outline:none;background:rgba(255,255,255,.6)}
.paper .chip,.depth .chip,.keyws .chip{color:var(--ink);background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.depth .chip.sug{background:#f4e7a6}
.dp-read{display:grid;gap:8px;padding:12px;border-radius:3px;background:rgba(255,255,255,.4)}
.rd-line{display:grid;gap:2px}
.rd-t{font:600 30px/1.1 var(--hand);color:var(--red);letter-spacing:.04em;word-break:break-all}
.rd-t.good{color:#1f6a36}
.rd-meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font:600 11px/1 var(--mono);color:var(--ink2)}
.rd-meter i{height:8px;border-radius:4px;background:rgba(0,0,0,.1);overflow:hidden}.rd-meter b{display:block;height:100%;background:linear-gradient(90deg,#b8452f,#c9a53a 50%,#2d8a4a)}
.dp-work{display:grid;gap:8px}
.dp-work h4{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:6px 0 0}
.placed{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:14px;background:rgba(44,79,143,.12);font:700 13px/1 var(--type);color:var(--blue)}
.pl small{font-weight:400;color:var(--ink2)}
.pl button{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--ink2);display:grid;place-items:center}
.pl svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.wk{padding:10px 12px;border-radius:3px;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.wk-h{display:flex;align-items:center;gap:8px}.wk-h b{font:800 17px/1 var(--display);letter-spacing:.04em}.wk-h .btn{margin-left:auto}
.wk-t{font:600 21px/1.3 var(--hand);color:var(--graphite);margin:6px 0 0;word-break:break-word}
textarea.wu{width:100%;min-height:140px;padding:12px;border:0;border-radius:3px;background:#f7f1e0;background-image:repeating-linear-gradient(transparent 0 27px,rgba(80,110,160,.25) 27px 28px);font:600 21px/28px var(--hand);color:var(--graphite);resize:vertical}
/* periodic */
.step{display:grid;gap:10px;padding:12px;border-radius:3px;background:rgba(255,255,255,.38);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.st-h{display:flex;align-items:center;gap:10px;font:800 18px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.st-h b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#f3ecd9;font:700 13px/1 var(--mono)}
.st-h .qbtn{margin-left:auto}
.pchart{position:relative;display:flex;align-items:flex-end;gap:4px;height:160px;padding:6px 4px 0;border-bottom:1.5px solid var(--ink);background-image:repeating-linear-gradient(0deg,rgba(80,110,160,.15) 0 1px,transparent 1px 20px)}
.pbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border:0;background:transparent;padding:0 0 4px;min-width:0}
.pbar i{display:block;width:70%;max-width:30px;background:linear-gradient(#5d6a72,#39444a);border-radius:1px 1px 0 0;height:0;max-height:78%}
.pbar span{font:700 12px/1 var(--mono);color:var(--ink2)}
.pbar.best i{background:linear-gradient(#e0553b,#a92b1b)}
.pbar.on i{box-shadow:0 0 0 2.5px var(--amber)}
.pbar.on span{color:var(--red)}
.pc-cap{font:italic 13px/1.35 var(--serif);color:var(--ink2);margin:0}
.reps{display:grid;gap:4px;font-size:14px}.reps small{color:var(--ink2)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.colc{padding:8px;border-radius:3px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.cc-h{display:flex;justify-content:space-between;align-items:center;font:700 12px/1 var(--mono);color:var(--ink2);margin-bottom:6px}
.cc-best{font:600 15px/1 var(--hand);color:var(--red)}.cc-best.ok{color:#1f6a36}
.cc-bars{display:flex;align-items:flex-end;gap:2px;height:70px;border-bottom:1px solid var(--ink)}
.cc-bars span{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.cc-bars i{position:absolute;bottom:0;border-radius:1px 1px 0 0}
.cc-bars i.ex{left:0;right:0;background:rgba(80,90,100,.18)}

      var d = img.data;
      var key = Math.floor(t / 3) % 7 < 4 && Math.floor(t / 11) % 3 !== 0, key2 = Math.floor(t / 2.3) % 5 < 2;
      for (var i = 0; i < W; i++) {
        var v = 8 + Math.random() * 26 + 8 * Math.sin(i * 0.05 + t * 0.01);
        tr.forEach(function (s) {
          var dx = Math.abs(i - (s.f * W + Math.sin(t * 0.004 + s.f * 9) * 3));
          if (s.k === 'v') { if (dx < 1) v += 180; else if (dx < 9) v += (9 - dx) * 9 * Math.random(); }
          else if (s.k === 'c') { if (key && dx < 1) v += s.a; }
          else if (s.k === 'c2') { if (key2 && dx < 1) v += s.a; }
          else if (dx < s.w) v += s.a * (0.6 + 0.4 * Math.sin(t * 0.05));
        });
        var iv = UIclamp(v | 0, 0, 255), p = i * 4;
        d[p] = lut[iv * 3]; d[p + 1] = lut[iv * 3 + 1]; d[p + 2] = lut[iv * 3 + 2]; d[p + 3] = 255;
      }
    }
    var t = 0;
    function step() { x.globalCompositeOperation = 'copy'; x.drawImage(cv, 0, 1); x.globalCompositeOperation = 'source-over'; row(t++); x.putImageData(img, 0, 0); }
    for (var i = 0; i < H; i++) step();
    var groups = [], rg = UIrand('tg'); for (var k = 0; k < 40; k++) groups.push(String(10000 + Math.floor(rg() * 89999)));
    var gi = 0, gEl = UI$('#t-groups');
    function show() { if (!gEl.isConnected) return; gEl.innerHTML = groups.slice(gi, gi + 5).map(function (g, j) { return '<span' + (j === 2 ? ' class="cur"' : '') + '>' + g + '</span>'; }).join(''); }
    show();
    clearInterval(UIBoot._gi); if (motion) UIBoot._gi = setInterval(function () { if (!gEl.isConnected) { clearInterval(UIBoot._gi); return; } gi = (gi + 1) % 35; show(); }, 1500);
    var last = 0;
    function frame(now) { if (UI$('#title').hidden || !cv.isConnected) return; if (now - last > 50) { step(); last = now; } requestAnimationFrame(frame); }
    if (motion) requestAnimationFrame(frame);
  },
  start: function (seed, grade, tutorial) {
    var msg = UI$('#t-msg');
    if (msg) msg.textContent = 'Opening the case file…';
    UI$$('#title button').forEach(function (b) { b.disabled = true; });
    setTimeout(function () {
      try { UIA.create(seed, grade, { tutorial: tutorial }); }
      catch (e) {
        console.error(e);
        if (msg) msg.textContent = 'Could not open this case (' + e.message + '). Try another number.';
        UI$$('#title button').forEach(function (b) { b.disabled = false; });
        return;
      }
      UIS = UI.freshState();
      if (tutorial) UIS.explained = { receiver: 1, hold: 1, df: 1, map: 1 };
      UIA.clearSave();
      UIPREF.set('played', UIPREF.get('played', 0) + 1);
      UIBoot.enter();
      UI.go('receiver');
      UI.save();
      UIBoot.nightCard(function () { if (tutorial) UICoach.start('tutorial'); });
    }, 30);
  },
  nightCard: function (after) {
    var c = UIA.clock(), ov = UI$('#night');
    ov.innerHTML = '<div class="nc"><div class="nc-memo paper"><div class="nc-h"><span class="eyebrow">Station Kestrel · night duty</span><h2>Night ' + (c.shift + 1) + ' of ' + c.shifts + '</h2><span class="nc-stamp">On watch</span></div>' +
      '<p style="font:400 15px/1.5 var(--type)">' + UIesc(c.night || c.day) + '. The watch runs 18:00 to 02:00. ' + UIA.warrants().left + ' warrants in the safe.</p>' +
      '<p class="nc-next">Supt. Norlander’s brief and Mrs Holm’s note are on the Desk.</p><button class="btn pri" id="nc-go">Take the headphones</button></div></div>';
    ov.hidden = false; requestAnimationFrame(function () { ov.classList.add('on'); });
    UI$('#nc-go').addEventListener('click', function () { UIAudio.start(); UIAudio.cue('switch'); ov.classList.remove('on'); setTimeout(function () { ov.hidden = true; ov.innerHTML = ''; if (after) after(); }, 400); });
  },
  cont: function (sv) {
    try { UIA.loadSaved(sv); }
    catch (e) { console.error(e); var m = UI$('#t-msg'); if (m) m.textContent = 'The saved case could not be restored (' + e.message + ').'; return; }
    UIS = sv.ui || UI.freshState();
    var fr = UI.freshState(); for (var k in fr) if (UIS[k] === undefined) UIS[k] = fr[k];
    ['rx', 'bench', 'traffic', 'map', 'desk', 'op'].forEach(function (k) { for (var j in fr[k]) if (UIS[k][j] === undefined) UIS[k][j] = fr[k][j]; });
    UIBoot.enter();
    if (UIA.over()) { UIDebrief.show(); return; }
    UI.go(UIS.tab || 'receiver');
    if (UIS.coach) UICoach.resume();
  },
  enter: function () {
    UI$('#title').hidden = true; UI$('#debrief').hidden = true; UI$('#game').hidden = false;
    clearInterval(UIBoot._gi);
    Object.keys(UI.views).forEach(function (k) { var v = UI.views[k]; v.built = false; if (v.reset) v.reset(); });
    UI$$('.view').forEach(function (v) { v.innerHTML = ''; });
    if (!UI.framed) { UI.buildFrame(); UI.framed = true; }
    UI.topbar(); UI.badges();
  },
  boot: function () {
    UITex.make();
    if (!UIA.ready()) { var t = UI$('#title'); t.hidden = false; t.innerHTML = '<div class="t-wrap"><h1 class="t-title">Depth</h1><p class="t-dek">This build has no engine.</p></div>'; return; }
    UIBoot.title();
  }
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', UIBoot.boot); else UIBoot.boot();
</script>
