<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Covert Action</title>
<meta name="description" content="A from-memory recreation of the 1990 espionage classic: break-ins, codebreaking, wiretaps and car tails across a randomly generated international plot.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    box-sizing: border-box; font-family: monospace;
  }
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; outline: none;
  }
  #pad { display: none; width: 100%; max-width: 640px; box-sizing: border-box; padding: 10px 16px 14px; gap: 12px;
    justify-content: space-between; align-items: center; }
  body.touch #pad { display: flex; }
  body.touch { justify-content: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .dpad { position: relative; width: 132px; height: 132px; flex: none; }
  .dpad button { position: absolute; width: 44px; height: 44px; }
  .dpad [data-k="up"] { left: 44px; top: 0; }
  .dpad [data-k="down"] { left: 44px; bottom: 0; }
  .dpad [data-k="left"] { left: 0; top: 44px; }
  .dpad [data-k="right"] { right: 0; top: 44px; }
  .btns { display: grid; grid-template-columns: repeat(2, 60px); gap: 10px; }
  #pad button {
    font: bold 11px/1 monospace; letter-spacing: .05em; color: #d8d8e0;
    background: linear-gradient(#5c5c6c, #3c3c48); border: 2px solid #8c8c9c; border-bottom-color: #1c1c24; border-right-color: #1c1c24;
    border-radius: 3px; padding: 0; touch-action: none;
  }
  #pad button.on { background: #2034a8; color: #f8e030; }
  .btns button { height: 48px; }
  .mid { display: flex; flex-direction: column; gap: 8px; }
  .mid button { width: 56px; height: 30px; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200" tabindex="0" aria-label="Covert Action game screen"></canvas>
<div id="pad" aria-hidden="true">
  <div class="dpad">
    <button data-k="up" id="k-up">▲</button>
    <button data-k="left" id="k-left">◀</button>
    <button data-k="right" id="k-right">▶</button>
    <button data-k="down" id="k-down">▼</button>
  </div>
  <div class="mid">
    <button data-k="menu" id="k-menu">ESC</button>
    <button data-k="alt2" id="k-alt2">TAB</button>
  </div>
  <div class="btns">
    <button data-k="alt" id="k-alt">GREN</button>
    <button data-k="fire" id="k-fire">FIRE</button>
    <button data-k="action" id="k-action">SEARCH</button>
    <button data-k="select" id="k-select">OK</button>
  </div>
</div>
<script>
"use strict";
// ===================================================================
// CORE: screen, palette, input, sound, rng, drawing primitives, scenes
// ===================================================================
const W = 320, H = 200;
const cv = document.getElementById('screen');
let g = cv.getContext('2d', { alpha: false });
const SCREEN = g;
g.imageSmoothingEnabled = false;

// MCGA-era palette, picked by hand to sit in the 6-bit-per-channel VGA DAC range
// The 16-colour EGA palette the original ran in, under descriptive names.
const EGA = { black: '#000000', blue: '#0000AA', green: '#00AA00', cyan: '#00AAAA', red: '#AA0000', magenta: '#AA00AA', brown: '#AA5500', lgray: '#AAAAAA',
  dgray: '#555555', lblue: '#5555FF', lgreen: '#55FF55', lcyan: '#55FFFF', lred: '#FF5555', lmagenta: '#FF55FF', yellow: '#FFFF55', white: '#FFFFFF' };
const P = {
  K: EGA.black, DK: EGA.black, D2: EGA.black, G1: EGA.dgray, G2: EGA.dgray, G3: EGA.lgray, G4: EGA.lgray, G5: EGA.white, W: EGA.white,
  NV: EGA.blue, BL: EGA.blue, BL2: EGA.lblue, BL3: EGA.lblue, CY: EGA.lcyan, TL: EGA.cyan,
  YE: EGA.yellow, YE2: EGA.brown, OR: EGA.lred, RD: EGA.red, RD2: EGA.lred, PK: EGA.lmagenta,
  GR: EGA.green, GR2: EGA.lgreen, GR3: EGA.lgreen, DG: EGA.black, OL: EGA.brown,
  BR: EGA.brown, BR2: EGA.brown, BR3: EGA.lgray, TN: EGA.lgray, CR: EGA.white,
  SK: EGA.lred, SK2: EGA.brown, SK3: EGA.red, PU: EGA.magenta, PU2: EGA.lmagenta, MG: EGA.magenta,
};

// ---------- fit canvas ----------
function fit() {
  const touch = document.body.classList.contains('touch');
  const vw = window.innerWidth, vh = window.innerHeight - (touch ? 190 : 0);
  // original ran 320x200 on a 4:3 monitor: pixels were 1.2x taller than wide
  let w = Math.min(vw, vh * 4 / 3), h = w * 3 / 4;
  if (w >= 640 && !touch) { const s = Math.floor(w / 320); w = 320 * s; h = w * 3 / 4; }
  cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(h) + 'px';
}
window.addEventListener('resize', fit);

// ---------- rng ----------
let seed = (Date.now() ^ 0x5eed) >>> 0;
function rnd() { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// ---------- drawing primitives ----------
function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function px(x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); }
function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
function line(x0, y0, x1, y1, c) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; g.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (let n = 0; n < 2000; n++) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function disc(cx, cy, r, c) { g.fillStyle = c; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.8)); g.fillRect(cx - w | 0, cy + y | 0, w * 2 + 1, 1); } }
// 4x4 ordered (Bayer) dither: the signature look of 1990 gradients
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function dither(x, y, w, h, c1, c2, level) { // level 0..16 = amount of c2
  rect(x, y, w, h, c1); if (level <= 0) return; g.fillStyle = c2;
  if (level >= 16) { g.fillRect(x, y, w, h); return; }
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) if (BAYER[((y + yy) & 3) * 4 + ((x + xx) & 3)] < level) g.fillRect(x + xx, y + yy, 1, 1);
}
function vgrad(x, y, w, h, cols) { // banded + dithered vertical gradient through a list of colours
  const seg = h / (cols.length - 1);
  for (let yy = 0; yy < h; yy++) {
    const t = yy / seg, i = Math.min(cols.length - 2, Math.floor(t)), f = t - i;
    const lvl = Math.round(f * 16);
    g.fillStyle = cols[i]; g.fillRect(x, y + yy, w, 1);
    if (lvl > 0) { g.fillStyle = cols[i + 1]; for (let xx = 0; xx < w; xx++) if (BAYER[((y + yy) & 3) * 4 + ((x + xx) & 3)] < lvl) g.fillRect(x + xx, y + yy, 1, 1); }
  }
}
// raised / sunken bevel boxes, MicroProse-menu style
function bevel(x, y, w, h, face, hi, lo) { rect(x, y, w, h, face); rect(x, y, w, 1, hi); rect(x, y, 1, h, hi); rect(x, y + h - 1, w, 1, lo); rect(x + w - 1, y, 1, h, lo); }
function panel(x, y, w, h) { rect(x, y, w, h, P.K); bevel(x + 1, y + 1, w - 2, h - 2, P.G3, P.G5, P.G1); rect(x + 4, y + 4, w - 8, h - 8, P.G1); rect(x + 5, y + 5, w - 10, h - 10, P.NV); }

// cached offscreen sprites
const spriteCache = new Map();
function sprite(key, w, h, drawFn) {
  let c = spriteCache.get(key);
  if (!c) { c = document.createElement('canvas'); c.width = w; c.height = h; drawTo(c.getContext('2d'), drawFn); spriteCache.set(key, c); }
  return c;
}
let gStack = [];
function drawTo(ctx, fn) { gStack.push(g); g = ctx; try { fn(); } finally { g = gStack.pop(); } }

// ---------- input ----------
// logical buttons: up down left right fire action alt alt2 select menu
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'fire', ControlLeft: 'fire', KeyE: 'action', KeyX: 'action', KeyG: 'alt', KeyQ: 'alt', Tab: 'alt2', Enter: 'select', NumpadEnter: 'select', Escape: 'menu',
};
const held = new Set(); const pressedQ = [];
const input = {
  held: k => held.has(k),
  axis() { return { x: (held.has('right') ? 1 : 0) - (held.has('left') ? 1 : 0), y: (held.has('down') ? 1 : 0) - (held.has('up') ? 1 : 0) }; },
};
let typing = false; // crypto scene wants raw letters
window.addEventListener('keydown', e => {
  if (e.code === 'KeyM' && !typing) { sfx.toggle(); e.preventDefault(); return; }
  if (typing && /^Key[A-Z]$/.test(e.code) && !e.ctrlKey && !e.metaKey) { scene.onChar && scene.onChar(e.code.slice(3)); e.preventDefault(); return; }
  if (typing && (e.code === 'Backspace' || e.code === 'Delete')) { scene.onChar && scene.onChar(''); e.preventDefault(); return; }
  if (scene.rawKey && scene.rawKey(e)) { e.preventDefault(); sfx.unlock(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); sfx.unlock();
  if (!held.has(k)) { pressedQ.push(k); }
  held.add(k);
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) held.delete(k); });
window.addEventListener('blur', () => held.clear());

// touch pad
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); sfx.unlock(); if (!held.has(k)) pressedQ.push(k); held.add(k); b.classList.add('on'); };
  const up = e => { e.preventDefault(); held.delete(k); b.classList.remove('on'); };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
function enableTouch() { if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); fit(); } }
if (matchMedia('(pointer: coarse)').matches) enableTouch();
window.addEventListener('touchstart', enableTouch, { passive: true });

// pointer on the canvas -> game coordinates
const mouse = { x: -1, y: -1, down: false };
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus(); sfx.unlock(); const p = toGame(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true; scene.onTap && scene.onTap(p.x, p.y); });
cv.addEventListener('pointermove', e => { const p = toGame(e); mouse.x = p.x; mouse.y = p.y; scene.onHover && scene.onHover(p.x, p.y); });
window.addEventListener('pointerup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- sound: PC-speaker / early AdLib flavoured square-wave bleeps ----------
const sfx = {
  ctx: null, muted: false,
  unlock() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } },
  toggle() { this.muted = !this.muted; toast(this.muted ? 'SOUND OFF' : 'SOUND ON'); },
  tone(f, d = 0.08, type = 'square', vol = 0.06, slide = 0, delay = 0) {
    if (this.muted || !this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), gn = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0008, t + d); o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d = 0.15, vol = 0.1, hp = 800, delay = 0) {
    if (this.muted || !this.ctx) return; const c = this.ctx, t = c.currentTime + delay, n = Math.floor(c.sampleRate * d);
    const b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const gn = c.createGain(); gn.gain.value = vol;
    s.connect(f); f.connect(gn); gn.connect(c.destination); s.start(t);
  },
  blip() { this.tone(880, 0.03, 'square', 0.04); },
  select() { this.tone(660, 0.05, 'square', 0.05); this.tone(990, 0.06, 'square', 0.05, 0, 0.05); },
  deny() { this.tone(160, 0.18, 'square', 0.06); },
  shot() { this.noise(0.12, 0.18, 400); this.tone(220, 0.08, 'square', 0.05, -150); },
  boom() { this.noise(0.6, 0.3, 60); this.tone(90, 0.5, 'sawtooth', 0.08, -60); },
  hiss() { this.noise(0.8, 0.06, 2500); },
  alarm() { for (let i = 0; i < 4; i++) { this.tone(900, 0.16, 'square', 0.05, 0, i * 0.34); this.tone(600, 0.16, 'square', 0.05, 0, i * 0.34 + 0.17); } },
  tick() { this.tone(1400, 0.015, 'square', 0.025); },
  success() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'square', 0.05, 0, i * 0.1)); },
  fail() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.16, 'square', 0.05, 0, i * 0.14)); },
  jingle() { // title sting
    const n = [196, 0, 196, 233, 262, 0, 196, 175, 196, 0, 147, 0, 156, 175, 196];
    n.forEach((f, i) => { if (f) { this.tone(f, 0.16, 'square', 0.045, 0, i * 0.13); this.tone(f / 2, 0.16, 'triangle', 0.07, 0, i * 0.13); } });
  },
};

// ---------- toast / scenes ----------
let toastMsg = '', toastT = 0;
function toast(m, t = 1.6) { toastMsg = m; toastT = t; }
let scene = { update() {}, draw() {} };
function go(s) { if (scene.leave) scene.leave(); scene = s; typing = !!s.typing; held.clear(); pressedQ.length = 0; if (s.enter) s.enter(); }

let last = performance.now(), acc = 0; const STEP = 1 / 60;
function frameLoop(now) {
  let dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  while (pressedQ.length) { const k = pressedQ.shift(); scene.onKey && scene.onKey(k); }
  let n = 0; while (acc >= STEP && n < 6) { scene.update && scene.update(STEP); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  g.save(); scene.draw && scene.draw(); g.restore();
  if (toastT > 0) { toastT -= dt; const w = textW(toastMsg) + 10; rect((W - w) / 2, 4, w, 12, P.K); frame((W - w) / 2, 4, w, 12, P.YE); text(toastMsg, (W - w) / 2 + 5, 7, P.YE); }
  requestAnimationFrame(frameLoop);
}
// ===================================================================
// FONT: hand-drawn proportional bitmap face (cap height 7, descender 2)
// ===================================================================
const GLYPHS = {
  'A': '.xxx. x...x x...x xxxxx x...x x...x x...x', 'B': 'xxxx. x...x x...x xxxx. x...x x...x xxxx.',
  'C': '.xxx. x...x x.... x.... x.... x...x .xxx.', 'D': 'xxxx. x...x x...x x...x x...x x...x xxxx.',
  'E': 'xxxxx x.... x.... xxxx. x.... x.... xxxxx', 'F': 'xxxxx x.... x.... xxxx. x.... x.... x....',
  'G': '.xxx. x...x x.... x.xxx x...x x...x .xxxx', 'H': 'x...x x...x x...x xxxxx x...x x...x x...x',
  'I': 'xxx .x. .x. .x. .x. .x. xxx', 'J': '..xxx ...x. ...x. ...x. x..x. x..x. .xx..',
  'K': 'x...x x..x. x.x.. xx... x.x.. x..x. x...x', 'L': 'x.... x.... x.... x.... x.... x.... xxxxx',
  'M': 'x...x xx.xx x.x.x x.x.x x...x x...x x...x', 'N': 'x...x xx..x x.x.x x..xx x...x x...x x...x',
  'O': '.xxx. x...x x...x x...x x...x x...x .xxx.', 'P': 'xxxx. x...x x...x xxxx. x.... x.... x....',
  'Q': '.xxx. x...x x...x x...x x.x.x x..x. .xx.x', 'R': 'xxxx. x...x x...x xxxx. x.x.. x..x. x...x',
  'S': '.xxxx x.... x.... .xxx. ....x ....x xxxx.', 'T': 'xxxxx ..x.. ..x.. ..x.. ..x.. ..x.. ..x..',
  'U': 'x...x x...x x...x x...x x...x x...x .xxx.', 'V': 'x...x x...x x...x x...x x...x .x.x. ..x..',
  'W': 'x...x x...x x...x x.x.x x.x.x xx.xx x...x', 'X': 'x...x x...x .x.x. ..x.. .x.x. x...x x...x',
  'Y': 'x...x x...x .x.x. ..x.. ..x.. ..x.. ..x..', 'Z': 'xxxxx ....x ...x. ..x.. .x... x.... xxxxx',
  'a': '..... ..... .xxx. ....x .xxxx x...x .xxxx', 'b': 'x.... x.... xxxx. x...x x...x x...x xxxx.',
  'c': '.... .... .xxx x... x... x... .xxx', 'd': '....x ....x .xxxx x...x x...x x...x .xxxx',
  'e': '..... ..... .xxx. x...x xxxxx x.... .xxx.', 'f': '..xx .x.. xxx. .x.. .x.. .x.. .x..',
  'g': '..... ..... .xxxx x...x x...x x...x .xxxx ....x .xxx.', 'h': 'x.... x.... xxxx. x...x x...x x...x x...x',
  'i': '.x. ... xx. .x. .x. .x. xxx', 'j': '..x ... .xx ..x ..x ..x ..x x.x .x.',
  'k': 'x... x... x..x x.x. xx.. x.x. x..x', 'l': 'xx. .x. .x. .x. .x. .x. xxx',
  'm': '..... ..... xx.x. x.x.x x.x.x x.x.x x...x', 'n': '..... ..... xxxx. x...x x...x x...x x...x',
  'o': '..... ..... .xxx. x...x x...x x...x .xxx.', 'p': '..... ..... xxxx. x...x x...x x...x xxxx. x.... x....',
  'q': '..... ..... .xxxx x...x x...x x...x .xxxx ....x ....x', 'r': '.... .... x.xx xx.. x... x... x...',
  's': '.... .... .xxx x... .xx. ...x xxx.', 't': '.x.. .x.. xxxx .x.. .x.. .x.x ..x.',
  'u': '..... ..... x...x x...x x...x x..xx .xx.x', 'v': '..... ..... x...x x...x x...x .x.x. ..x..',
  'w': '..... ..... x...x x...x x.x.x x.x.x .x.x.', 'x': '..... ..... x...x .x.x. ..x.. .x.x. x...x',
  'y': '..... ..... x...x x...x x...x x...x .xxxx ....x .xxx.', 'z': '..... ..... xxxxx ...x. ..x.. .x... xxxxx',
  '0': '.xxx. x...x x..xx x.x.x xx..x x...x .xxx.', '1': '.x. xx. .x. .x. .x. .x. xxx',
  '2': '.xxx. x...x ....x ...x. ..x.. .x... xxxxx', '3': 'xxxx. ....x ....x .xxx. ....x ....x xxxx.',
  '4': '...x. ..xx. .x.x. x..x. xxxxx ...x. ...x.', '5': 'xxxxx x.... xxxx. ....x ....x x...x .xxx.',
  '6': '.xxx. x.... x.... xxxx. x...x x...x .xxx.', '7': 'xxxxx ....x ...x. ..x.. .x... .x... .x...',
  '8': '.xxx. x...x x...x .xxx. x...x x...x .xxx.', '9': '.xxx. x...x x...x .xxxx ....x ....x .xxx.',
  ' ': '... ... ... ... ... ... ...', '.': '. . . . . . x', ',': '. . . . . . x x', '!': 'x x x x x . x',
  '?': '.xxx. x...x ....x ...x. ..x.. ..... ..x..', "'": 'x x . . . . .', '"': 'x.x x.x ... ... ... ... ...',
  '-': '.... .... .... xxxx .... .... ....', '+': '..... ..x.. ..x.. xxxxx ..x.. ..x.. .....',
  ':': '. . x . . x .', ';': '. . x . . x x', '/': '....x ...x. ...x. ..x.. .x... .x... x....',
  '(': '.x x. x. x. x. x. .x', ')': 'x. .x .x .x .x .x x.', '#': '.x.x. xxxxx .x.x. .x.x. .x.x. xxxxx .x.x.',
  '%': 'xx..x xx..x ...x. ..x.. .x... x..xx x..xx', '&': '.xx.. x..x. x.x.. .x... x.x.x x..x. .xx.x',
  '*': '..... x.x.x .xxx. xxxxx .xxx. x.x.x .....', '=': '..... ..... xxxxx ..... xxxxx ..... .....',
  '<': '...x ..x. .x.. x... .x.. ..x. ...x', '>': 'x... .x.. ..x. ...x ..x. .x.. x...',

function folder(col, tab, sheet = true) {

  // tab: angled ends
  rect(160, 1, 158, 10, col); for (let i = 0; i < 10; i++) { px(160 - 10 + i, 11 - i, P.K); px(318 + 10 - i - 10, 1 + i, P.G1); }

  const tw = textW(tab) + 8; rect(318 - 18 - tw, 3, tw, 8, P.G3); text(tab, 318 - 14 - tw, 3, P.K);
  if (sheet) { rect(6, 16, 307, 184, P.W); rect(6, 16, 307, 1, P.G3); rect(6, 16, 1, 184, P.G3); rect(312, 16, 1, 184, P.G1); }

function folderList(tab, col, rows, back, opts = {}) {
  let sel = 0, top = 0; const vis = 20;
  return {
    t: 0, update(dt) { this.t += dt; },
    onKey(k) {
      if (k === 'menu') { back(); return; }
      if (!rows.length) { if (k === 'select' || k === 'fire') back(); return; }
      if (k === 'up') sel = Math.max(0, sel - 1); if (k === 'down') sel = Math.min(rows.length - 1, sel + 1);
      if (sel < top) top = sel; if (sel >= top + vis) top = sel - vis + 1;
      if ((k === 'select' || k === 'fire')) { if (rows[sel].open) { sfx.select(); rows[sel].open(); } else back(); }
    },
    onTap(x, y) { const i = top + Math.floor((y - 22) / 8); if (i >= 0 && i < rows.length) { if (i === sel && rows[i].open) rows[i].open(); sel = i; } else back(); },
    draw() {
      folder(col, tab);
      if (!rows.length) text(opts.empty || '...none', 14, 22, P.G1);
      rows.slice(top, top + vis).forEach((r, i) => { const y = 22 + i * 8, on = top + i === sel; if (on && rows.some(q => q.open)) rect(10, y - 1, 298, 9, P.YE); text(fitText(r.label, 230), 14, y, r.col || P.K); if (r.right) textR(fitText(r.right, 70), 304, y, r.rcol || P.BL); });
      if (rows.length > vis) textR((top + 1) + '-' + Math.min(rows.length, top + vis) + ' of ' + rows.length, 304, 190, P.G1);
    },
  };
}

function newCase() {

function goLocation(l) {
  advance(20); if (checkCaseEnd()) return;

  const heat = (game.heatBy && game.heatBy[game.city]) || 0, locals = game.crime.people.some(p => p.status === 'free' && p.city === game.city);
  if (locals && heat > 0 && l.kind !== 'airport' && rnd() < Math.min(0.45, heat * 0.07)) { game.heatBy[game.city] = Math.max(0, heat - 2); ambush(arrive); return; }
  arrive();
}

function capturedScene(out) {
  const held = game.crime.people.filter(p => p.status === 'arrested' && p.role !== 'Mastermind');
  const escape = () => go(pageScene(() => { rect(0, 0, W, H, P.K); rect(225, 0, 95, 200, P.RD); dither(225, 0, 95, 200, P.RD, P.K, 4); rect(240, 70, 60, 20, P.G3); disc(250, 80, 10, P.G3); disc(290, 80, 10, P.G3); disc(250, 80, 6, P.RD); disc(290, 80, 6, P.RD); rect(230, 110, 90, 40, P.K); para('After hours of effort, you manage to work your hands free of the cuffs. You slip out past a sleeping guard and make your way back to the CIA office.', 15, 20, 200, P.W, 8); statusBox(174); }, () => go(report('Break-in', out.length ? out : ['You lost everything you were carrying.'], () => go(cityScene())))));
  return menuScene({
    menu: Menu([{ label: 'No thanks, Squinty.', go: () => { advance(18 * 60); escape(); } }, { label: 'Agree to exchange.', go: () => {
      if (held.length) { const p = pick(held); p.status = 'free'; p.jailCity = null; go(report('Exchange', ['You are traded for ' + p.name + ', who walks free and rejoins the plot.'], () => go(ciaFloors()))); return; }
      // nobody of theirs to trade: the price is a mole inside the Agency
      const cr = game.crime; if (!cr.double || cr.double.caught) cr.double = { city: pick(regionCities(game.region)).id, caught: false };
      go(report('Exchange', ['We hold none of their people, so the price of your release is paid quietly: somebody at the Agency now works for them.', 'Watch your clues. One CIA station may no longer be telling the truth.'], () => go(cityScene())));
    } }], 23, 120, 200),
    draw() { rect(0, 0, W, H, P.K); captureArt(225, 0, 95, 200); para('Your captors question you, but you refuse to talk. "So you are the famous CIA agent Max Remington." "We have lots of time, soon you will tell us what you know." "Perhaps we should exchange you for one of our agents?"', 15, 20, 200, P.W, 8); this.menu.draw(); statusBox(174); },
  });
}
// ---------- PRISON BREAK: defend the jail room against a rescue team ----------
function prisonBreakScene() {
  const cr = game.crime, pb = cr.prisonBreak, p = cr.people[pb.pid], city = cityById(pb.city), far = pb.city !== game.city;
  const lose = (lines, mins) => { p.status = 'free'; p.escaped = true; p.jailCity = null; afterMission(mins, () => go(report('Prison Break', lines.concat([p.name + ' is back at large and rejoins the plot.']), () => go(cityScene())))); };
  const defend = () => {
    pb.handled = true;
    if (far) { const here = cityById(game.city); advance(Math.round(2 + dist(here.lon, here.lat, city.lon, city.lat) / 8) * 60); game.city = pb.city; }
    const kit = { uzi: false, camera: false, bugs: 0, gasmask: false, detector: true, kevlar: false, safekit: false, frag: 2, stun: 3, gas: 0 };
    go(breakinScene({ mode: 'defend', level: game.diff, kit, maxHits: 4, org: p.org }, res => {
      const mins = 30 + Math.round(res.seconds / 2);
      if (res.kind === 'held') {
        const out = ['The rescue team is down. ' + p.name + ' stays behind bars.'];
        const q = cr.people.filter(o => o.org === p.org && o.status === 'free'); if (q.length) { const c = clueAbout(pick(q), 'Interrogation'); if (c) out.push('One of the raiders talks: ' + c.text); }
        afterMission(mins, () => go(report('Prison Break', out, () => go(cityScene())))); return;
      }
      lose(res.kind === 'captured' ? ['You wake up in the prison infirmary. The raiders got what they came for.'] : ['The raiders reach the cell and get away with their man.'], res.kind === 'captured' ? mins + 8 * 60 : mins);
    }));
  };
  const police = () => { pb.handled = true; advance(60); if (rnd() < 0.5) afterMission(0, () => go(report('Prison Break', ['The local police beat off the attack. ' + p.name + ' stays in custody.'], () => go(cityScene())))); else lose(['The police were outgunned.'], 0); };
  return menuScene({
    menu: Menu([{ label: far ? 'Fly to ' + city.name + ' and defend' : 'Rush to the jail', go: defend }, { label: 'Leave it to the police', go: police }], 23, 120, 200),
    draw() {
      rect(0, 0, W, H, P.K); captureArt(225, 0, 95, 200); rect(0, 0, 222, 12, P.RD); textC('URGENT', 111, 2, P.W);
      para('Our people in ' + city.name + ' report that the ' + p.org.name + ' are planning to break ' + p.name + ' (' + p.role + ') out of jail. The attack could come at any moment.', 15, 22, 200, P.W, 8);
      para('Defend the cell yourself: nobody may reach the prisoner. You will have a pistol, a few grenades and a motion detector.', 15, 70, 200, P.G3, 8);
      this.menu.draw(); statusBox(174);
    },
  });
}

// ---------- AMBUSHES: gunmen on the street, or a hit squad on your tail ----------
function ambush(next) {
  const city = cityById(game.city), locals = game.crime.people.filter(p => p.status === 'free' && p.city === game.city);
  const org = (pick(locals) || game.crime.people[0]).org, street = rnd() < 0.5;
  go(pageScene(t => {
    rect(0, 0, W, H, P.K); cityPic(150, 20, 160, 150, city); if ((t * 4 | 0) % 2) frame(148, 18, 164, 154, P.RD2);
    text(street ? 'AMBUSH!' : 'HIT SQUAD!', 15, 20, P.RD2);
    para(street ? 'As you step out onto the street in ' + city.name + ', a car screeches to a halt. Men with guns pile out. You have been asking too many questions here.' : 'A black sedan has been following you since the hotel. When you speed up, so do they. It is a hit squad.', 15, 34, 128, P.W, 8);
    statusBox(174);
  }, () => street ? streetFight(org, next) : hitSquad(org, next)));
}
function streetFight(org, next) {
  const kit = { uzi: false, camera: false, bugs: 0, gasmask: false, detector: false, kevlar: false, safekit: false, frag: 1, stun: 1, gas: 0 };
  go(breakinScene({ mode: 'street', level: game.diff, kit, maxHits: 3, org }, res => {
    if (res.kind === 'captured') { afterMission(6 * 60, () => go(capturedScene([]))); return; }
    const out = [];
    if (res.kind === 'won') { out.push('You search the gunmen. They carry ' + org.name + ' papers.'); const q = game.crime.people.filter(p => p.org === org && p.status === 'free'); if (q.length) { const c = clueAbout(pick(q), 'Documents on the gunmen'); if (c) out.push(c.text); } }
    else out.push('You got away from the gunmen.');
    afterMission(30 + Math.round(res.seconds / 2), () => go(report('Ambush', out, next)));
  }));
}
function hitSquad(org, next) {
  go(chaseScene({ mode: 'evade', level: game.diff, cars: [CARS[1]], night: isNight(), label: 'the hit squad' }, res => {
    if (res.how === 'caught' || res.how === 'abort') { streetFight(org, next); return; }
    if (res.how === 'safe') { afterMission(40, () => go(report('Hit Squad', ['You wait in the CIA garage until the ' + org.name + ' car gives up and drives away.'], () => goLocation2({ kind: 'cia' })))); return; }
    afterMission(30, () => go(report('Hit Squad', ['You lose the ' + org.name + ' hit squad in traffic.'], next)));
  }));
}

function practice(kind, diff) {
  practiceMode = true; game.diff = diff;
  if (!game.agent) game.agent = newAgent('m', 'Trainee');
  Object.assign(game, { t: 0, clues: [], messages: [], news: [], taps: [], activity: {}, inside: [] }); game.startDate = new Date(1990, 5, 1, 8, 0, 0); newCrime();
  const back = () => { practiceMode = false; go(optionsScene()); };
  const cr = game.crime, p = cr.people[1], b = game.buildings[p.building];
  if (kind === 'breakin') go(armoryScene(kit => go(breakinScene(Object.assign({ level: diff, occupant: p, building: b, org: b.org, alert: 0 }, kit), back))));
  const bare = { uzi: false, camera: false, bugs: 0, gasmask: false, detector: kind === 'defend', kevlar: false, safekit: false, frag: kind === 'defend' ? 2 : 1, stun: kind === 'defend' ? 3 : 1, gas: 0 };
  if (kind === 'street' || kind === 'defend') go(breakinScene({ mode: kind, level: diff, kit: bare, maxHits: kind === 'defend' ? 4 : 3, org: p.org }, back));
  if (kind === 'evade') go(chaseScene({ mode: 'evade', level: diff, cars: [CARS[1]], night: false, label: 'the instructors' }, back));
  if (kind === 'crypto') go(cryptoScene(makeMessage(cr.steps[0]).text, { msgNo: 'M001', level: diff }, back));
  if (kind === 'wiretap') go(wiretapScene({ level: diff, mode: 'tap', alert: 0, label: 'training board' }, back));
  if (kind === 'chase') go(carSelectScene(cars => go(chaseScene({ level: diff, cars, night: false, target: p, label: 'the instructor', start: b }, back))));
}

// boot
fit();
go(titleScene());
requestAnimationFrame(t => { last = t; requestAnimationFrame(frameLoop); });
</script>
