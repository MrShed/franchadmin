<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Covert Action</title>
<meta name="description" content="A from-memory recreation of the 1990 espionage classic: break-ins, codebreaking, wiretaps and car tails across a randomly generated international plot.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    box-sizing: border-box; font-family: monospace;
  }
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; outline: none;
  }
  #pad { display: none; width: 100%; max-width: 640px; box-sizing: border-box; padding: 10px 16px 14px; gap: 12px;
    justify-content: space-between; align-items: center; }
  body.touch #pad { display: flex; }
  body.touch { justify-content: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .dpad { position: relative; width: 132px; height: 132px; flex: none; }
  .dpad button { position: absolute; width: 44px; height: 44px; }
  .dpad [data-k="up"] { left: 44px; top: 0; }
  .dpad [data-k="down"] { left: 44px; bottom: 0; }
  .dpad [data-k="left"] { left: 0; top: 44px; }
  .dpad [data-k="right"] { right: 0; top: 44px; }
  .btns { display: grid; grid-template-columns: repeat(2, 60px); gap: 10px; }
  #pad button {
    font: bold 11px/1 monospace; letter-spacing: .05em; color: #d8d8e0;
    background: linear-gradient(#5c5c6c, #3c3c48); border: 2px solid #8c8c9c; border-bottom-color: #1c1c24; border-right-color: #1c1c24;
    border-radius: 3px; padding: 0; touch-action: none;
  }
  #pad button.on { background: #2034a8; color: #f8e030; }
  .btns button { height: 48px; }
  .mid { display: flex; flex-direction: column; gap: 8px; }
  .mid button { width: 56px; height: 30px; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200" tabindex="0" aria-label="Covert Action game screen"></canvas>
<div id="pad" aria-hidden="true">
  <div class="dpad">
    <button data-k="up" id="k-up">▲</button>
    <button data-k="left" id="k-left">◀</button>
    <button data-k="right" id="k-right">▶</button>
    <button data-k="down" id="k-down">▼</button>
  </div>
  <div class="mid">
    <button data-k="menu" id="k-menu">ESC</button>
    <button data-k="alt2" id="k-alt2">TAB</button>
  </div>
  <div class="btns">
    <button data-k="alt" id="k-alt">GREN</button>
    <button data-k="fire" id="k-fire">FIRE</button>
    <button data-k="action" id="k-action">SEARCH</button>
    <button data-k="select" id="k-select">OK</button>
  </div>
</div>
<script>
"use strict";
// ===================================================================
// CORE: screen, palette, input, sound, rng, drawing primitives, scenes
// ===================================================================
const W = 320, H = 200;
const cv = document.getElementById('screen');
let g = cv.getContext('2d', { alpha: false });
const SCREEN = g;
g.imageSmoothingEnabled = false;

// MCGA-era palette, picked by hand to sit in the 6-bit-per-channel VGA DAC range
const P = {
  K: '#000000', DK: '#141418', D2: '#24242c', G1: '#383844', G2: '#545464', G3: '#7c7c8c', G4: '#a8a8b8', G5: '#cccccc', W: '#fcfcfc',
  NV: '#000c38', BL: '#1c2c9c', BL2: '#3450d0', BL3: '#6c8cfc', CY: '#54d8fc', TL: '#1c7c7c',
  YE: '#fce03c', YE2: '#b89c1c', OR: '#f47c18', RD: '#b40c0c', RD2: '#f04040', PK: '#fc9cb4',
  GR: '#107c1c', GR2: '#3cb838', GR3: '#90e070', DG: '#0c3c10', OL: '#5c6824',
  BR: '#5c3814', BR2: '#8c5c2c', BR3: '#b8844c', TN: '#dcb884', CR: '#ece0bc',
  SK: '#f0b088', SK2: '#b87850', SK3: '#6c4028', PU: '#6c2c9c', PU2: '#a860dc', MG: '#c02c8c',
};

// ---------- fit canvas ----------
function fit() {
  const touch = document.body.classList.contains('touch');
  const vw = window.innerWidth, vh = window.innerHeight - (touch ? 190 : 0);
  // original ran 320x200 on a 4:3 monitor: pixels were 1.2x taller than wide
  let w = Math.min(vw, vh * 4 / 3), h = w * 3 / 4;
  if (w >= 640 && !touch) { const s = Math.floor(w / 320); w = 320 * s; h = w * 3 / 4; }
  cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(h) + 'px';
}
window.addEventListener('resize', fit);

// ---------- rng ----------
let seed = (Date.now() ^ 0x5eed) >>> 0;
function rnd() { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// ---------- drawing primitives ----------
function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function px(x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); }
function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
function line(x0, y0, x1, y1, c) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; g.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (let n = 0; n < 2000; n++) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function disc(cx, cy, r, c) { g.fillStyle = c; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.8)); g.fillRect(cx - w | 0, cy + y | 0, w * 2 + 1, 1); } }
// 4x4 ordered (Bayer) dither: the signature look of 1990 gradients
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function dither(x, y, w, h, c1, c2, level) { // level 0..16 = amount of c2
  rect(x, y, w, h, c1); if (level <= 0) return; g.fillStyle = c2;
  if (level >= 16) { g.fillRect(x, y, w, h); return; }
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) if (BAYER[((y + yy) & 3) * 4 + ((x + xx) & 3)] < level) g.fillRect(x + xx, y + yy, 1, 1);
}
function vgrad(x, y, w, h, cols) { // banded + dithered vertical gradient through a list of colours
  const seg = h / (cols.length - 1);
  for (let yy = 0; yy < h; yy++) {
    const t = yy / seg, i = Math.min(cols.length - 2, Math.floor(t)), f = t - i;
    const lvl = Math.round(f * 16);
    g.fillStyle = cols[i]; g.fillRect(x, y + yy, w, 1);
    if (lvl > 0) { g.fillStyle = cols[i + 1]; for (let xx = 0; xx < w; xx++) if (BAYER[((y + yy) & 3) * 4 + ((x + xx) & 3)] < lvl) g.fillRect(x + xx, y + yy, 1, 1); }
  }
}
// raised / sunken bevel boxes, MicroProse-menu style
function bevel(x, y, w, h, face, hi, lo) { rect(x, y, w, h, face); rect(x, y, w, 1, hi); rect(x, y, 1, h, hi); rect(x, y + h - 1, w, 1, lo); rect(x + w - 1, y, 1, h, lo); }
function panel(x, y, w, h) { rect(x, y, w, h, P.K); bevel(x + 1, y + 1, w - 2, h - 2, P.G3, P.G5, P.G1); rect(x + 4, y + 4, w - 8, h - 8, P.G1); rect(x + 5, y + 5, w - 10, h - 10, P.NV); }

// cached offscreen sprites
const spriteCache = new Map();
function sprite(key, w, h, drawFn) {
  let c = spriteCache.get(key);
  if (!c) { c = document.createElement('canvas'); c.width = w; c.height = h; drawTo(c.getContext('2d'), drawFn); spriteCache.set(key, c); }
  return c;
}
let gStack = [];
function drawTo(ctx, fn) { gStack.push(g); g = ctx; try { fn(); } finally { g = gStack.pop(); } }

// ---------- input ----------
// logical buttons: up down left right fire action alt alt2 select menu
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'fire', ControlLeft: 'fire', KeyE: 'action', KeyX: 'action', KeyG: 'alt', KeyQ: 'alt', Tab: 'alt2', Enter: 'select', NumpadEnter: 'select', Escape: 'menu',
};
const held = new Set(); const pressedQ = [];
const input = {
  held: k => held.has(k),
  axis() { return { x: (held.has('right') ? 1 : 0) - (held.has('left') ? 1 : 0), y: (held.has('down') ? 1 : 0) - (held.has('up') ? 1 : 0) }; },
};
let typing = false; // crypto scene wants raw letters
window.addEventListener('keydown', e => {
  if (e.code === 'KeyM' && !typing) { sfx.toggle(); e.preventDefault(); return; }
  if (typing && /^Key[A-Z]$/.test(e.code) && !e.ctrlKey && !e.metaKey) { scene.onChar && scene.onChar(e.code.slice(3)); e.preventDefault(); return; }
  if (typing && (e.code === 'Backspace' || e.code === 'Delete')) { scene.onChar && scene.onChar(''); e.preventDefault(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); sfx.unlock();
  if (!held.has(k)) { pressedQ.push(k); }
  held.add(k);
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) held.delete(k); });
window.addEventListener('blur', () => held.clear());

// touch pad
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); sfx.unlock(); if (!held.has(k)) pressedQ.push(k); held.add(k); b.classList.add('on'); };
  const up = e => { e.preventDefault(); held.delete(k); b.classList.remove('on'); };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
function enableTouch() { if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); fit(); } }
if (matchMedia('(pointer: coarse)').matches) enableTouch();
window.addEventListener('touchstart', enableTouch, { passive: true });

// pointer on the canvas -> game coordinates
const mouse = { x: -1, y: -1, down: false };
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus(); sfx.unlock(); const p = toGame(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true; scene.onTap && scene.onTap(p.x, p.y); });
cv.addEventListener('pointermove', e => { const p = toGame(e); mouse.x = p.x; mouse.y = p.y; scene.onHover && scene.onHover(p.x, p.y); });
window.addEventListener('pointerup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- sound: PC-speaker / early AdLib flavoured square-wave bleeps ----------
const sfx = {
  ctx: null, muted: false,
  unlock() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } },
  toggle() { this.muted = !this.muted; toast(this.muted ? 'SOUND OFF' : 'SOUND ON'); },
  tone(f, d = 0.08, type = 'square', vol = 0.06, slide = 0, delay = 0) {
    if (this.muted || !this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), gn = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0008, t + d); o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d = 0.15, vol = 0.1, hp = 800, delay = 0) {
    if (this.muted || !this.ctx) return; const c = this.ctx, t = c.currentTime + delay, n = Math.floor(c.sampleRate * d);
    const b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const gn = c.createGain(); gn.gain.value = vol;
    s.connect(f); f.connect(gn); gn.connect(c.destination); s.start(t);
  },
  blip() { this.tone(880, 0.03, 'square', 0.04); },
  select() { this.tone(660, 0.05, 'square', 0.05); this.tone(990, 0.06, 'square', 0.05, 0, 0.05); },
  deny() { this.tone(160, 0.18, 'square', 0.06); },
  shot() { this.noise(0.12, 0.18, 400); this.tone(220, 0.08, 'square', 0.05, -150); },
  boom() { this.noise(0.6, 0.3, 60); this.tone(90, 0.5, 'sawtooth', 0.08, -60); },
  hiss() { this.noise(0.8, 0.06, 2500); },
  alarm() { for (let i = 0; i < 4; i++) { this.tone(900, 0.16, 'square', 0.05, 0, i * 0.34); this.tone(600, 0.16, 'square', 0.05, 0, i * 0.34 + 0.17); } },
  tick() { this.tone(1400, 0.015, 'square', 0.025); },
  success() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'square', 0.05, 0, i * 0.1)); },
  fail() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.16, 'square', 0.05, 0, i * 0.14)); },
  jingle() { // title sting
    const n = [196, 0, 196, 233, 262, 0, 196, 175, 196, 0, 147, 0, 156, 175, 196];
    n.forEach((f, i) => { if (f) { this.tone(f, 0.16, 'square', 0.045, 0, i * 0.13); this.tone(f / 2, 0.16, 'triangle', 0.07, 0, i * 0.13); } });
  },
};

// ---------- toast / scenes ----------
let toastMsg = '', toastT = 0;
function toast(m, t = 1.6) { toastMsg = m; toastT = t; }
let scene = { update() {}, draw() {} };
function go(s) { if (scene.leave) scene.leave(); scene = s; typing = !!s.typing; held.clear(); pressedQ.length = 0; if (s.enter) s.enter(); }

let last = performance.now(), acc = 0; const STEP = 1 / 60;
function frameLoop(now) {
  let dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  while (pressedQ.length) { const k = pressedQ.shift(); scene.onKey && scene.onKey(k); }
  let n = 0; while (acc >= STEP && n < 6) { scene.update && scene.update(STEP); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  g.save(); scene.draw && scene.draw(); g.restore();
  if (toastT > 0) { toastT -= dt; const w = textW(toastMsg) + 10; rect((W - w) / 2, 4, w, 12, P.K); frame((W - w) / 2, 4, w, 12, P.YE); text(toastMsg, (W - w) / 2 + 5, 7, P.YE); }
  requestAnimationFrame(frameLoop);
}
// ===================================================================
// FONT: hand-drawn proportional bitmap face (cap height 7, descender 2)
// ===================================================================
const GLYPHS = {
  'A': '.xxx. x...x x...x xxxxx x...x x...x x...x', 'B': 'xxxx. x...x x...x xxxx. x...x x...x xxxx.',
  'C': '.xxx. x...x x.... x.... x.... x...x .xxx.', 'D': 'xxxx. x...x x...x x...x x...x x...x xxxx.',
  'E': 'xxxxx x.... x.... xxxx. x.... x.... xxxxx', 'F': 'xxxxx x.... x.... xxxx. x.... x.... x....',
  'G': '.xxx. x...x x.... x.xxx x...x x...x .xxxx', 'H': 'x...x x...x x...x xxxxx x...x x...x x...x',
  'I': 'xxx .x. .x. .x. .x. .x. xxx', 'J': '..xxx ...x. ...x. ...x. x..x. x..x. .xx..',
  'K': 'x...x x..x. x.x.. xx... x.x.. x..x. x...x', 'L': 'x.... x.... x.... x.... x.... x.... xxxxx',
  'M': 'x...x xx.xx x.x.x x.x.x x...x x...x x...x', 'N': 'x...x xx..x x.x.x x..xx x...x x...x x...x',
  'O': '.xxx. x...x x...x x...x x...x x...x .xxx.', 'P': 'xxxx. x...x x...x xxxx. x.... x.... x....',
  'Q': '.xxx. x...x x...x x...x x.x.x x..x. .xx.x', 'R': 'xxxx. x...x x...x xxxx. x.x.. x..x. x...x',
  'S': '.xxxx x.... x.... .xxx. ....x ....x xxxx.', 'T': 'xxxxx ..x.. ..x.. ..x.. ..x.. ..x.. ..x..',
  'U': 'x...x x...x x...x x...x x...x x...x .xxx.', 'V': 'x...x x...x x...x x...x x...x .x.x. ..x..',
  'W': 'x...x x...x x...x x.x.x x.x.x xx.xx x...x', 'X': 'x...x x...x .x.x. ..x.. .x.x. x...x x...x',
  'Y': 'x...x x...x .x.x. ..x.. ..x.. ..x.. ..x..', 'Z': 'xxxxx ....x ...x. ..x.. .x... x.... xxxxx',
  'a': '..... ..... .xxx. ....x .xxxx x...x .xxxx', 'b': 'x.... x.... xxxx. x...x x...x x...x xxxx.',
  'c': '.... .... .xxx x... x... x... .xxx', 'd': '....x ....x .xxxx x...x x...x x...x .xxxx',
  'e': '..... ..... .xxx. x...x xxxxx x.... .xxx.', 'f': '..xx .x.. xxx. .x.. .x.. .x.. .x..',
  'g': '..... ..... .xxxx x...x x...x x...x .xxxx ....x .xxx.', 'h': 'x.... x.... xxxx. x...x x...x x...x x...x',
  'i': '.x. ... xx. .x. .x. .x. xxx', 'j': '..x ... .xx ..x ..x ..x ..x x.x .x.',
  'k': 'x... x... x..x x.x. xx.. x.x. x..x', 'l': 'xx. .x. .x. .x. .x. .x. xxx',
  'm': '..... ..... xx.x. x.x.x x.x.x x.x.x x...x', 'n': '..... ..... xxxx. x...x x...x x...x x...x',
  'o': '..... ..... .xxx. x...x x...x x...x .xxx.', 'p': '..... ..... xxxx. x...x x...x x...x xxxx. x.... x....',
  'q': '..... ..... .xxxx x...x x...x x...x .xxxx ....x ....x', 'r': '.... .... x.xx xx.. x... x... x...',
  's': '.... .... .xxx x... .xx. ...x xxx.', 't': '.x.. .x.. xxxx .x.. .x.. .x.x ..x.',
  'u': '..... ..... x...x x...x x...x x..xx .xx.x', 'v': '..... ..... x...x x...x x...x .x.x. ..x..',
  'w': '..... ..... x...x x...x x.x.x x.x.x .x.x.', 'x': '..... ..... x...x .x.x. ..x.. .x.x. x...x',
  'y': '..... ..... x...x x...x x...x x...x .xxxx ....x .xxx.', 'z': '..... ..... xxxxx ...x. ..x.. .x... xxxxx',
  '0': '.xxx. x...x x..xx x.x.x xx..x x...x .xxx.', '1': '.x. xx. .x. .x. .x. .x. xxx',
  '2': '.xxx. x...x ....x ...x. ..x.. .x... xxxxx', '3': 'xxxx. ....x ....x .xxx. ....x ....x xxxx.',
  '4': '...x. ..xx. .x.x. x..x. xxxxx ...x. ...x.', '5': 'xxxxx x.... xxxx. ....x ....x x...x .xxx.',
  '6': '.xxx. x.... x.... xxxx. x...x x...x .xxx.', '7': 'xxxxx ....x ...x. ..x.. .x... .x... .x...',
  '8': '.xxx. x...x x...x .xxx. x...x x...x .xxx.', '9': '.xxx. x...x x...x .xxxx ....x ....x .xxx.',
  ' ': '... ... ... ... ... ... ...', '.': '. . . . . . x', ',': '. . . . . . x x', '!': 'x x x x x . x',
  '?': '.xxx. x...x ....x ...x. ..x.. ..... ..x..', "'": 'x x . . . . .', '"': 'x.x x.x ... ... ... ... ...',
  '-': '.... .... .... xxxx .... .... ....', '+': '..... ..x.. ..x.. xxxxx ..x.. ..x.. .....',
  ':': '. . x . . x .', ';': '. . x . . x x', '/': '....x ...x. ...x. ..x.. .x... .x... x....',
  '(': '.x x. x. x. x. x. .x', ')': 'x. .x .x .x .x .x x.', '#': '.x.x. xxxxx .x.x. .x.x. .x.x. xxxxx .x.x.',
  '%': 'xx..x xx..x ...x. ..x.. .x... x..xx x..xx', '&': '.xx.. x..x. x.x.. .x... x.x.x x..x. .xx.x',
  '*': '..... x.x.x .xxx. xxxxx .xxx. x.x.x .....', '=': '..... ..... xxxxx ..... xxxxx ..... .....',
  '<': '...x ..x. .x.. x... .x.. ..x. ...x', '>': 'x... .x.. ..x. ...x ..x. .x.. x...',
  '[': 'xx x. x. x. x. x. xx', ']': 'xx .x .x .x .x .x xx', '_': '..... ..... ..... ..... ..... ..... ..... xxxxx',
  '$': '..x.. .xxxx x.x.. .xxx. ..x.x xxxx. ..x..', '@': '.xxx. x...x x.xxx x.x.x x.xxx x.... .xxx.',
  '£': '..xx. .x..x .x... xxx.. .x... .x... xxxxx', '—': '...... ...... ...... xxxxxx ...... ...... ......',
  '·': '. . . x . . .', '▶': 'x... xx.. xxx. xxxx xxx. xx.. x...', '◀': '...x ..xx .xxx xxxx .xxx ..xx ...x',

function newPlot(level) {
  const nOrgs = Math.min(3, 1 + Math.floor((level + 1) / 2));
  const orgs = shuffle(ORGS.slice()).slice(0, nOrgs);
  const crime = pick(CRIMES);
  const nPeople = Math.min(16, 7 + level * 2);
  const codes = shuffle(CODENAMES.slice());
  const lieutenants = shuffle(ROLES.filter(r => r.tier === 2)).slice(0, Math.min(3, 1 + Math.ceil(level / 2)));
  const ops = ROLES.filter(r => r.tier === 1);
  const people = [];
  const used = new Set();
  function mk(role, org) {
    const cid = rnd() < 0.7 ? pick(org.home) : pick(CITIES).id;
    const city = cityById(cid); const nm = NAMES[city.names]; const sex = rnd() < 0.2 ? 'f' : 'm';
    let full; do { full = pick(sex === 'f' ? nm[1] : nm[0]) + ' ' + pick(nm[2]); } while (used.has(full)); used.add(full);
    const p = { id: people.length, code: codes.pop(), name: full, role, org, city: cid, home: cid, face: makeFace(sex, city.names),
      known: { photo: false, name: false, city: false, org: false, role: false }, status: 'free', links: [], cityDay: 0, seen: false };
    people.push(p); return p;
  }
  const mastermind = mk(ROLES[0], orgs[0]);
  // the mastermind never sits in Washington
  if (mastermind.city === 'WAS') { mastermind.city = mastermind.home = pick(orgs[0].home.filter(c => c !== 'WAS')); }
  const lts = lieutenants.map((r, i) => { const p = mk(r, orgs[i % orgs.length]); p.links.push(mastermind.id); mastermind.links.push(p.id); return p; });
  while (people.length < nPeople) {
    const boss = pick(lts); const p = mk(pick(ops), rnd() < 0.6 ? boss.org : pick(orgs));
    p.links.push(boss.id); boss.links.push(p.id);
  }
  // a few sideways contacts between operatives
  const opsP = people.filter(p => p.role.tier === 1);
  for (let i = 0; i < Math.floor(opsP.length / 3); i++) { const a = pick(opsP), b = pick(opsP); if (a !== b && !a.links.includes(b.id)) { a.links.push(b.id); b.links.push(a.id); } }
  const deadline = 18 + Math.max(0, 6 - level) + Math.floor(nPeople / 2);
  const total = people.reduce((s, p) => s + p.role.w, 0);
  return { crime, orgs, people, deadline, total, mastermind: mastermind.id, targetCity: pick(CITIES.filter(c => c.id !== 'WAS')).id, foiled: false, over: false, started: game.day };
}

function plotStrength() { const pl = game.plot; const free = pl.people.filter(p => p.status === 'free').reduce((s, p) => s + p.role.w, 0); return free / pl.total; }
function isSuspect(p) { return FACETS.some(f => p.known[f]); }
function knownCount(p) { return FACETS.filter(f => p.known[f]).length; }
function label(p) { return p.known.name ? p.name : p.code; }
function canArrest(p) { return p.status === 'free' && (p.known.name || p.known.photo) && p.known.city && p.city === game.city; }
function peopleIn(cid) { return game.plot.people.filter(p => p.city === cid && p.status === 'free'); }

// reveal one unknown facet of p (preferring the given facet). Returns a sentence or null.
function reveal(p, prefer) {
  if (!p) return null;
  const opts = FACETS.filter(f => !p.known[f]); if (!opts.length) return null;
  const f = prefer && !p.known[prefer] ? prefer : pick(opts);
  p.known[f] = true; if (f === 'city') p.cityDay = game.day;
  const who = p.code;
  const txt = {
    photo: 'A photograph of ' + who + '.',
    name: who + ' is really ' + p.name + '.',
    city: who + ' is operating in ' + cityById(p.city).name + '.',
    org: who + ' works for the ' + p.org.name + '.',
    role: who + ' is the ' + p.role.name + ' of the plot.',
  }[f];
  game.log.unshift({ day: game.day, t: txt }); if (game.log.length > 60) game.log.pop();
  return txt;
}
// a clue about someone connected to p (or p itself)
function clueFrom(p, preferSelf = 0.35) {
  const pool = [p, ...p.links.map(i => game.plot.people[i])].filter(q => q && q.status !== 'dead');
  const cand = rnd() < preferSelf ? [p] : shuffle(pool.slice());
  for (const q of cand.concat(pool)) { const r = reveal(q); if (r) return r; }
  return null;
}

// the plot moves on each day: mobile people relocate, messages get sent
function advanceTime(hours) {
  const before = game.day;
  game.hour += hours; while (game.hour >= 24) { game.hour -= 24; game.day++; }
  for (let d = before; d < game.day; d++) dailyTick();
}
function dailyTick() {
  const pl = game.plot; if (!pl || pl.over) return;
  for (const p of pl.people) {
    if (p.status !== 'free' || !p.role.mobile) continue;
    if (rnd() < 0.25) { const linked = p.links.map(i => pl.people[i]).filter(q => q.status === 'free'); const dest = linked.length ? pick(linked).city : pick(CITIES).id; if (dest !== p.city) { p.city = dest; p.known.city = false; } }
  }
  // bugged buildings leak messages
  for (const b of game.bugs) {
    const p = pl.people[b.pid]; if (!p || p.status !== 'free') continue;
    if (rnd() < 0.8) queueMessage(p);
  }
  if (rnd() < 0.35) { const free = pl.people.filter(p => p.status === 'free'); if (free.length) queueMessage(pick(free), true); }
}

function queueMessage(from, intercepted) {

  });
  g.drawImage(c, x, y, w, h);

// ---------- reusable menu ----------
function Menu(items, x, y, w, lh = 10) {
  return {
    items, x, y, w, lh, sel: Math.max(0, items.findIndex(i => !i.off)),
    move(d) { const n = this.items.length; for (let k = 0; k < n; k++) { this.sel = (this.sel + d + n) % n; if (!this.items[this.sel].off) break; } sfx.blip(); },
    key(k) {
      if (k === 'up') this.move(-1); else if (k === 'down') this.move(1);
      else if (k === 'select' || k === 'fire') { const it = this.items[this.sel]; if (it && !it.off) { sfx.select(); it.go(); } else sfx.deny(); return true; }
      return false;
    },
    tap(tx, ty) {
      for (let i = 0; i < this.items.length; i++) { const iy = this.y + i * this.lh; if (tx >= this.x - 4 && tx < this.x + this.w && ty >= iy - 1 && ty < iy + this.lh - 1) { this.sel = i; const it = this.items[i]; if (it.off) sfx.deny(); else { sfx.select(); it.go(); } return true; } }
      return false;
    },
    hover(tx, ty) { for (let i = 0; i < this.items.length; i++) { const iy = this.y + i * this.lh; if (tx >= this.x - 4 && tx < this.x + this.w && ty >= iy - 1 && ty < iy + this.lh - 1 && !this.items[i].off) this.sel = i; } },
    draw() {
      this.items.forEach((it, i) => {
        const iy = this.y + i * this.lh;
        if (i === this.sel) { rect(this.x - 4, iy - 1, this.w, this.lh - 1, P.BL2); rect(this.x - 4, iy - 1, 2, this.lh - 1, P.YE); }
        text(it.label, this.x, iy, it.off ? P.G2 : i === this.sel ? P.YE : P.G5);
        if (it.right) textR(it.right, this.x + this.w - 8, iy, it.off ? P.G2 : P.CY);
      });
    },
  };
}
// a scene that is just a menu over some art
function menuScene(opts) {
  return Object.assign({
    t: 0, update(dt) { this.t += dt; },
    onKey(k) { if (k === 'menu' && this.back) { sfx.blip(); this.back(); return; } this.menu.key(k); },
    onTap(x, y) { this.menu.tap(x, y); }, onHover(x, y) { this.menu.hover(x, y); },
  }, opts);
}
// full-screen message page: "press any key"
function pageScene(drawFn, next, opts = {}) {
  return {
    t: 0, update(dt) { this.t += dt; }, draw() { drawFn(this.t); if (this.t > 0.6) { const blink = (this.t * 2 | 0) % 2; if (blink) textC(opts.prompt || 'Press OK to continue', W / 2, H - 10, P.G4); } },
    onKey(k) { if (this.t > 0.4 && (k === 'select' || k === 'fire' || k === 'menu' || k === 'action')) { sfx.blip(); next(); } }, onTap() { if (this.t > 0.4) { sfx.blip(); next(); } },
  };
}

function travelScene() {

  const here = cityById(game.city);
  const hoursTo = c => Math.round(3 + dist(here.lon, here.lat, c.lon, c.lat) / 9);
  const pos = c => mapXY(c.lon, c.lat);
  function nearestInDir(dx, dy) {
    const [sx, sy] = pos(CITIES[sel]); let best = -1, bd = 1e9;
    CITIES.forEach((c, i) => { if (i === sel) return; const [x, y] = pos(c); const vx = x - sx, vy = y - sy; const along = vx * dx + vy * dy; if (along <= 0) return; const d = along + Math.abs(vx * dy - vy * dx) * 2.5; if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { sel = best; sfx.blip(); }
  }
  function fly() { const c = CITIES[sel]; if (c.id === game.city) { go(hubScene()); return; } flying = { from: pos(here), to: pos(c), t: 0, dest: c, h: hoursTo(c) }; sfx.tone(300, 1.2, 'sawtooth', 0.03, 200); }

      let best = -1, bd = 14; CITIES.forEach((c, i) => { const [cx, cy] = pos(c); const d = dist(x, y, cx, cy); if (d < bd) { bd = d; best = i; } });
      if (best >= 0) { if (best === sel) fly(); else { sel = best; sfx.blip(); } }
    },
    draw() {

      });

        const x = from[0] + (to[0] - from[0]) * t, y = from[1] + (to[1] - from[1]) * t - Math.sin(t * Math.PI) * 10;
        rect(x - 3, y, 7, 1, P.W); rect(x, y - 2, 1, 5, P.W); rect(x - 1, y - 2, 3, 1, P.G4);
      }
      rect(0, 116, W, 84, P.K); panel(0, 116, W, 84);
      const c = CITIES[sel];
      text('From ' + here.name + ' to', 14, 126, P.G4); bigText(c.name, 14, 136, 2, P.YE, P.K);

    }
    // roads
    for (const k of edge) {
      const [i, j, d] = k.split(',').map(Number); const [x, y] = nodeXY(i, j);

      else { rect(x - 4, y - 4, 8, DY + 8, P.G1); rect(x - 5, y - 4, 1, DY + 8, P.G3); rect(x + 4, y - 4, 1, DY + 8, P.G3); for (let yy = y + 5; yy < y + DY - 4; yy += 4) rect(x, yy, 1, 2, P.YE2); }
    }
    for (const [i, j] of nodes) { const [x, y] = nodeXY(i, j); if (nbrs(i, j).length) rect(x - 4, y - 4, 8, 8, P.G1); }
    if (night) { dither(0, 0, W, VH, 'rgba(0,0,0,0)', P.K, 9); for (let n = 0; n < 160; n++) px((n * 73) % W, (n * 151) % VH, n % 3 ? P.YE2 : P.YE); }
  });
  // ---- cars ----
  const cars = [];
  function mkCar(i, j, kind, col, speed) { const nb = nbrs(i, j); const [ni, nj] = pick(nb); const c = { a: [i, j], b: [ni, nj], s: rnd() * 10, v: speed, vmax: speed, kind, col, route: null, wait: 0 }; cars.push(c); return c; }
  const len = () => 0;
  function edgeLen(c) { return c.a[0] === c.b[0] ? DY : DX; }
  function carPos(c) { const [ax, ay] = nodeXY(...c.a), [bx, by] = nodeXY(...c.b); const L = edgeLen(c), k = c.s / L; const dx = Math.sign(bx - ax), dy = Math.sign(by - ay); return [ax + (bx - ax) * k - dy * 2, ay + (by - ay) * k + dx * 2, dx, dy]; }
  function route(from, to, noise = 0.5) { // Dijkstra with jittered weights
    const key = n => n[0] + ',' + n[1]; const D = new Map([[key(from), 0]]), prev = new Map(); const q = [[0, from]];

  }
  const start = [ri(0, 2), ri(0, NY - 1)];
  let dest; do { dest = [ri(NX - 3, NX - 1), ri(0, NY - 1)]; } while (Math.abs(dest[0] - start[0]) + Math.abs(dest[1] - start[1]) < 6);
  if (rnd() < 0.5) { start[0] = NX - 1 - start[0]; dest[0] = NX - 1 - dest[0]; }
  const sus = mkCar(start[0], start[1], 'suspect', P.RD2, 22 + level);
  sus.route = route(start, dest, 1.2); sus.b = sus.route.shift(); sus.s = 0; sus.a = start.slice();
  const agentsN = sk >= 4 ? 3 : 2; const agents = [];
  for (let n = 0; n < agentsN; n++) {
    let st; do { st = [clamp(start[0] + ri(-2, 2), 0, NX - 1), clamp(start[1] + ri(-2, 2), 0, NY - 1)]; } while ((st[0] === start[0] && st[1] === start[1]) || !nbrs(...st).length);
    const c = mkCar(st[0], st[1], 'agent', n === 0 ? P.CY : P.BL3, 30 + sk * 1.5); c.s = 0; c.fam = 0; c.idx = n; agents.push(c);
  }
  for (let n = 0; n < 12 + level * 2; n++) mkCar(ri(0, NX - 1), ri(0, NY - 1), 'civ', pick([P.W, P.YE, P.G4, P.BR3, P.PU2, P.GR3, P.TN]), 16 + rnd() * 10);
  let ctrl = 0, susp = 0, made = false, lostT = 0, t = 0, over = null, arrived = false, rams = 0, ramCool = 0, want = null, msg = 'Tail the red car. Keep close enough to follow, far enough not to be seen.', msgT = 5;
  const say = (m, d = 3) => { msg = m; msgT = d; };

  function atNode(c) {

  }
  function finish(win, why) { if (over) return; over = { win, why, t: 0 }; win ? sfx.success() : sfx.fail(); }
  const scene = {
    update(dt) {
      t += dt; if (msgT > 0) msgT -= dt; ramCool -= dt;
      if (over) { over.t += dt; return; }
      const ax = input.axis(); if (ax.x || ax.y) want = ax.x ? [ax.x, 0] : [0, ax.y];
      const c0 = me();
      // reversing on the spot
      if (want && !c0.stopped) { const dx = c0.b[0] - c0.a[0], dy = c0.b[1] - c0.a[1]; if (want[0] === -dx && want[1] === -dy && (dx || dy)) { const L = edgeLen(c0); [c0.a, c0.b] = [c0.b, c0.a]; c0.s = L - c0.s; want = null; } }
      if (c0.stopped && want) { c0.stopped = false; atNode(c0); }
      if (c0.parked) { c0.parked = false; c0.v = c0.vmax * 0.5; }
      for (const c of cars) {
        if (c.parked) continue; if (c.stopped) continue;
        let target = c.vmax * (c === c0 && input.held('fire') ? 0.35 : 1) * (c.kind === 'suspect' && made ? 1.45 : 1);
        if (c.kind === 'agent' && c !== c0) target = 0;
        const a = ahead(c); if (a) { const [o, d] = a; if (d < 12) target = Math.min(target, o.v * 0.9); if (d < 7) target = 0; if (d < 6 && c === c0 && o === sus && ramCool <= 0) { rams++; ramCool = 1; sfx.noise(0.15, 0.2, 200); susp = 100; if (!made) { made = true; say('You rammed them! They know they are being followed.'); } if (rams >= 3) { finish(true, 'captured'); } } }
        c.v += (target - c.v) * Math.min(1, dt * 3);

    onKey(k) {

    },
    onTap(x, y) {
      if (over) { if (over.t > 0.6) done({ success: over.win, how: over.why }); return; }

    },
    draw() {

// ===================================================================
// MAIN: glue between the city hub and the minigames
// ===================================================================
let practiceMode = false;
function afterMission(hours, next) { advanceTime(hours); if (practiceMode) { go(titleScene()); return; } if (!checkCaseEnd()) next(); }

// who is the break-in / wiretap / tail target in this city?
function localTarget(preferMobile) {
  const here = peopleIn(game.city); if (!here.length) return null;
  const pool = preferMobile ? here.filter(p => p.role.mobile) : here;
  return pick(pool.length ? pool : here);
}
const FRONTS = ['Import-Export', 'Travel Agency', 'Shipping Co.', 'Trading House', 'Consulting', 'Holdings', 'Freight Services'];

function startBreakin() {
  const p = localTarget(false);
  const org = p ? p.org : pick(ORGS);
  const front = (p ? p.name.split(' ')[1] : pick(NAMES[cityById(game.city).names][2])) + ' ' + pick(FRONTS);
  const brief = p
    ? 'Target: the offices of "' + front + '", ' + cityById(game.city).name + '. Local sources say the building is used by ' + (p.known.org ? 'the ' + p.org.name : 'a hostile group') + '. The occupant' + (p.known.name || p.known.photo ? ' is believed to be ' + p.code : '') + ' works on the top floor.\n\nSearch desks, files and safes. Bring the occupant out alive if you can. Leave by the door you came in.'
    : 'Target: "' + front + '", ' + cityById(game.city).name + '. Our informants have seen nothing here lately, but it is the best lead we have. It may be a dry hole.\n\nSearch what you can and get out.';
  go(loadoutScene(brief, kit => {
    go(breakinScene(Object.assign({ level: game.level, occupant: p, org }, kit), res => {
      let hours = 5;
      if (res.kind === 'dead') { hours = 48; game.agent.health = Math.max(1, game.agent.health - 1); }
      if (res.kind === 'police') hours = 24;
      if (res.kills.civ) game.score -= 15 * res.kills.civ;
      game.score += res.clues.length * 3;
      if (p) p.seen = true;
      if (res.killedTarget) { res.killedTarget.status = 'dead'; FACETS.forEach(f => res.killedTarget.known[f] = true); game.score -= 10; }
      if (res.captured) { const c = res.captured; c.status = 'arrested'; const pts = c.role.tier === 3 ? 60 : c.role.tier === 2 ? 25 : 10; game.score += pts; FACETS.forEach(f => c.known[f] = true); afterMission(hours, () => go(interrogationScene(c, 'capture', pts))); return; }

}
function startWiretap() {
  const p = localTarget(false);
  go(wiretapScene({ level: game.level, label: p ? (p.known.name ? p.name : 'suspect') + "'s line" : 'Front company line' }, res => {
    const out = [];
    if (res.success) {
      game.score += 5;
      if (p) { p.seen = true; if (!game.bugs.some(b => b.pid === p.id)) game.bugs.push({ pid: p.id }); const c = clueFrom(p, 0.2); if (c) out.push('Phone company records: ' + c); queueMessage(p); out.push('A message has already been recorded. Decode it from the city menu.'); }

}
function startChase() {
  const p = localTarget(true);
  const label = p ? (p.known.name || p.known.photo ? p.code : 'a suspect') + "'s car" : 'a delivery van';
  go(chaseScene({ level: game.level, label }, res => {
    const out = [];
    if (p) {
      p.seen = true;
      if (res.how === 'captured') { p.status = 'arrested'; FACETS.forEach(f => p.known[f] = true); const pts = p.role.tier === 3 ? 60 : p.role.tier === 2 ? 25 : 10; game.score += pts; afterMission(4, () => go(interrogationScene(p, 'capture', pts))); return; }

function startCrypto(i) {
  const m = game.messages[i]; if (!m) { go(hubScene()); return; }
  go(cryptoScene(m.text, { source: m.src + ', day ' + m.day }, res => {
    const out = [];
    if (res.success) {
      game.messages.splice(i, 1); game.score += 4;

function missionReport(title, lines) {

    text(title + ' REPORT', 28, 30, P.YE); textR(timeStr(), W - 28, 30, P.CY); rect(28, 40, W - 56, 1, P.G2);

}
function practice(kind) {
